name: AICAP Free Video Renderer - Test 02

on:
  workflow_dispatch:

jobs:
  render-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install FFmpeg
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "TEST 02"
          echo "INSTALLING FFMPEG"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg installation completed."

      - name: Verify FFmpeg
        run: |
          echo "======================================"
          echo "FFMPEG VERIFICATION"
          echo "======================================"

          ffmpeg -version | head -n 3

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg : AVAILABLE"
            echo "FFmpeg Path : $(which ffmpeg)"
          else
            echo "FFmpeg : NOT AVAILABLE"
            exit 1
          fi

      - name: Validate AICAP real assets
        run: |
          echo "======================================"
          echo "VALIDATING REAL AICAP ASSETS"
          echo "======================================"

          IMAGE="AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg"
          AUDIO="AI_in_60_Seconds_DEFAULT_20260811_190008.mp3"

          if [ ! -f "$IMAGE" ]; then
            echo "ERROR: Image not found:"
            echo "$IMAGE"
            exit 1
          fi

          if [ ! -f "$AUDIO" ]; then
            echo "ERROR: Narration not found:"
            echo "$AUDIO"
            exit 1
          fi

          IMAGE_SIZE=$(stat -c%s "$IMAGE")
          AUDIO_SIZE=$(stat -c%s "$AUDIO")

          echo "Image File : $IMAGE"
          echo "Image Size : $IMAGE_SIZE bytes"

          echo "Audio File : $AUDIO"
          echo "Audio Size : $AUDIO_SIZE bytes"

          if [ "$IMAGE_SIZE" -le 0 ]; then
            echo "ERROR: Image file is empty."
            exit 1
          fi

          if [ "$AUDIO_SIZE" -le 0 ]; then
            echo "ERROR: Audio file is empty."
            exit 1
          fi

          echo "======================================"
          echo "REAL ASSET VALIDATION : PASSED"
          echo "======================================"

      - name: Inspect real AICAP image
        run: |
          echo "======================================"
          echo "INSPECTING AICAP IMAGE"
          echo "======================================"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,pix_fmt,codec_name \
            -of default=noprint_wrappers=1 \
            AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg

      - name: Inspect real AICAP narration
        run: |
          echo "======================================"
          echo "INSPECTING AICAP NARRATION"
          echo "======================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            AI_in_60_Seconds_DEFAULT_20260811_190008.mp3

      - name: Render Test 02
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "TEST 02"
          echo "REAL IMAGE + REAL NARRATION"
          echo "======================================"

          mkdir -p output

          ffmpeg \
            -y \
            -loop 1 \
            -i AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg \
            -i AI_in_60_Seconds_DEFAULT_20260811_190008.mp3 \
            -t 15 \
            -r 30 \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 192k \
            -shortest \
            -movflags +faststart \
            output/AICAP_FREE_TEST_02_IMAGE_NARRATION.mp4

          echo "======================================"
          echo "TEST 02 RENDER COMPLETED"
          echo "======================================"

          ls -lh output/AICAP_FREE_TEST_02_IMAGE_NARRATION.mp4

      - name: Verify Test 02 video
        run: |
          echo "======================================"
          echo "VERIFYING TEST 02 VIDEO"
          echo "======================================"

          VIDEO="output/AICAP_FREE_TEST_02_IMAGE_NARRATION.mp4"

          if [ ! -f "$VIDEO" ]; then
            echo "ERROR: Test 02 MP4 was not created."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$VIDEO")

          echo "Output File : $VIDEO"
          echo "File Size   : $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "ERROR: Output file is empty."
            exit 1
          fi

          echo "--------------------------------------"
          echo "VIDEO STREAM"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "--------------------------------------"
          echo "AUDIO STREAM"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "--------------------------------------"
          echo "FORMAT"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "======================================"
          echo "TEST 02 VIDEO VERIFICATION : PASSED"
          echo "======================================"

      - name: Upload Test 02 MP4
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-TEST-02-IMAGE-NARRATION
          path: output/AICAP_FREE_TEST_02_IMAGE_NARRATION.mp4
          retention-days: 1

      - name: Final Test 02 result
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "TEST 02 FINAL"
          echo "======================================"

          echo "Status       : PASSED"
          echo "Image        : REAL AICAP IMAGE"
          echo "Narration    : REAL AICAP AUDIO"
          echo "Resolution   : 1080x1920"
          echo "FPS          : 30"
          echo "Duration     : 15 seconds"
          echo "Video Codec  : H.264"
          echo "Audio Codec  : AAC"
          echo "Output       : AICAP_FREE_TEST_02_IMAGE_NARRATION.mp4"

          echo "======================================"
          echo "TEST STATUS : PASSED"
          echo "======================================"
