name: AICAP Free Video Renderer - Test

on:
  workflow_dispatch:

jobs:
  render-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install FFmpeg
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "INSTALLING FFMPEG"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "======================================"
          echo "FFMPEG INSTALLATION COMPLETE"
          echo "======================================"

      - name: Show FFmpeg version
        run: |
          echo "======================================"
          echo "FFMPEG VERSION"
          echo "======================================"

          ffmpeg -version | head -n 3

      - name: Verify FFmpeg
        run: |
          echo "======================================"
          echo "FFMPEG AVAILABILITY TEST"
          echo "======================================"

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg : AVAILABLE"
            echo "FFmpeg Path : $(which ffmpeg)"
          else
            echo "FFmpeg : NOT AVAILABLE"
            exit 1
          fi

      - name: Renderer environment test
        run: |
          echo "======================================"
          echo "AICAP RENDERER ENVIRONMENT"
          echo "======================================"

          echo "Operating System:"
          uname -a

          echo "CPU Information:"
          nproc

          echo "Disk Space:"
          df -h /

          echo "======================================"
          echo "ENVIRONMENT TEST : PASSED"
          echo "======================================"
