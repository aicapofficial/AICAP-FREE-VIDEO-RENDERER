name: AICAP Free Video Renderer - Test

on:
  workflow_dispatch:

jobs:
  render-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show FFmpeg version
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "======================================"
          echo "FFmpeg version:"
          ffmpeg -version | head -n 1

      - name: Verify FFmpeg
        run: |
          echo "======================================"
          echo "FFMPEG AVAILABILITY TEST"
          echo "======================================"

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg : AVAILABLE"
            echo "FFmpeg Path : $(which ffmpeg)"
          else
            echo "FFmpeg : NOT AVAILABLE"
            exit 1
          fi

      - name: Renderer environment test
        run: |
          echo "======================================"
          echo "AICAP RENDERER ENVIRONMENT"
          echo "======================================"
          echo "Operating System : $(uname -a)"
          echo "CPU Information:"
          nproc
          echo "Disk Space:"
          df -h /
          echo "======================================"
          echo "ENVIRONMENT TEST : PASSED"
          echo "======================================"
