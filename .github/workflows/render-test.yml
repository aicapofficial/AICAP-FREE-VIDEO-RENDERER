name: AICAP Free Video Renderer - Test 01

on:
  workflow_dispatch:

jobs:
  render-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install FFmpeg
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "INSTALLING FFMPEG"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg installation completed."

      - name: Verify FFmpeg
        run: |
          echo "======================================"
          echo "FFMPEG VERIFICATION"
          echo "======================================"

          ffmpeg -version | head -n 3

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg : AVAILABLE"
            echo "FFmpeg Path : $(which ffmpeg)"
          else
            echo "FFmpeg : NOT AVAILABLE"
            exit 1
          fi

      - name: Create AICAP test image
        run: |
          echo "======================================"
          echo "CREATING TEST IMAGE"
          echo "======================================"

          mkdir -p input
          mkdir -p output

          ffmpeg \
            -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920" \
            -frames:v 1 \
            input/AICAP_TEST_IMAGE.png

          echo "Test image created:"
          ls -lh input/AICAP_TEST_IMAGE.png

      - name: Render 15 second AICAP video
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDER"
          echo "======================================"

          ffmpeg \
            -y \
            -loop 1 \
            -i input/AICAP_TEST_IMAGE.png \
            -t 15 \
            -r 30 \
            -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/AICAP_FREE_TEST_01.mp4

          echo "======================================"
          echo "VIDEO RENDER COMPLETED"
          echo "======================================"

          ls -lh output/AICAP_FREE_TEST_01.mp4

      - name: Verify rendered video
        run: |
          echo "======================================"
          echo "VERIFYING OUTPUT VIDEO"
          echo "======================================"

          if [ ! -f output/AICAP_FREE_TEST_01.mp4 ]; then
            echo "ERROR: MP4 file was not created."
            exit 1
          fi

          FILE_SIZE=$(stat -c%s output/AICAP_FREE_TEST_01.mp4)

          echo "Output File : AICAP_FREE_TEST_01.mp4"
          echo "File Size   : ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "ERROR: Output file is empty."
            exit 1
          fi

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 \
            output/AICAP_FREE_TEST_01.mp4

          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            output/AICAP_FREE_TEST_01.mp4

          echo "======================================"
          echo "VIDEO VERIFICATION : PASSED"
          echo "======================================"

      - name: Upload rendered MP4 as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: AICAP-FREE-TEST-01-VIDEO
          path: output/AICAP_FREE_TEST_01.mp4
          retention-days: 1

      - name: Final test result
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER TEST 01"
          echo "======================================"
          echo "Status       : PASSED"
          echo "Resolution   : 1080x1920"
          echo "FPS          : 30"
          echo "Duration     : 15 seconds"
          echo "Codec        : H.264"
          echo "Audio        : NONE"
          echo "Output       : AICAP_FREE_TEST_01.mp4"
          echo "======================================"
