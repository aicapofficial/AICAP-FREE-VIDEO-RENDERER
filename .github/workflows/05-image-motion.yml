name: AICAP FREE RENDER — 05 — IMAGE MOTION

on:
  workflow_dispatch:

jobs:
  render-test-05:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 02. INSTALL FFMPEG
      # ==========================================================

      - name: Install FFmpeg
        run: |
          echo "======================================"
          echo "AICAP FREE RENDER"
          echo "05 — IMAGE MOTION"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg installation completed."


      # ==========================================================
      # 03. VERIFY FFMPEG
      # ==========================================================

      - name: Verify FFmpeg
        run: |
          echo "======================================"
          echo "FFMPEG VERIFICATION"
          echo "======================================"

          ffmpeg -version | head -n 3

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg : AVAILABLE"
            echo "FFmpeg Path : $(which ffmpeg)"
          else
            echo "FFmpeg : NOT AVAILABLE"
            exit 1
          fi


      # ==========================================================
      # 04. DEFINE REAL AICAP ASSETS
      # ==========================================================

      - name: Define AICAP assets
        run: |
          echo "======================================"
          echo "AICAP REAL ASSETS"
          echo "======================================"

          echo "Image:"
          echo "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg"

          echo "Narration:"
          echo "AI_in_60_Seconds_DEFAULT_20260811_190008.mp3"


      # ==========================================================
      # 05. VALIDATE REAL ASSETS
      # ==========================================================

      - name: Validate real AICAP assets
        run: |
          echo "======================================"
          echo "VALIDATING REAL AICAP ASSETS"
          echo "======================================"

          IMAGE="AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg"
          AUDIO="AI_in_60_Seconds_DEFAULT_20260811_190008.mp3"

          for FILE in "$IMAGE" "$AUDIO"
          do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing asset:"
              echo "$FILE"
              exit 1
            fi

            SIZE=$(stat -c%s "$FILE")

            echo "File : $FILE"
            echo "Size : $SIZE bytes"
            echo "--------------------------------------"

            if [ "$SIZE" -le 0 ]; then
              echo "ERROR: Empty asset:"
              echo "$FILE"
              exit 1
            fi
          done

          echo "======================================"
          echo "REAL ASSETS : VERIFIED"
          echo "======================================"


      # ==========================================================
      # 06. INSPECT INPUT IMAGE
      # ==========================================================

      - name: Inspect input image
        run: |
          echo "======================================"
          echo "INPUT IMAGE INSPECTION"
          echo "======================================"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,codec_name,pix_fmt \
            -of default=noprint_wrappers=1 \
            AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg


      # ==========================================================
      # 07. INSPECT NARRATION
      # ==========================================================

      - name: Inspect narration
        run: |
          echo "======================================"
          echo "NARRATION INSPECTION"
          echo "======================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            AI_in_60_Seconds_DEFAULT_20260811_190008.mp3


      # ==========================================================
      # 08. CREATE WORKING DIRECTORIES
      # ==========================================================

      - name: Create working directories
        run: |
          mkdir -p work
          mkdir -p output

          echo "Working directories created."


      # ==========================================================
      # 09. CREATE IMAGE MOTION VIDEO
      #
      # 15 SECOND KEN BURNS EFFECT
      #
      # Gradual zoom:
      #   1.00x -> 1.15x
      #
      # Horizontal movement:
      #   left -> right
      #
      # Smooth easing:
      #   sine-style progression
      # ==========================================================

      - name: Render image motion
        run: |
          echo "======================================"
          echo "AICAP IMAGE MOTION"
          echo "======================================"

          echo "Duration       : 15 seconds"
          echo "Resolution     : 1080x1920"
          echo "FPS            : 30"
          echo "Zoom           : 1.00x -> 1.15x"
          echo "Pan            : LEFT -> RIGHT"
          echo "Motion         : SMOOTH"
          echo "======================================"

          ffmpeg \
            -y \
            -loop 1 \
            -i AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg \
            -t 15 \
            -filter_complex "\
            [0:v]scale=2160:3840:force_original_aspect_ratio=increase,\
            crop=2160:3840,\
            zoompan=\
            z='1.0+0.15*(0.5-0.5*cos(PI*on/449))':\
            x='(iw-iw/zoom)*(0.5-0.5*cos(PI*on/449))':\
            y='(ih-ih/zoom)/2':\
            d=1:\
            s=1080x1920:\
            fps=30,\
            format=yuv420p[v]" \
            -map "[v]" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            work/image_motion.mp4

          echo "======================================"
          echo "IMAGE MOTION RENDER COMPLETED"
          echo "======================================"


      # ==========================================================
      # 10. VERIFY MOTION VIDEO
      # ==========================================================

      - name: Verify image motion video
        run: |
          echo "======================================"
          echo "VERIFYING IMAGE MOTION VIDEO"
          echo "======================================"

          VIDEO="work/image_motion.mp4"

          if [ ! -f "$VIDEO" ]; then
            echo "ERROR: Image motion video was not created."
            exit 1
          fi

          SIZE=$(stat -c%s "$VIDEO")

          echo "File Size : $SIZE bytes"

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Video file is empty."
            exit 1
          fi

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "======================================"
          echo "IMAGE MOTION VIDEO : VERIFIED"
          echo "======================================"


      # ==========================================================
      # 11. ADD REAL AICAP NARRATION
      #
      # The narration is padded with silence so the video
      # remains exactly 15 seconds.
      # ==========================================================

      - name: Add real AICAP narration
        run: |
          echo "======================================"
          echo "ADDING REAL AICAP NARRATION"
          echo "======================================"

          ffmpeg \
            -y \
            -i work/image_motion.mp4 \
            -i AI_in_60_Seconds_DEFAULT_20260811_190008.mp3 \
            -filter_complex "[1:a]apad[a]" \
            -map 0:v:0 \
            -map "[a]" \
            -t 15 \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output/AICAP_FREE_05_IMAGE_MOTION.mp4

          echo "Narration added."


      # ==========================================================
      # 12. FINAL VIDEO VERIFICATION
      # ==========================================================

      - name: Verify final Test 05 video
        run: |
          echo "======================================"
          echo "AICAP FREE RENDER"
          echo "05 — IMAGE MOTION"
          echo "FINAL VERIFICATION"
          echo "======================================"

          VIDEO="output/AICAP_FREE_05_IMAGE_MOTION.mp4"

          if [ ! -f "$VIDEO" ]; then
            echo "ERROR: Final video was not created."
            exit 1
          fi

          SIZE=$(stat -c%s "$VIDEO")

          echo "Output File : $VIDEO"
          echo "File Size   : $SIZE bytes"

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Output video is empty."
            exit 1
          fi

          echo "--------------------------------------"
          echo "VIDEO STREAM"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "--------------------------------------"
          echo "AUDIO STREAM"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "--------------------------------------"
          echo "FINAL FORMAT"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "======================================"
          echo "EXPECTED"
          echo "======================================"
          echo "Resolution     : 1080x1920"
          echo "FPS            : 30"
          echo "Duration       : 15 seconds"
          echo "Zoom           : 1.00x -> 1.15x"
          echo "Pan            : LEFT -> RIGHT"
          echo "Motion         : SMOOTH"
          echo "Narration      : REAL AICAP AUDIO"
          echo "Video Codec    : H.264"
          echo "Audio Codec    : AAC"
          echo "======================================"


      # ==========================================================
      # 13. UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload Test 05 MP4
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-05-IMAGE-MOTION
          path: output/AICAP_FREE_05_IMAGE_MOTION.mp4
          retention-days: 1


      # ==========================================================
      # 14. FINAL RESULT
      # ==========================================================

      - name: Test 05 final result
        run: |
          echo "======================================"
          echo "AICAP FREE RENDER"
          echo "05 — IMAGE MOTION"
          echo "======================================"

          echo "STATUS            : PASSED"
          echo "IMAGE             : REAL AICAP IMAGE"
          echo "DURATION          : 15 seconds"
          echo "RESOLUTION        : 1080x1920"
          echo "FPS               : 30"
          echo "ZOOM              : 1.00x -> 1.15x"
          echo "PAN               : LEFT -> RIGHT"
          echo "MOTION            : SMOOTH"
          echo "NARRATION         : REAL AICAP AUDIO"
          echo "VIDEO CODEC       : H.264"
          echo "AUDIO CODEC       : AAC"
          echo "OUTPUT            : AICAP_FREE_05_IMAGE_MOTION.mp4"
          echo "ARTIFACT          : AICAP-FREE-05-IMAGE-MOTION"

          echo "======================================"
          echo "TEST 05 STATUS : PASSED"
          echo "======================================"
