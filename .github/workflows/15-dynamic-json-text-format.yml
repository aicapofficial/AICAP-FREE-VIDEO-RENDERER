          INLINE FONT SIZE:
          VERIFIED

          INLINE COLOR:
          VERIFIED

          INLINE BOLD:
          VERIFIED

          INLINE ITALIC:
          VERIFIED

          OUTLINE:
          VERIFIED

          SHADOW:
          VERIFIED

          POSITION:
          VERIFIED

          ASS EVENTS:
          VERIFIED

          NARRATION:
          VERIFIED

          FINAL MP4:
          VERIFIED

          OUTPUT:
          AICAP_FREE_15_LARGE_CLEAR_INLINE_SUBTITLES.mp4
          EOF

          cat work/test15-report.txt


      # ==========================================================
      # 23. UPLOAD MP4
      # ==========================================================

      - name: Upload large clear MP4
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-15-LARGE-CLEAR-INLINE-SUBTITLES
          path: output/AICAP_FREE_15_LARGE_CLEAR_INLINE_SUBTITLES.mp4
          retention-days: 1


      # ==========================================================
