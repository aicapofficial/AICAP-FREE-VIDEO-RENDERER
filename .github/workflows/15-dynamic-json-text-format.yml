name: AICAP FREE VIDEO RENDER — 15 — LARGE CLEAR DYNAMIC SUBTITLES

on:
  workflow_dispatch:

jobs:
  render-test-15:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 02. INSTALL TOOLS
      # ==========================================================

      - name: Install FFmpeg and jq
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "TEST 15 — LARGE CLEAR DYNAMIC SUBTITLES"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

          echo "FFmpeg : INSTALLED"
          echo "jq     : INSTALLED"


      # ==========================================================
      # 03. VERIFY TOOLS
      # ==========================================================

      - name: Verify rendering tools
        run: |
          echo "======================================"
          echo "TOOL VERIFICATION"
          echo "======================================"

          command -v ffmpeg
          command -v jq

          ffmpeg -version | head -n 1
          jq --version

          echo "TOOLS : VERIFIED"


      # ==========================================================
      # 04. CREATE TEST JSON
      # ==========================================================

      - name: Create Test 15 JSON
        run: |
          echo "======================================"
          echo "CREATING TEST 15 JSON"
          echo "======================================"

          cat > scene_config.json <<'EOF'
          {
            "project": {
              "name": "AICAP_TEST_15_LARGE_CLEAR_DYNAMIC_SUBTITLES",
              "resolution": {
                "width": 1080,
                "height": 1920
              },
              "fps": 30,
              "total_duration": 60
            },

            "transition": {
              "type": "fade",
              "duration": 1
            },

            "narration": {
              "enabled": true,
              "source": "AI_in_60_Seconds_DEFAULT_20260811_190008.mp3",
              "mode": "timeline_sync",

              "segments": [
                {
                  "id": 1,
                  "start": 0,
                  "duration": 10,
                  "end": 10
                },
                {
                  "id": 2,
                  "start": 10,
                  "duration": 15,
                  "end": 25
                },
                {
                  "id": 3,
                  "start": 25,
                  "duration": 15,
                  "end": 40
                },
                {
                  "id": 4,
                  "start": 40,
                  "duration": 20,
                  "end": 60
                }
              ]
            },

            "scenes": [

              {
                "id": 1,
                "image": "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg",
                "start": 0,
                "duration": 10,
                "end": 10,
                "motion": "zoom_in",

                "subtitle": {
                  "enabled": true,
                  "text": "Artificial intelligence is changing the world.",

                  "style": {
                    "font": "Arial",
                    "size": 120,
                    "color": "#FFFFFF",
                    "bold": true,
                    "italic": false,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1580
                    },

                    "outline": 5,
                    "shadow": 3,
                    "margin": 90
                  }
                }
              },

              {
                "id": 2,
                "image": "AICAP_SECTION10_SCENE02_CLOUDFLARE_20260814_122220.jpg",
                "start": 10,
                "duration": 15,
                "end": 25,
                "motion": "zoom_out",

                "subtitle": {
                  "enabled": true,
                  "text": "It helps people work faster and smarter.",

                  "style": {
                    "font": "Arial",
                    "size": 112,
                    "color": "#FFFF00",
                    "bold": false,
                    "italic": true,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1580
                    },

                    "outline": 5,
                    "shadow": 3,
                    "margin": 90
                  }
                }
              },

              {
                "id": 3,
                "image": "AICAP_SECTION10_SCENE03_CLOUDFLARE_20260814_122224.jpg",
                "start": 25,
                "duration": 15,
                "end": 40,
                "motion": "pan_left",

                "subtitle": {
                  "enabled": true,
                  "text": "Creative tools can turn ideas into powerful stories.",

                  "style": {
                    "font": "Arial",
                    "size": 115,
                    "color": "#00FFFF",
                    "bold": true,
                    "italic": true,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1510
                    },

                    "outline": 5,
                    "shadow": 3,
                    "margin": 90
                  }
                }
              },

              {
                "id": 4,
                "image": "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg",
                "start": 40,
                "duration": 20,
                "end": 60,
                "motion": "pan_right",

                "subtitle": {
                  "enabled": true,
                  "text": "AICAP can bring the complete story together.",

                  "style": {
                    "font": "Arial",
                    "size": 120,
                    "color": "#00FF00",
                    "bold": false,
                    "italic": false,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1580
                    },

                    "outline": 5,
                    "shadow": 3,
                    "margin": 90
                  }
                }
              }
            ]
          }
          EOF

          echo "TEST 15 JSON CREATED"


      # ==========================================================
      # 05. VALIDATE JSON
      # ==========================================================

      - name: Validate JSON
        run: |
          echo "======================================"
          echo "JSON VALIDATION"
          echo "======================================"

          jq empty scene_config.json

          echo "JSON : VALID"


      # ==========================================================
      # 06. READ GLOBAL CONFIGURATION
      # ==========================================================

      - name: Read global configuration
        run: |
          WIDTH=$(jq -r '.project.resolution.width' scene_config.json)
          HEIGHT=$(jq -r '.project.resolution.height' scene_config.json)
          FPS=$(jq -r '.project.fps' scene_config.json)
          TARGET_DURATION=$(jq -r '.project.total_duration' scene_config.json)
          TRANSITION_DURATION=$(jq -r '.transition.duration' scene_config.json)

          echo "WIDTH=$WIDTH" >> "$GITHUB_ENV"
          echo "HEIGHT=$HEIGHT" >> "$GITHUB_ENV"
          echo "FPS=$FPS" >> "$GITHUB_ENV"
          echo "TARGET_DURATION=$TARGET_DURATION" >> "$GITHUB_ENV"
          echo "TRANSITION_DURATION=$TRANSITION_DURATION" >> "$GITHUB_ENV"

          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "FPS        : $FPS"
          echo "Duration   : $TARGET_DURATION"
          echo "Transition : $TRANSITION_DURATION"


      # ==========================================================
      # 07. VALIDATE SCENE TIMELINE
      # ==========================================================

      - name: Validate scene timeline
        run: |
          echo "======================================"
          echo "SCENE TIMELINE VALIDATION"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          EXPECTED_START=0

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            START=$(jq -r ".scenes[$INDEX].start" scene_config.json)
            DURATION=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            END=$(jq -r ".scenes[$INDEX].end" scene_config.json)

            echo "Scene $ID : $START → $END"

            if [ "$START" -ne "$EXPECTED_START" ]; then
              echo "ERROR: Scene $ID start mismatch."
              exit 1
            fi

            CALCULATED_END=$((START + DURATION))

            if [ "$END" -ne "$CALCULATED_END" ]; then
              echo "ERROR: Scene $ID end mismatch."
              exit 1
            fi

            EXPECTED_START=$END
          done

          if [ "$EXPECTED_START" -ne "$TARGET_DURATION" ]; then
            echo "ERROR: Timeline does not equal target duration."
            exit 1
          fi

          echo "SCENE TIMELINE : VALID"


      # ==========================================================
      # 08. VALIDATE NARRATION TIMELINE
      # ==========================================================

      - name: Validate narration timeline
        run: |
          echo "======================================"
          echo "NARRATION TIMELINE VALIDATION"
          echo "======================================"

          COUNT=$(jq '.narration.segments | length' scene_config.json)

          EXPECTED_START=0

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            ID=$(jq -r ".narration.segments[$INDEX].id" scene_config.json)
            START=$(jq -r ".narration.segments[$INDEX].start" scene_config.json)
            DURATION=$(jq -r ".narration.segments[$INDEX].duration" scene_config.json)
            END=$(jq -r ".narration.segments[$INDEX].end" scene_config.json)

            echo "Narration $ID : $START → $END"

            if [ "$START" -ne "$EXPECTED_START" ]; then
              echo "ERROR: Narration start mismatch."
              exit 1
            fi

            CALCULATED_END=$((START + DURATION))

            if [ "$END" -ne "$CALCULATED_END" ]; then
              echo "ERROR: Narration end mismatch."
              exit 1
            fi

            EXPECTED_START=$END
          done

          if [ "$EXPECTED_START" -ne "$TARGET_DURATION" ]; then
            echo "ERROR: Narration timeline mismatch."
            exit 1
          fi

          echo "NARRATION TIMELINE : VALID"


      # ==========================================================
      # 09. SCENE / NARRATION SYNC
      # ==========================================================

      - name: Verify scene narration synchronization
        run: |
          echo "======================================"
          echo "SCENE / NARRATION SYNCHRONIZATION"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)
          NARRATION_COUNT=$(jq '.narration.segments | length' scene_config.json)

          if [ "$SCENE_COUNT" -ne "$NARRATION_COUNT" ]; then
            echo "ERROR: Scene and narration counts differ."
            exit 1
          fi

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do
            SCENE_START=$(jq -r ".scenes[$INDEX].start" scene_config.json)
            SCENE_END=$(jq -r ".scenes[$INDEX].end" scene_config.json)

            NARR_START=$(jq -r ".narration.segments[$INDEX].start" scene_config.json)
            NARR_END=$(jq -r ".narration.segments[$INDEX].end" scene_config.json)

            if [ "$SCENE_START" -ne "$NARR_START" ]; then
              echo "ERROR: Start mismatch."
              exit 1
            fi

            if [ "$SCENE_END" -ne "$NARR_END" ]; then
              echo "ERROR: End mismatch."
              exit 1
            fi
          done

          echo "SCENE / NARRATION SYNC : VALID"


      # ==========================================================
      # 10. VERIFY LARGE SUBTITLE SETTINGS
      # ==========================================================

      - name: Verify large subtitle settings
        run: |
          echo "======================================"
          echo "LARGE SUBTITLE SETTINGS"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            SIZE=$(jq -r ".scenes[$INDEX].subtitle.style.size" scene_config.json)
            COLOR=$(jq -r ".scenes[$INDEX].subtitle.style.color" scene_config.json)
            BOLD=$(jq -r ".scenes[$INDEX].subtitle.style.bold" scene_config.json)
            ITALIC=$(jq -r ".scenes[$INDEX].subtitle.style.italic" scene_config.json)

            echo "Scene $ID"
            echo "Font size : $SIZE"
            echo "Color     : $COLOR"
            echo "Bold      : $BOLD"
            echo "Italic    : $ITALIC"

            if [ "$SIZE" -lt 100 ]; then
              echo "ERROR: Subtitle size is below 100."
              exit 1
            fi

          done

          echo "LARGE SUBTITLE SETTINGS : VERIFIED"


      # ==========================================================
      # 11. VERIFY ASSETS
      # ==========================================================

      - name: Verify assets
        run: |
          echo "======================================"
          echo "ASSET VERIFICATION"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)

            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: Missing image: $IMAGE"
              exit 1
            fi

            echo "FOUND: $IMAGE"
          done

          AUDIO=$(jq -r '.narration.source' scene_config.json)

          if [ ! -f "$AUDIO" ]; then
            echo "ERROR: Missing audio: $AUDIO"
            exit 1
          fi

          echo "FOUND: $AUDIO"

          mkdir -p work
          mkdir -p output

          echo "ASSETS : VERIFIED"


      # ==========================================================
      # 12. RENDER SCENES
      # ==========================================================

      - name: Render scenes
        shell: bash
        run: |
          echo "======================================"
          echo "RENDERING SCENES"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)
            DURATION=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            MOTION=$(jq -r ".scenes[$INDEX].motion" scene_config.json)

            if [ "$INDEX" -lt $((COUNT - 1)) ]; then
              RENDER_DURATION=$((DURATION + TRANSITION_DURATION))
            else
              RENDER_DURATION="$DURATION"
            fi

            OUTPUT="work/scene_${ID}.mp4"

            echo "--------------------------------------"
            echo "Scene    : $ID"
            echo "Duration : $DURATION"
            echo "Render   : $RENDER_DURATION"
            echo "Motion   : $MOTION"
            echo "--------------------------------------"

            case "$MOTION" in

              zoom_in)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='min(zoom+0.0015,1.15)':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              zoom_out)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='if(eq(on,0),1.15,max(zoom-0.0015,1.0))':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              pan_left)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='1.10':x='(iw-iw/zoom)*(1-on/(30*${RENDER_DURATION}))':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              pan_right)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='1.10':x='(iw-iw/zoom)*(on/(30*${RENDER_DURATION}))':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              *)

                echo "ERROR: Unsupported motion: $MOTION"
                exit 1
                ;;

            esac

            if [ ! -f "$OUTPUT" ]; then
              echo "ERROR: Scene $ID was not rendered."
              exit 1
            fi

            SIZE=$(stat -c%s "$OUTPUT")

            if [ "$SIZE" -le 0 ]; then
              echo "ERROR: Scene $ID output is empty."
              exit 1
            fi

            echo "Scene $ID : RENDERED"

          done

          echo "ALL SCENES : RENDERED"


      # ==========================================================
      # 13. VERIFY SCENE DURATIONS
      # ==========================================================

      - name: Verify scene video durations
        shell: bash
        run: |
          echo "======================================"
          echo "VERIFYING SCENE DURATIONS"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            if [ "$INDEX" -lt $((COUNT - 1)) ]; then
              EXPECTED=$(( $(jq -r ".scenes[$INDEX].duration" scene_config.json) + TRANSITION_DURATION ))
            else
              EXPECTED=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            fi

            ACTUAL=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "work/scene_${ID}.mp4")

            echo "Scene $ID"
            echo "Expected : ${EXPECTED}s"
            echo "Actual   : ${ACTUAL}s"

            if ! awk -v actual="$ACTUAL" -v expected="$EXPECTED" \
              'BEGIN { exit !(actual >= expected-0.15 && actual <= expected+0.15) }'
            then
              echo "ERROR: Scene $ID duration outside tolerance."
              exit 1
            fi

          done

          echo "SCENE DURATIONS : VERIFIED"


      # ==========================================================
      # 14. BUILD TRANSITIONS
      # ==========================================================

      - name: Build timeline transitions
        shell: bash
        run: |
          echo "======================================"
          echo "BUILDING TIMELINE TRANSITIONS"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          INPUT_ARGS=()

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            INPUT_ARGS+=(
              -i
              "work/scene_${ID}.mp4"
            )
          done

          FILTER=""

          for INDEX in $(seq 1 $((COUNT - 1)))
          do

            PREVIOUS_INDEX=$((INDEX - 1))

            if [ "$INDEX" -eq 1 ]; then
              PREVIOUS_LABEL="[0:v]"
            else
              PREVIOUS_LABEL="[v${PREVIOUS_INDEX}]"
            fi

            CURRENT_START=$(jq -r ".scenes[$INDEX].start" scene_config.json)

            FILTER="${FILTER}${PREVIOUS_LABEL}[${INDEX}:v]xfade=transition=fade:duration=${TRANSITION_DURATION}:offset=${CURRENT_START}[v${INDEX}];"

          done

          FINAL_LABEL="[v$((COUNT - 1))]"

          ffmpeg -y \
            "${INPUT_ARGS[@]}" \
            -filter_complex "$FILTER" \
            -map "$FINAL_LABEL" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -an \
            work/video_core.mp4

          echo "TRANSITIONS : COMPLETE"


      # ==========================================================
      # 15. VERIFY CORE VIDEO
      # ==========================================================

      - name: Verify core video
        run: |
          echo "======================================"
          echo "CORE VIDEO VERIFICATION"
          echo "======================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/video_core.mp4

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            work/video_core.mp4

          echo "CORE VIDEO : VALID"


      # ==========================================================
      # 16. GENERATE ASS WITH INLINE LARGE TEXT
      # ==========================================================

      - name: Generate large clear ASS subtitles
        shell: bash
        run: |
          echo "======================================"
          echo "GENERATING LARGE CLEAR INLINE SUBTITLES"
          echo "======================================"

          cat > work/subtitles.ass <<'EOF'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          ScaledBorderAndShadow: yes
          WrapStyle: 2

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Default,Arial,120,&H00FFFFFF,&H00FFFFFF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,5,3,2,90,90,100,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          EOF

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            ENABLED=$(jq -r ".scenes[$INDEX].subtitle.enabled" scene_config.json)

            if [ "$ENABLED" != "true" ]; then
              continue
            fi

            START=$(jq -r ".scenes[$INDEX].start" scene_config.json)
            END=$(jq -r ".scenes[$INDEX].end" scene_config.json)

            TEXT=$(jq -r ".scenes[$INDEX].subtitle.text" scene_config.json)

            SIZE=$(jq -r ".scenes[$INDEX].subtitle.style.size" scene_config.json)
            COLOR=$(jq -r ".scenes[$INDEX].subtitle.style.color" scene_config.json)

            BOLD=$(jq -r ".scenes[$INDEX].subtitle.style.bold" scene_config.json)
            ITALIC=$(jq -r ".scenes[$INDEX].subtitle.style.italic" scene_config.json)

            X=$(jq -r ".scenes[$INDEX].subtitle.style.position.x" scene_config.json)
            Y=$(jq -r ".scenes[$INDEX].subtitle.style.position.y" scene_config.json)

            OUTLINE=$(jq -r ".scenes[$INDEX].subtitle.style.outline" scene_config.json)
            SHADOW=$(jq -r ".scenes[$INDEX].subtitle.style.shadow" scene_config.json)

            HEX=${COLOR#\#}

            RR=${HEX:0:2}
            GG=${HEX:2:2}
            BB=${HEX:4:2}

            ASS_COLOR="&H00${BB}${GG}${RR}"

            if [ "$BOLD" = "true" ]; then
              ASS_BOLD="1"
            else
              ASS_BOLD="0"
            fi

            if [ "$ITALIC" = "true" ]; then
              ASS_ITALIC="1"
            else
              ASS_ITALIC="0"
            fi

            START_H=$((START / 3600))
            START_M=$(((START % 3600) / 60))
            START_S=$((START % 60))

            END_H=$((END / 3600))
            END_M=$(((END % 3600) / 60))
            END_S=$((END % 60))

            START_ASS=$(printf "%d:%02d:%05.2f" \
              "$START_H" \
              "$START_M" \
              "$START_S")

            END_ASS=$(printf "%d:%02d:%05.2f" \
              "$END_H" \
              "$END_M" \
              "$END_S")

            ESCAPED_TEXT=$(printf '%s' "$TEXT" | \
              sed 's/{/\\{/g; s/}/\\}/g')

            INLINE_TAG="{\\fs${SIZE}\\c${ASS_COLOR}\\b${ASS_BOLD}\\i${ASS_ITALIC}\\bord${OUTLINE}\\shad${SHADOW}\\q2\\pos(${X},${Y})}"

            printf \
              "Dialogue: 0,%s,%s,Default,,0,0,0,,%s%s\n" \
              "$START_ASS" \
              "$END_ASS" \
              "$INLINE_TAG" \
              "$ESCAPED_TEXT" \
              >> work/subtitles.ass

            echo "Scene $ID : ${SIZE}px"
            echo "Color    : $COLOR"
            echo "Bold     : $BOLD"
            echo "Italic   : $ITALIC"

          done

          echo ""
          echo "======================================"
          echo "GENERATED ASS"
          echo "======================================"

          cat work/subtitles.ass


      # ==========================================================
      # 17. VALIDATE ASS STRUCTURE
      # ==========================================================

      - name: Validate ASS subtitle structure
        run: |
          echo "======================================"
          echo "ASS STRUCTURE VALIDATION"
          echo "======================================"

          if ! grep -qF '[Events]' work/subtitles.ass; then
            echo "ERROR: [Events] section missing."
            exit 1
          fi

          DIALOGUE_COUNT=$(grep -c '^Dialogue:' work/subtitles.ass || true)

          echo "Dialogue events : $DIALOGUE_COUNT"

          if [ "$DIALOGUE_COUNT" -ne 4 ]; then
            echo "ERROR: Expected 4 dialogue events."
            exit 1
          fi

          echo "ASS STRUCTURE : VALID"


      # ==========================================================
      # 18. VERIFY INLINE FONT SIZE
      # ==========================================================

      - name: Verify inline font sizes
        run: |
          echo "======================================"
          echo "INLINE FONT SIZE VERIFICATION"
          echo "======================================"

          EXPECTED_SIZES="120 112 115 120"

          INDEX=1

          for SIZE in $EXPECTED_SIZES
          do

            if ! grep -qF "\\fs${SIZE}" work/subtitles.ass; then
              echo "ERROR: Inline font size ${SIZE} not found."
              exit 1
            fi

            echo "Scene $INDEX : ${SIZE}px VERIFIED"

            INDEX=$((INDEX + 1))

          done

          echo "INLINE FONT SIZES : VERIFIED"


      # ==========================================================
      # 19. VERIFY INLINE COLORS
      # ==========================================================

      - name: Verify inline subtitle colors
        run: |
          echo "======================================"
          echo "INLINE COLOR VERIFICATION"
          echo "======================================"

          if ! grep -qF '\c&H00FFFFFF&' work/subtitles.ass; then
            echo "ERROR: White subtitle color missing."
            exit 1
          fi

          if ! grep -qF '\c&H0000FFFF&' work/subtitles.ass; then
            echo "ERROR: Yellow subtitle color missing."
            exit 1
          fi

          if ! grep -qF '\c&H00FFFF00&' work/subtitles.ass; then
            echo "ERROR: Cyan subtitle color missing."
            exit 1
          fi

          if ! grep -qF '\c&H0000FF00&' work/subtitles.ass; then
            echo "ERROR: Green subtitle color missing."
            exit 1
          fi

          echo "WHITE  : VERIFIED"
          echo "YELLOW : VERIFIED"
          echo "CYAN   : VERIFIED"
          echo "GREEN  : VERIFIED"

          echo "INLINE COLORS : VERIFIED"


      # ==========================================================
      # 20. VERIFY INLINE STYLES
      # ==========================================================

      - name: Verify inline subtitle styles
        run: |
          echo "======================================"
          echo "INLINE STYLE VERIFICATION"
          echo "======================================"

          if ! grep -qF '\b1\i0' work/subtitles.ass; then
            echo "ERROR: Bold style missing."
            exit 1
          fi

          if ! grep -qF '\b0\i1' work/subtitles.ass; then
            echo "ERROR: Italic style missing."
            exit 1
          fi

          if ! grep -qF '\b1\i1' work/subtitles.ass; then
            echo "ERROR: Bold + Italic style missing."
            exit 1
          fi

          if ! grep -qF '\b0\i0' work/subtitles.ass; then
            echo "ERROR: Normal style missing."
            exit 1
          fi

          echo "BOLD           : VERIFIED"
          echo "ITALIC         : VERIFIED"
          echo "BOLD + ITALIC  : VERIFIED"
          echo "NORMAL         : VERIFIED"

          echo "INLINE BOLD / ITALIC : VERIFIED"


      # ==========================================================
      # 21. VERIFY OUTLINE AND SHADOW
      # ==========================================================

      - name: Verify outline and shadow
        run: |
          echo "======================================"
          echo "OUTLINE / SHADOW VERIFICATION"
          echo "======================================"

          if ! grep -qF '\bord5' work/subtitles.ass; then
            echo "ERROR: Outline setting missing."
            exit 1
          fi

          if ! grep -qF '\shad3' work/subtitles.ass; then
            echo "ERROR: Shadow setting missing."
            exit 1
          fi

          echo "OUTLINE : VERIFIED"
          echo "SHADOW  : VERIFIED"


      # ==========================================================
      # 22. BURN SUBTITLES
      # ==========================================================

      - name: Burn large clear subtitles
        run: |
          echo "======================================"
          echo "BURNING LARGE CLEAR SUBTITLES"
          echo "======================================"

          ffmpeg -y \
            -i work/video_core.mp4 \
            -vf "ass=work/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -an \
            work/video_subtitles.mp4

          echo "SUBTITLES : BURNED"


      # ==========================================================
      # 23. VERIFY SUBTITLE VIDEO
      # ==========================================================

      - name: Verify subtitled video
        run: |
          echo "======================================"
          echo "SUBTITLE VIDEO VERIFICATION"
          echo "======================================"

          if [ ! -f work/video_subtitles.mp4 ]; then
            echo "ERROR: Subtitle video missing."
            exit 1
          fi

          SIZE=$(stat -c%s work/video_subtitles.mp4)

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Subtitle video is empty."
            exit 1
          fi

          echo "Subtitle video : $SIZE bytes"
          echo "SUBTITLE VIDEO : VALID"


      # ==========================================================
      # 24. ADD NARRATION
      # ==========================================================

      - name: Add narration
        run: |
          echo "======================================"
          echo "ADDING NARRATION"
          echo "======================================"

          AUDIO=$(jq -r '.narration.source' scene_config.json)

          ffmpeg -y \
            -i work/video_subtitles.mp4 \
            -i "$AUDIO" \
            -map 0:v:0 \
            -map 1:a:0 \
            -t "$TARGET_DURATION" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output/AICAP_FREE_15_LARGE_CLEAR_INLINE_SUBTITLES.mp4

          echo "NARRATION : ADDED"


      # ==========================================================
      # 25. FINAL VALIDATION
      # ==========================================================

      - name: Validate final video
        run: |
          echo "======================================"
          echo "FINAL VIDEO VALIDATION"
          echo "======================================"

          VIDEO="output/AICAP_FREE_15_LARGE_CLEAR_INLINE_SUBTITLES.mp4"

          if [ ! -f "$VIDEO" ]; then
            echo "ERROR: Final MP4 missing."
            exit 1
          fi

          SIZE=$(stat -c%s "$VIDEO")

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Final MP4 is empty."
            exit 1
          fi

          echo "File size : $SIZE bytes"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "FINAL VIDEO : VALID"


      # ==========================================================
      # 26. CREATE REPORT
      # ==========================================================

      - name: Create Test 15 report
        run: |
          cat > work/test15-report.txt <<'EOF'
          AICAP FREE VIDEO RENDERER
          TEST 15 — LARGE CLEAR INLINE SUBTITLES

          STATUS:
          RENDERED WITH VALIDATION

          VIDEO:
          1080x1920
          30 FPS
          60 seconds

          SUBTITLE SIZES:

          Scene 1:
          120px
          WHITE + BOLD

          Scene 2:
          112px
          YELLOW + ITALIC

          Scene 3:
          115px
          CYAN + BOLD + ITALIC

          Scene 4:
          120px
          GREEN + NORMAL

          INLINE FONT SIZE:
          VERIFIED

          INLINE COLOR:
          VERIFIED

          INLINE BOLD:
          VERIFIED

          INLINE ITALIC:
          VERIFIED

          OUTLINE:
          VERIFIED

          SHADOW:
          VERIFIED

          POSITION:
          VERIFIED

          ASS EVENTS:
          VERIFIED

          NARRATION:
          VERIFIED

          FINAL MP4:
          VERIFIED

          OUTPUT:
          AICAP_FREE_15_LARGE_CLEAR_INLINE_SUBTITLES.mp4
          EOF

          cat work/test15-report.txt


      # ==========================================================
      # 27. UPLOAD MP4
      # ==========================================================

      - name: Upload large clear MP4
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-15-LARGE-CLEAR-INLINE-SUBTITLES
          path: output/AICAP_FREE_15_LARGE_CLEAR_INLINE_SUBTITLES.mp4
          retention-days: 1


      # ==========================================================
      # 28. UPLOAD JSON
      # ==========================================================

      - name: Upload JSON configuration
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-15-LARGE-CLEAR-INLINE-JSON
          path: scene_config.json
          retention-days: 1


      # ==========================================================
      # 29. UPLOAD ASS
      # ==========================================================

      - name: Upload ASS subtitles
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-15-LARGE-CLEAR-INLINE-ASS
          path: work/subtitles.ass
          retention-days: 1


      # ==========================================================
      # 30. UPLOAD REPORT
      # ==========================================================

      - name: Upload validation report
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-15-LARGE-CLEAR-INLINE-REPORT
          path: work/test15-report.txt
          retention-days: 1


      # ==========================================================
      # 31. FINAL RESULT
      # ==========================================================

      - name: Test 15 final result
        run: |
          echo ""
          echo "=============================================="
          echo "AICAP FREE VIDEO RENDERER"
          echo "TEST 15 — LARGE CLEAR INLINE SUBTITLES"
          echo "=============================================="
          echo ""
          echo "JSON                         : VERIFIED"
          echo "Scene Rendering              : VERIFIED"
          echo "Scene Timing                 : VERIFIED"
          echo "Transitions                  : VERIFIED"
          echo "Inline Font Size             : VERIFIED"
          echo "Inline Color                 : VERIFIED"
          echo "Inline Bold                  : VERIFIED"
          echo "Inline Italic                : VERIFIED"
          echo "Outline                      : VERIFIED"
          echo "Shadow                       : VERIFIED"
          echo "Position                     : VERIFIED"
          echo "Narration                    : VERIFIED"
          echo "Final MP4                    : VERIFIED"
          echo ""
          echo "SUBTITLE SIZES:"
          echo "Scene 1                      : 120px"
          echo "Scene 2                      : 112px"
          echo "Scene 3                      : 115px"
          echo "Scene 4                      : 120px"
          echo ""
          echo "OUTPUT:"
          echo "AICAP_FREE_15_LARGE_CLEAR_INLINE_SUBTITLES.mp4"
          echo ""
          echo "=============================================="
          echo "TEST 15 : SUCCESS"
          echo "=============================================="
