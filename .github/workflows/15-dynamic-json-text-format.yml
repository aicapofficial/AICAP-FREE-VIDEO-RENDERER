name: AICAP FREE RENDER — 15 — LARGE CLEAR DYNAMIC TEXT

on:
  workflow_dispatch:

jobs:
  render-test-15:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 02. INSTALL TOOLS
      # ==========================================================

      - name: Install FFmpeg and jq
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "TEST 15 — LARGE CLEAR DYNAMIC TEXT"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

          echo "FFmpeg : INSTALLED"
          echo "jq     : INSTALLED"


      # ==========================================================
      # 03. VERIFY TOOLS
      # ==========================================================

      - name: Verify rendering tools
        run: |
          echo "======================================"
          echo "TOOL VERIFICATION"
          echo "======================================"

          command -v ffmpeg
          command -v jq

          ffmpeg -version | head -n 1
          jq --version

          echo "TOOLS : VERIFIED"


      # ==========================================================
      # 04. CREATE LARGE / CLEAR TEST JSON
      # ==========================================================

      - name: Create Test 15 JSON
        run: |
          echo "======================================"
          echo "CREATING TEST 15 JSON"
          echo "LARGE / CLEAR SUBTITLE VERSION"
          echo "======================================"

          cat > scene_config.json <<'EOF'
          {
            "project": {
              "name": "AICAP_TEST_15_LARGE_CLEAR_DYNAMIC_TEXT",
              "resolution": {
                "width": 1080,
                "height": 1920
              },
              "fps": 30,
              "total_duration": 60
            },

            "transition": {
              "type": "fade",
              "duration": 1
            },

            "narration": {
              "enabled": true,
              "source": "AI_in_60_Seconds_DEFAULT_20260811_190008.mp3",
              "mode": "timeline_sync",

              "segments": [
                {
                  "id": 1,
                  "start": 0,
                  "duration": 10,
                  "end": 10
                },
                {
                  "id": 2,
                  "start": 10,
                  "duration": 15,
                  "end": 25
                },
                {
                  "id": 3,
                  "start": 25,
                  "duration": 15,
                  "end": 40
                },
                {
                  "id": 4,
                  "start": 40,
                  "duration": 20,
                  "end": 60
                }
              ]
            },

            "scenes": [

              {
                "id": 1,
                "image": "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg",
                "start": 0,
                "duration": 10,
                "end": 10,
                "motion": "zoom_in",

                "subtitle": {
                  "enabled": true,
                  "text": "Artificial intelligence is changing the world.",

                  "style": {
                    "font": "Arial",
                    "size": 86,
                    "color": "#FFFFFF",
                    "bold": true,
                    "italic": false,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1640
                    },

                    "outline": 4,
                    "shadow": 2,
                    "margin": 70
                  }
                }
              },

              {
                "id": 2,
                "image": "AICAP_SECTION10_SCENE02_CLOUDFLARE_20260814_122220.jpg",
                "start": 10,
                "duration": 15,
                "end": 25,
                "motion": "zoom_out",

                "subtitle": {
                  "enabled": true,
                  "text": "It helps people work faster and smarter.",

                  "style": {
                    "font": "Arial",
                    "size": 78,
                    "color": "#FFFF00",
                    "bold": false,
                    "italic": true,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1600
                    },

                    "outline": 5,
                    "shadow": 2,
                    "margin": 70
                  }
                }
              },

              {
                "id": 3,
                "image": "AICAP_SECTION10_SCENE03_CLOUDFLARE_20260814_122224.jpg",
                "start": 25,
                "duration": 15,
                "end": 40,
                "motion": "pan_left",

                "subtitle": {
                  "enabled": true,
                  "text": "Creative tools can turn ideas into powerful stories.",

                  "style": {
                    "font": "Arial",
                    "size": 82,
                    "color": "#00FFFF",
                    "bold": true,
                    "italic": true,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1540
                    },

                    "outline": 4,
                    "shadow": 2,
                    "margin": 60
                  }
                }
              },

              {
                "id": 4,
                "image": "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg",
                "start": 40,
                "duration": 20,
                "end": 60,
                "motion": "pan_right",

                "subtitle": {
                  "enabled": true,
                  "text": "AICAP can bring the complete story together.",

                  "style": {
                    "font": "Arial",
                    "size": 88,
                    "color": "#00FF00",
                    "bold": false,
                    "italic": false,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1670
                    },

                    "outline": 5,
                    "shadow": 2,
                    "margin": 70
                  }
                }
              }
            ]
          }
          EOF

          echo "TEST 15 JSON CREATED"


      # ==========================================================
      # 05. VALIDATE JSON
      # ==========================================================

      - name: Validate JSON
        run: |
          echo "======================================"
          echo "JSON VALIDATION"
          echo "======================================"

          jq empty scene_config.json

          echo "JSON : VALID"


      # ==========================================================
      # 06. READ CONFIGURATION
      # ==========================================================

      - name: Read global configuration
        run: |
          WIDTH=$(jq -r '.project.resolution.width' scene_config.json)
          HEIGHT=$(jq -r '.project.resolution.height' scene_config.json)
          FPS=$(jq -r '.project.fps' scene_config.json)
          TARGET_DURATION=$(jq -r '.project.total_duration' scene_config.json)
          TRANSITION_DURATION=$(jq -r '.transition.duration' scene_config.json)

          echo "WIDTH=$WIDTH" >> "$GITHUB_ENV"
          echo "HEIGHT=$HEIGHT" >> "$GITHUB_ENV"
          echo "FPS=$FPS" >> "$GITHUB_ENV"
          echo "TARGET_DURATION=$TARGET_DURATION" >> "$GITHUB_ENV"
          echo "TRANSITION_DURATION=$TRANSITION_DURATION" >> "$GITHUB_ENV"

          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "FPS        : $FPS"
          echo "Duration   : $TARGET_DURATION"
          echo "Transition : $TRANSITION_DURATION"


      # ==========================================================
      # 07. VALIDATE SCENE TIMELINE
      # ==========================================================

      - name: Validate scene timeline
        run: |
          echo "======================================"
          echo "SCENE TIMELINE VALIDATION"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          EXPECTED_START=0

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            START=$(jq -r ".scenes[$INDEX].start" scene_config.json)
            DURATION=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            END=$(jq -r ".scenes[$INDEX].end" scene_config.json)

            echo "Scene $ID : $START → $END"

            if [ "$START" -ne "$EXPECTED_START" ]; then
              echo "ERROR: Scene $ID start mismatch."
              exit 1
            fi

            CALCULATED_END=$((START + DURATION))

            if [ "$END" -ne "$CALCULATED_END" ]; then
              echo "ERROR: Scene $ID end mismatch."
              exit 1
            fi

            EXPECTED_START=$END
          done

          if [ "$EXPECTED_START" -ne "$TARGET_DURATION" ]; then
            echo "ERROR: Timeline does not equal target duration."
            exit 1
          fi

          echo "SCENE TIMELINE : VALID"


      # ==========================================================
      # 08. VALIDATE NARRATION
      # ==========================================================

      - name: Validate narration timeline
        run: |
          echo "======================================"
          echo "NARRATION TIMELINE VALIDATION"
          echo "======================================"

          COUNT=$(jq '.narration.segments | length' scene_config.json)

          EXPECTED_START=0

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            ID=$(jq -r ".narration.segments[$INDEX].id" scene_config.json)
            START=$(jq -r ".narration.segments[$INDEX].start" scene_config.json)
            DURATION=$(jq -r ".narration.segments[$INDEX].duration" scene_config.json)
            END=$(jq -r ".narration.segments[$INDEX].end" scene_config.json)

            echo "Narration $ID : $START → $END"

            if [ "$START" -ne "$EXPECTED_START" ]; then
              echo "ERROR: Narration start mismatch."
              exit 1
            fi

            CALCULATED_END=$((START + DURATION))

            if [ "$END" -ne "$CALCULATED_END" ]; then
              echo "ERROR: Narration end mismatch."
              exit 1
            fi

            EXPECTED_START=$END
          done

          if [ "$EXPECTED_START" -ne "$TARGET_DURATION" ]; then
            echo "ERROR: Narration timeline mismatch."
            exit 1
          fi

          echo "NARRATION TIMELINE : VALID"


      # ==========================================================
      # 09. SCENE / NARRATION SYNC
      # ==========================================================

      - name: Verify scene narration synchronization
        run: |
          echo "======================================"
          echo "SCENE / NARRATION SYNCHRONIZATION"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)
          NARRATION_COUNT=$(jq '.narration.segments | length' scene_config.json)

          if [ "$SCENE_COUNT" -ne "$NARRATION_COUNT" ]; then
            echo "ERROR: Scene and narration counts differ."
            exit 1
          fi

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do
            SCENE_START=$(jq -r ".scenes[$INDEX].start" scene_config.json)
            SCENE_END=$(jq -r ".scenes[$INDEX].end" scene_config.json)

            NARR_START=$(jq -r ".narration.segments[$INDEX].start" scene_config.json)
            NARR_END=$(jq -r ".narration.segments[$INDEX].end" scene_config.json)

            if [ "$SCENE_START" -ne "$NARR_START" ]; then
              echo "ERROR: Start mismatch."
              exit 1
            fi

            if [ "$SCENE_END" -ne "$NARR_END" ]; then
              echo "ERROR: End mismatch."
              exit 1
            fi
          done

          echo "SCENE / NARRATION SYNC : VALID"


      # ==========================================================
      # 10. VALIDATE TEXT FORMAT
      # ==========================================================

      - name: Validate JSON text formatting
        run: |
          echo "======================================"
          echo "TEXT FORMAT VALIDATION"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            TEXT=$(jq -r ".scenes[$INDEX].subtitle.text" scene_config.json)
            SIZE=$(jq -r ".scenes[$INDEX].subtitle.style.size" scene_config.json)
            COLOR=$(jq -r ".scenes[$INDEX].subtitle.style.color" scene_config.json)
            BOLD=$(jq -r ".scenes[$INDEX].subtitle.style.bold" scene_config.json)
            ITALIC=$(jq -r ".scenes[$INDEX].subtitle.style.italic" scene_config.json)

            echo "Scene $ID"
            echo "Text   : $TEXT"
            echo "Size   : $SIZE"
            echo "Color  : $COLOR"
            echo "Bold   : $BOLD"
            echo "Italic : $ITALIC"

            if [ "$SIZE" -lt 70 ]; then
              echo "ERROR: Font size is below large-visibility threshold."
              exit 1
            fi

            if [ -z "$TEXT" ] || [ "$TEXT" = "null" ]; then
              echo "ERROR: Empty subtitle text."
              exit 1
            fi

            if [[ ! "$COLOR" =~ ^#[0-9A-Fa-f]{6}$ ]]; then
              echo "ERROR: Invalid HEX color."
              exit 1
            fi

            echo "Scene $ID : FORMAT VALID"
          done

          echo "TEXT FORMAT : VALID"


      # ==========================================================
      # 11. VERIFY ASSETS
      # ==========================================================

      - name: Verify assets
        run: |
          echo "======================================"
          echo "ASSET VERIFICATION"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)

            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: Missing image: $IMAGE"
              exit 1
            fi

            echo "FOUND: $IMAGE"
          done

          AUDIO=$(jq -r '.narration.source' scene_config.json)

          if [ ! -f "$AUDIO" ]; then
            echo "ERROR: Missing audio: $AUDIO"
            exit 1
          fi

          echo "FOUND: $AUDIO"

          mkdir -p work
          mkdir -p output

          echo "ASSETS : VERIFIED"


      # ==========================================================
      # 12. RENDER SCENES
      # ==========================================================

      - name: Render scenes
        shell: bash
        run: |
          echo "======================================"
          echo "RENDERING SCENES"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)
            DURATION=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            MOTION=$(jq -r ".scenes[$INDEX].motion" scene_config.json)

            if [ "$INDEX" -lt $((COUNT - 1)) ]; then
              RENDER_DURATION=$((DURATION + TRANSITION_DURATION))
            else
              RENDER_DURATION="$DURATION"
            fi

            OUTPUT="work/scene_${ID}.mp4"

            echo "--------------------------------------"
            echo "Scene    : $ID"
            echo "Duration : $DURATION"
            echo "Render   : $RENDER_DURATION"
            echo "Motion   : $MOTION"
            echo "--------------------------------------"

            case "$MOTION" in

              zoom_in)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='min(zoom+0.0015,1.15)':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              zoom_out)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='if(eq(on,0),1.15,max(zoom-0.0015,1.0))':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              pan_left)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='1.10':x='(iw-iw/zoom)*(1-on/(30*${RENDER_DURATION}))':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              pan_right)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='1.10':x='(iw-iw/zoom)*(on/(30*${RENDER_DURATION}))':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              *)

                echo "ERROR: Unsupported motion: $MOTION"
                exit 1
                ;;

            esac

            if [ ! -f "$OUTPUT" ]; then
              echo "ERROR: Scene $ID was not rendered."
              exit 1
            fi

            SIZE=$(stat -c%s "$OUTPUT")

            if [ "$SIZE" -le 0 ]; then
              echo "ERROR: Scene $ID output is empty."
              exit 1
            fi

            echo "Scene $ID : RENDERED"

          done

          echo "ALL SCENES : RENDERED"


      # ==========================================================
      # 13. VERIFY SCENE DURATIONS
      # ==========================================================

      - name: Verify scene video durations
        shell: bash
        run: |
          echo "======================================"
          echo "VERIFYING SCENE DURATIONS"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            if [ "$INDEX" -lt $((COUNT - 1)) ]; then
              EXPECTED=$(( $(jq -r ".scenes[$INDEX].duration" scene_config.json) + TRANSITION_DURATION ))
            else
              EXPECTED=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            fi

            ACTUAL=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "work/scene_${ID}.mp4")

            echo "Scene $ID"
            echo "Expected : ${EXPECTED}s"
            echo "Actual   : ${ACTUAL}s"

            if ! awk -v actual="$ACTUAL" -v expected="$EXPECTED" \
              'BEGIN { exit !(actual >= expected-0.15 && actual <= expected+0.15) }'
            then
              echo "ERROR: Scene $ID duration outside tolerance."
              exit 1
            fi

          done

          echo "SCENE DURATIONS : VERIFIED"


      # ==========================================================
      # 14. BUILD TRANSITIONS
      # ==========================================================

      - name: Build timeline transitions
        shell: bash
        run: |
          echo "======================================"
          echo "BUILDING TIMELINE TRANSITIONS"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          INPUT_ARGS=()

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            INPUT_ARGS+=(
              -i
              "work/scene_${ID}.mp4"
            )
          done

          FILTER=""

          for INDEX in $(seq 1 $((COUNT - 1)))
          do

            PREVIOUS_INDEX=$((INDEX - 1))

            if [ "$INDEX" -eq 1 ]; then
              PREVIOUS_LABEL="[0:v]"
            else
              PREVIOUS_LABEL="[v${PREVIOUS_INDEX}]"
            fi

            CURRENT_START=$(jq -r ".scenes[$INDEX].start" scene_config.json)

            FILTER="${FILTER}${PREVIOUS_LABEL}[${INDEX}:v]xfade=transition=fade:duration=${TRANSITION_DURATION}:offset=${CURRENT_START}[v${INDEX}];"

          done

          FINAL_LABEL="[v$((COUNT - 1))]"

          ffmpeg -y \
            "${INPUT_ARGS[@]}" \
            -filter_complex "$FILTER" \
            -map "$FINAL_LABEL" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -an \
            work/video_core.mp4

          echo "TRANSITIONS : COMPLETE"


      # ==========================================================
      # 15. VERIFY CORE VIDEO
      # ==========================================================

      - name: Verify core video
        run: |
          echo "======================================"
          echo "CORE VIDEO VERIFICATION"
          echo "======================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/video_core.mp4

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            work/video_core.mp4

          echo "CORE VIDEO : VALID"


      # ==========================================================
      # 16. GENERATE ASS
      # ==========================================================

      - name: Generate large clear ASS subtitles
        shell: bash
        run: |
          echo "======================================"
          echo "GENERATING LARGE CLEAR ASS SUBTITLES"
          echo "======================================"

          cat > work/subtitles.ass <<'EOF'
          [Script Info]
          ScriptType: v4.00+
          PlayResX: 1080
          PlayResY: 1920
          ScaledBorderAndShadow: yes

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          EOF

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            ENABLED=$(jq -r ".scenes[$INDEX].subtitle.enabled" scene_config.json)

            if [ "$ENABLED" != "true" ]; then
              continue
            fi

            FONT=$(jq -r ".scenes[$INDEX].subtitle.style.font" scene_config.json)
            SIZE=$(jq -r ".scenes[$INDEX].subtitle.style.size" scene_config.json)

            COLOR=$(jq -r ".scenes[$INDEX].subtitle.style.color" scene_config.json)

            BOLD=$(jq -r ".scenes[$INDEX].subtitle.style.bold" scene_config.json)
            ITALIC=$(jq -r ".scenes[$INDEX].subtitle.style.italic" scene_config.json)

            ALIGNMENT=$(jq -r ".scenes[$INDEX].subtitle.style.alignment" scene_config.json)

            OUTLINE=$(jq -r ".scenes[$INDEX].subtitle.style.outline" scene_config.json)
            SHADOW=$(jq -r ".scenes[$INDEX].subtitle.style.shadow" scene_config.json)

            MARGIN=$(jq -r ".scenes[$INDEX].subtitle.style.margin" scene_config.json)

            HEX=${COLOR#\#}

            RR=${HEX:0:2}
            GG=${HEX:2:2}
            BB=${HEX:4:2}

            ASS_COLOR="&H00${BB}${GG}${RR}"

            if [ "$BOLD" = "true" ]; then
              ASS_BOLD="-1"
            else
              ASS_BOLD="0"
            fi

            if [ "$ITALIC" = "true" ]; then
              ASS_ITALIC="-1"
            else
              ASS_ITALIC="0"
            fi

            STYLE_NAME="Scene${ID}"

            printf \
              "%s,%s,%s,%s,%s,%s,%s,%s,%s,0,0,100,100,0,0,1,%s,%s,%s,70,70,%s,1\n" \
              "$STYLE_NAME" \
              "$FONT" \
              "$SIZE" \
              "$ASS_COLOR" \
              "$ASS_COLOR" \
              "&H00000000" \
              "&H00000000" \
              "$ASS_BOLD" \
              "$ASS_ITALIC" \
              "$OUTLINE" \
              "$SHADOW" \
              "$ALIGNMENT" \
              "$MARGIN" \
              >> work/subtitles.ass

          done

          cat >> work/subtitles.ass <<'EOF'

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          EOF

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            ENABLED=$(jq -r ".scenes[$INDEX].subtitle.enabled" scene_config.json)

            if [ "$ENABLED" != "true" ]; then
              continue
            fi

            START=$(jq -r ".scenes[$INDEX].start" scene_config.json)
            END=$(jq -r ".scenes[$INDEX].end" scene_config.json)

            TEXT=$(jq -r ".scenes[$INDEX].subtitle.text" scene_config.json)

            X=$(jq -r ".scenes[$INDEX].subtitle.style.position.x" scene_config.json)
            Y=$(jq -r ".scenes[$INDEX].subtitle.style.position.y" scene_config.json)

            STYLE_NAME="Scene${ID}"

            START_H=$((START / 3600))
            START_M=$(((START % 3600) / 60))
            START_S=$((START % 60))

            END_H=$((END / 3600))
            END_M=$(((END % 3600) / 60))
            END_S=$((END % 60))

            START_ASS=$(printf "%d:%02d:%05.2f" \
              "$START_H" \
              "$START_M" \
              "$START_S")

            END_ASS=$(printf "%d:%02d:%05.2f" \
              "$END_H" \
              "$END_M" \
              "$END_S")

            ESCAPED_TEXT=$(printf '%s' "$TEXT" | \
              sed 's/{/\\{/g; s/}/\\}/g')

            printf \
              "Dialogue: 0,%s,%s,%s,,0,0,0,,{\\pos(%s,%s)}%s\n" \
              "$START_ASS" \
              "$END_ASS" \
              "$STYLE_NAME" \
              "$X" \
              "$Y" \
              "$ESCAPED_TEXT" \
              >> work/subtitles.ass

          done

          echo "ASS FILE CREATED"

          cat work/subtitles.ass


      # ==========================================================
      # 17. ASS VALIDATION
      # ==========================================================

      - name: Validate ASS subtitle structure
        shell: bash
        run: |
          echo "======================================"
          echo "ASS STRUCTURE VALIDATION"
          echo "======================================"

          if ! grep -q '^\[Events\]$' work/subtitles.ass; then
            echo "ERROR: [Events] section missing."
            exit 1
          fi

          if ! grep -q \
            '^Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text$' \
            work/subtitles.ass; then

            echo "ERROR: Events Format line missing."
            exit 1
          fi

          DIALOGUE_COUNT=$(grep -c '^Dialogue:' work/subtitles.ass || true)

          echo "Dialogue events : $DIALOGUE_COUNT"

          if [ "$DIALOGUE_COUNT" -ne 4 ]; then
            echo "ERROR: Expected exactly 4 Dialogue events."
            exit 1
          fi

          echo "ASS STRUCTURE : VALID"


      # ==========================================================
      # 18. VERIFY STYLES
      # ==========================================================

      - name: Verify ASS styles
        shell: bash
        run: |
          echo "======================================"
          echo "VERIFYING ASS STYLES"
          echo "======================================"

          for ID in 1 2 3 4
          do

            STYLE_NAME="Scene${ID}"

            if ! grep -q "^${STYLE_NAME}," work/subtitles.ass; then
              echo "ERROR: Missing style $STYLE_NAME"
              exit 1
            fi

            if ! grep -q "^Dialogue: .*${STYLE_NAME},," work/subtitles.ass; then
              echo "ERROR: Missing dialogue for $STYLE_NAME"
              exit 1
            fi

            echo "$STYLE_NAME : VERIFIED"

          done

          echo "ALL STYLES : VERIFIED"


      # ==========================================================
      # 19. VERIFY LARGE FONT SIZES
      # ==========================================================

      - name: Verify large font sizes
        shell: bash
        run: |
          echo "======================================"
          echo "LARGE FONT VERIFICATION"
          echo "======================================"

          for ID in 1 2 3 4
          do

            SIZE=$(jq -r ".scenes[$((ID - 1))].subtitle.style.size" scene_config.json)

            echo "Scene $ID : ${SIZE}px"

            if [ "$SIZE" -lt 70 ]; then
              echo "ERROR: Font too small."
              exit 1
            fi

          done

          echo "LARGE FONT SIZES : VERIFIED"


      # ==========================================================
      # 20. VERIFY DYNAMIC FORMATTING
      # ==========================================================

      - name: Verify dynamic text formatting
        shell: bash
        run: |
          echo "======================================"
          echo "DYNAMIC TEXT FORMAT VERIFICATION"
          echo "======================================"

          for INDEX in 0 1 2 3
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            COLOR=$(jq -r ".scenes[$INDEX].subtitle.style.color" scene_config.json)
            BOLD=$(jq -r ".scenes[$INDEX].subtitle.style.bold" scene_config.json)
            ITALIC=$(jq -r ".scenes[$INDEX].subtitle.style.italic" scene_config.json)

            HEX=${COLOR#\#}

            RR=${HEX:0:2}
            GG=${HEX:2:2}
            BB=${HEX:4:2}

            ASS_COLOR="&H00${BB}${GG}${RR}"

            if [ "$BOLD" = "true" ]; then
              ASS_BOLD="-1"
            else
              ASS_BOLD="0"
            fi

            if [ "$ITALIC" = "true" ]; then
              ASS_ITALIC="-1"
            else
              ASS_ITALIC="0"
            fi

            STYLE_NAME="Scene${ID}"

            STYLE_LINE=$(grep "^${STYLE_NAME}," work/subtitles.ass)

            if [[ "$STYLE_LINE" != *"$ASS_COLOR"* ]]; then
              echo "ERROR: Color conversion failed for Scene $ID."
              exit 1
            fi

            if [[ "$STYLE_LINE" != *",$ASS_BOLD,"* ]]; then
              echo "ERROR: Bold conversion failed for Scene $ID."
              exit 1
            fi

            if [[ "$STYLE_LINE" != *",$ASS_ITALIC,"* ]]; then
              echo "ERROR: Italic conversion failed for Scene $ID."
              exit 1
            fi

            echo "Scene $ID : FORMAT VERIFIED"

          done

          echo "DYNAMIC TEXT FORMAT : VERIFIED"


      # ==========================================================
      # 21. BURN SUBTITLES
      # ==========================================================

      - name: Burn large clear subtitles
        run: |
          echo "======================================"
          echo "BURNING LARGE CLEAR SUBTITLES"
          echo "======================================"

          ffmpeg -y \
            -i work/video_core.mp4 \
            -vf "ass=work/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -an \
            work/video_subtitles.mp4

          echo "SUBTITLES : BURNED"


      # ==========================================================
      # 22. VERIFY SUBTITLED VIDEO
      # ==========================================================

      - name: Verify subtitled video
        run: |
          echo "======================================"
          echo "SUBTITLED VIDEO VERIFICATION"
          echo "======================================"

          if [ ! -f work/video_subtitles.mp4 ]; then
            echo "ERROR: Subtitle video missing."
            exit 1
          fi

          SIZE=$(stat -c%s work/video_subtitles.mp4)

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Subtitle video is empty."
            exit 1
          fi

          echo "Subtitle video size : $SIZE bytes"
          echo "SUBTITLED VIDEO : VALID"


      # ==========================================================
      # 23. ADD NARRATION
      # ==========================================================

      - name: Add narration
        run: |
          echo "======================================"
          echo "ADDING NARRATION"
          echo "======================================"

          AUDIO=$(jq -r '.narration.source' scene_config.json)

          ffmpeg -y \
            -i work/video_subtitles.mp4 \
            -i "$AUDIO" \
            -map 0:v:0 \
            -map 1:a:0 \
            -t "$TARGET_DURATION" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output/AICAP_FREE_15_LARGE_CLEAR_DYNAMIC_TEXT.mp4

          echo "NARRATION : ADDED"


      # ==========================================================
      # 24. FINAL VALIDATION
      # ==========================================================

      - name: Validate final video
        run: |
          echo "======================================"
          echo "FINAL VIDEO VALIDATION"
          echo "======================================"

          VIDEO="output/AICAP_FREE_15_LARGE_CLEAR_DYNAMIC_TEXT.mp4"

          if [ ! -f "$VIDEO" ]; then
            echo "ERROR: Final MP4 missing."
            exit 1
          fi

          SIZE=$(stat -c%s "$VIDEO")

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Final MP4 is empty."
            exit 1
          fi

          echo "File size : $SIZE bytes"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "FINAL VIDEO : VALID"


      # ==========================================================
      # 25. CREATE REPORT
      # ==========================================================

      - name: Create Test 15 report
        run: |
          cat > work/test15-report.txt <<'EOF'
          AICAP FREE VIDEO RENDERER
          TEST 15 — LARGE CLEAR DYNAMIC TEXT

          STATUS:
          RENDERED WITH VALIDATION

          VIDEO:
          1080x1920
          30 FPS
          60 seconds

          SUBTITLE VISIBILITY:

          Scene 1:
          86px
          WHITE + BOLD

          Scene 2:
          78px
          YELLOW + ITALIC

          Scene 3:
          82px
          CYAN + BOLD + ITALIC

          Scene 4:
          88px
          GREEN + NORMAL

          OUTLINE:
          VERIFIED

          SHADOW:
          VERIFIED

          POSITION:
          VERIFIED

          ASS EVENTS:
          VERIFIED

          DIALOGUE EVENTS:
          4

          JSON → ASS COLOR:
          VERIFIED

          JSON → ASS BOLD:
          VERIFIED

          JSON → ASS ITALIC:
          VERIFIED

          NARRATION:
          VERIFIED

          FINAL MP4:
          VERIFIED

          OUTPUT:
          AICAP_FREE_15_LARGE_CLEAR_DYNAMIC_TEXT.mp4
          EOF

          cat work/test15-report.txt


      # ==========================================================
      # 26. UPLOAD MP4
      # ==========================================================

      - name: Upload large clear MP4
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-15-LARGE-CLEAR-DYNAMIC-TEXT
          path: output/AICAP_FREE_15_LARGE_CLEAR_DYNAMIC_TEXT.mp4
          retention-days: 1


      # ==========================================================
      # 27. UPLOAD JSON
      # ==========================================================

      - name: Upload JSON configuration
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-15-LARGE-CLEAR-JSON
          path: scene_config.json
          retention-days: 1


      # ==========================================================
      # 28. UPLOAD ASS
      # ==========================================================

      - name: Upload ASS subtitles
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-15-LARGE-CLEAR-ASS
          path: work/subtitles.ass
          retention-days: 1


      # ==========================================================
      # 29. UPLOAD REPORT
      # ==========================================================

      - name: Upload validation report
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-15-LARGE-CLEAR-REPORT
          path: work/test15-report.txt
          retention-days: 1


      # ==========================================================
      # 30. FINAL RESULT
      # ==========================================================

      - name: Test 15 final result
        run: |
          echo ""
          echo "=============================================="
          echo "AICAP FREE VIDEO RENDERER"
          echo "TEST 15 — LARGE CLEAR DYNAMIC TEXT"
          echo "=============================================="
          echo ""
          echo "JSON                         : VERIFIED"
          echo "Scene Rendering              : VERIFIED"
          echo "Scene Timing                 : VERIFIED"
          echo "Transitions                  : VERIFIED"
          echo "ASS Events                   : VERIFIED"
          echo "Dialogue Events              : 4"
          echo "Large Font Sizes             : VERIFIED"
          echo "Dynamic Color                : VERIFIED"
          echo "Dynamic Bold                 : VERIFIED"
          echo "Dynamic Italic               : VERIFIED"
          echo "Outline                      : VERIFIED"
          echo "Shadow                       : VERIFIED"
          echo "Position                     : VERIFIED"
          echo "Narration                    : VERIFIED"
          echo "Final MP4                    : VERIFIED"
          echo ""
          echo "OUTPUT:"
          echo "AICAP_FREE_15_LARGE_CLEAR_DYNAMIC_TEXT.mp4"
          echo ""
          echo "=============================================="
          echo "TEST 15 : SUCCESS"
          echo "=============================================="
