name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout renderer
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL FFMPEG + FONT
      # ============================================================

      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

          command -v ffmpeg
          command -v ffprobe

          test -f \
            /usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1


      # ============================================================
      # 3. LOCATE RENDER JOB
      # ============================================================

      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          ROOT="aicap-render-jobs/${JOB_ID}"

          echo "======================================"
          echo "AICAP RENDER JOB"
          echo "======================================"

          echo "Job ID : ${JOB_ID}"
          echo "Root   : ${ROOT}"

          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -f "$ROOT/narration.mp3"

          echo "scene_config.json : FOUND"
          echo "narration.mp3     : FOUND"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo "======================================"


      # ============================================================
      # 4. VALIDATE RENDER PACKAGE
      #
      # IMPORTANT:
      # - Scene timing is authoritative.
      # - Scenes must be continuous.
      # - Images must exist.
      # - Narration must exist.
      # - Subtitle metadata is validated here.
      # ============================================================

      - name: Validate render package
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"

          python3 - "$CFG" "$ROOT" "$AUDIO" <<'PY'
          import json
          import os
          import sys

          cfg_path, root, audio = sys.argv[1:4]

          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          prev_end = 0.0
          subtitle_count = 0

          for i, scene in enumerate(scenes, 1):

              try:
                  start = float(scene["start"])
                  end = float(scene["end"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"Invalid timing in scene {i}: {exc}"
                  )

              if start < 0:
                  raise SystemExit(
                      f"Invalid scene {i}: start < 0"
                  )

              if end <= start:
                  raise SystemExit(
                      f"Invalid scene {i}: end <= start"
                  )

              if abs(start - prev_end) > 0.001:
                  raise SystemExit(
                      f"Timeline gap/overlap before scene {i}: "
                      f"{start} != {prev_end}"
                  )

              filename = (
                  scene.get("filename")
                  or f"scene_{i:02d}.jpg"
              )

              image_path = os.path.join(
                  root,
                  filename
              )

              if not os.path.isfile(image_path):
                  raise SystemExit(
                      f"Missing scene image: {image_path}"
                  )

              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get("text", "")
                  ).strip()

                  if not text:
                      raise SystemExit(
                          f"Scene {i} has subtitles enabled "
                          f"but subtitle text is empty"
                      )

                  subtitle_count += 1

                  style = subtitle.get("style") or {}

                  try:
                      size = int(
                          style.get("size", 80)
                      )
                      outline = int(
                          style.get("outline", 5)
                      )
                      shadow = int(
                          style.get("shadow", 3)
                      )
                      margin = int(
                          style.get("margin", 90)
                      )
                  except (TypeError, ValueError) as exc:
                      raise SystemExit(
                          f"Invalid subtitle style in scene "
                          f"{i}: {exc}"
                      )

                  if size <= 0:
                      raise SystemExit(
                          f"Invalid subtitle size in scene {i}"
                      )

                  if outline < 0:
                      raise SystemExit(
                          f"Invalid subtitle outline in scene {i}"
                      )

                  if shadow < 0:
                      raise SystemExit(
                          f"Invalid subtitle shadow in scene {i}"
                      )

                  if margin < 0:
                      raise SystemExit(
                          f"Invalid subtitle margin in scene {i}"
                      )

              prev_end = end

          if not os.path.isfile(audio):
              raise SystemExit(
                  "Missing narration.mp3"
              )

          print(
              f"Validated {len(scenes)} "
              f"audio-driven scenes"
          )

          print(
              f"Timeline duration: "
              f"{prev_end:.3f}s"
          )

          print(
              f"Subtitle scenes: "
              f"{subtitle_count}/{len(scenes)}"
          )

          print(
              "Subtitle metadata: VERIFIED"
          )
          PY


      # ============================================================
      # 5. RENDER VIDEO
      #
      # IMPORTANT ROOT CAUSE FIX:
      #
      # Python receives FOUR arguments:
      #
      #   1 = CFG
      #   2 = ROOT
      #   3 = AUDIO
      #   4 = OUT
      #
      # Therefore:
      #
      #   cfg_path, root, audio, out = sys.argv[1:5]
      #
      # This prevents the historical:
      #
      #   NameError: name 'OUT' is not defined
      #
      # failure.
      #
      # Subtitle timing:
      #   Each subtitle is rendered inside its own scene filter.
      #   The scene is then concatenated.
      #
      # Therefore subtitle timing is exactly:
      #
      #   scene start -> scene end
      # ============================================================

      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          echo "======================================"
          echo "AICAP FFMPEG RENDER"
          echo "======================================"

          echo "CFG   : $CFG"
          echo "ROOT  : $ROOT"
          echo "AUDIO : $AUDIO"
          echo "OUT   : $OUT"

          test -f "$CFG"
          test -f "$AUDIO"

          python3 - "$CFG" "$ROOT" "$AUDIO" "$OUT" > /tmp/render.sh <<'PY'
          import json
          import os
          import shlex
          import sys

          # ========================================================
          # CRITICAL:
          # Four arguments are intentionally supplied by Bash.
          # ========================================================

          cfg_path, root, audio, out = sys.argv[1:5]

          with open(
              cfg_path,
              "r",
              encoding="utf-8"
          ) as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]

          fps = int(
              cfg.get("fps", 30)
          )

          width = int(
              cfg.get("width", 1080)
          )

          height = int(
              cfg.get("height", 1920)
          )

          if fps <= 0:
              raise SystemExit(
                  "Invalid FPS"
              )

          if width <= 0 or height <= 0:
              raise SystemExit(
                  "Invalid output dimensions"
              )

          if not os.path.isfile(audio):
              raise SystemExit(
                  f"Missing narration audio: {audio}"
              )

          def q(value):
              return shlex.quote(
                  str(value)
              )

          inputs = []
          filters = []
          concat_labels = []

          caption_font = (
              "/usr/share/fonts/truetype/"
              "liberation2/"
              "LiberationSans-Bold.ttf"
          )

          if not os.path.isfile(caption_font):
              raise SystemExit(
                  f"Caption font not found: "
                  f"{caption_font}"
              )

          for i, scene in enumerate(
              scenes
          ):

              filename = (
                  scene.get("filename")
                  or f"scene_{i + 1:02d}.jpg"
              )

              image = os.path.join(
                  root,
                  filename
              )

              if not os.path.isfile(image):
                  raise SystemExit(
                      f"Missing scene image: "
                      f"{image}"
                  )

              start = float(
                  scene["start"]
              )

              end = float(
                  scene["end"]
              )

              dur = end - start

              if dur <= 0:
                  raise SystemExit(
                      f"Invalid duration for "
                      f"scene {i + 1}: {dur}"
                  )

              motion = scene.get(
                  "motion",
                  ""
              )

              if motion not in (
                  "zoom_in",
                  "zoom_out",
                  "pan_left",
                  "pan_right",
              ):
                  motion = (
                      "zoom_in",
                      "zoom_out",
                      "pan_left",
                      "pan_right",
                  )[i % 4]

              frames = max(
                  1,
                  int(
                      round(
                          dur * fps
                      )
                  )
              )

              # ----------------------------------------------------
              # IMAGE INPUT
              # ----------------------------------------------------

              inputs += [
                  "-loop",
                  "1",
                  "-framerate",
                  str(fps),
                  "-t",
                  f"{dur:.6f}",
                  "-i",
                  image,
              ]

              # ----------------------------------------------------
              # MOTION
              # ----------------------------------------------------

              if motion == "zoom_in":

                  vf = (
                      f"scale="
                      f"{width * 2}:"
                      f"{height * 2}:"
                      f"force_original_aspect_ratio="
                      f"increase,"
                      f"crop="
                      f"{width * 2}:"
                      f"{height * 2},"
                      f"zoompan="
                      f"z='min("
                      f"zoom+0.0007,1.12)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "zoom_out":

                  vf = (
                      f"scale="
                      f"{width * 2}:"
                      f"{height * 2}:"
                      f"force_original_aspect_ratio="
                      f"increase,"
                      f"crop="
                      f"{width * 2}:"
                      f"{height * 2},"
                      f"zoompan="
                      f"z='if("
                      f"lte(on,1),"
                      f"1.12,"
                      f"max("
                      f"1.0,"
                      f"zoom-0.0007"
                      f"))':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "pan_left":

                  vf = (
                      f"scale="
                      f"{width * 2}:"
                      f"{height * 2}:"
                      f"force_original_aspect_ratio="
                      f"increase,"
                      f"crop="
                      f"{width * 2}:"
                      f"{height * 2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*"
                      f"min("
                      f"on/max(1,{frames}),"
                      f"1)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              else:

                  vf = (
                      f"scale="
                      f"{width * 2}:"
                      f"{height * 2}:"
                      f"force_original_aspect_ratio="
                      f"increase,"
                      f"crop="
                      f"{width * 2}:"
                      f"{height * 2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*("
                      f"1-min("
                      f"on/max(1,{frames}),"
                      f"1))':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # SUBTITLE
              # ----------------------------------------------------

              subtitle = (
                  scene.get("subtitle")
                  or {}
              )

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get(
                          "text",
                          ""
                      )
                  )

                  text = (
                      text
                      .replace(
                          "\r\n",
                          "\n"
                      )
                      .replace(
                          "\r",
                          "\n"
                      )
                      .strip()
                  )

                  if not text:
                      raise SystemExit(
                          f"Scene {i + 1}: "
                          f"subtitle text is empty"
                      )

                  caption_file = (
                      f"/tmp/"
                      f"aicap_caption_"
                      f"{i + 1:02d}.txt"
                  )

                  with open(
                      caption_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(text)

                  style = (
                      subtitle.get(
                          "style"
                      )
                      or {}
                  )

                  fontsize = int(
                      style.get(
                          "size",
                          80
                      )
                  )

                  outline = int(
                      style.get(
                          "outline",
                          5
                      )
                  )

                  shadow = int(
                      style.get(
                          "shadow",
                          3
                      )
                  )

                  margin = int(
                      style.get(
                          "margin",
                          90
                      )
                  )

                  if fontsize <= 0:
                      raise SystemExit(
                          f"Scene {i + 1}: "
                          f"invalid subtitle size"
                      )

                  if outline < 0:
                      raise SystemExit(
                          f"Scene {i + 1}: "
                          f"invalid subtitle outline"
                      )

                  if shadow < 0:
                      raise SystemExit(
                          f"Scene {i + 1}: "
                          f"invalid subtitle shadow"
                      )

                  if margin < 0:
                      raise SystemExit(
                          f"Scene {i + 1}: "
                          f"invalid subtitle margin"
                      )

                  # Keep multiline captions inside the
                  # visible bottom-safe area.
                  bottom_margin = max(
                      100,
                      margin + 30
                  )

                  drawtext = (
                      f"drawtext="
                      f"fontfile={q(caption_font)}:"
                      f"textfile={q(caption_file)}:"
                      f"fontcolor=white:"
                      f"fontsize={fontsize}:"
                      f"x='(w-text_w)/2':"
                      f"y='h-text_h-{bottom_margin}':"
                      f"line_spacing=10:"
                      f"borderw={outline}:"
                      f"bordercolor=black@0.85:"
                      f"shadowx={shadow}:"
                      f"shadowy={shadow}:"
                      f"shadowcolor=black@0.80:"
                      f"fix_bounds=1"
                  )

                  vf += "," + drawtext

              # ----------------------------------------------------
              # SCENE FILTER
              # ----------------------------------------------------

              filters.append(
                  f"[{i}:v]"
                  f"{vf},"
                  f"trim="
                  f"duration={dur:.6f},"
                  f"setpts="
                  f"PTS-STARTPTS"
                  f"[v{i}]"
              )

              concat_labels.append(
                  f"[v{i}]"
              )

          # ========================================================
          # CONCATENATE EXACT SCENE TIMELINE
          # ========================================================

          total_duration = float(
              scenes[-1]["end"]
          )

          filters.append(
              "".join(
                  concat_labels
              )
              + f"concat="
              f"n={len(scenes)}:"
              f"v=1:"
              f"a=0,"
              + f"trim="
              f"duration="
              f"{total_duration:.6f},"
              + "setpts=PTS-STARTPTS"
              "[v]"
          )

          # ========================================================
          # AUDIO INPUT INDEX
          # ========================================================

          audio_input_index = len(
              scenes
          )

          # ========================================================
          # FFMPEG COMMAND
          # ========================================================

          cmd = [
              "ffmpeg",
              "-y",
              "-hide_banner",
              "-loglevel",
              "error",
          ]

          cmd += inputs

          cmd += [
              "-i",
              audio,

              "-filter_complex",
              ";".join(filters),

              "-map",
              "[v]",

              "-map",
              f"{audio_input_index}:a",

              "-c:v",
              "libx264",

              "-preset",
              "medium",

              "-crf",
              "20",

              "-pix_fmt",
              "yuv420p",

              "-r",
              str(fps),

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-t",
              f"{total_duration:.6f}",

              "-af",
              "aresample=async=1:first_pts=0",

              "-movflags",
              "+faststart",

              out,
          ]

          print(
              "======================================"
          )

          print(
              "FFMPEG COMMAND"
          )

          print(
              "======================================"
          )

          print(
              " ".join(
                  q(x)
                  for x in cmd
              )
          )

          print(
              "======================================"
          )

          print(
              f"Scenes         : {len(scenes)}"
          )

          print(
              f"Timeline       : "
              f"{total_duration:.3f}s"
          )

          print(
              f"Resolution     : "
              f"{width}x{height}"
          )

          print(
              f"FPS            : {fps}"
          )

          print(
              "Subtitle Engine: FFmpeg drawtext"
          )

          print(
              "Audio          : narration.mp3"
          )

          print(
              f"Output         : {out}"
          )

          print(
              "======================================"
          )
          PY

          chmod +x /tmp/render.sh

          /tmp/render.sh | bash

          test -s "$OUT"

          echo "VIDEO RENDER : SUCCESS"


      # ============================================================
      # 6. VERIFY OUTPUT
      #
      # This verifies:
      # - MP4 exists
      # - 1080x1920
      # - H264
      # - AAC
      # - video duration matches scene timeline
      # - audio is not materially shorter
      # ============================================================

      - name: Verify output
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          OUT="$ROOT/aicap_final.mp4"

          test -s "$OUT"

          EXPECTED_DURATION="$(
            python3 - "$CFG" <<'PY'
          import json
          import sys

          with open(
              sys.argv[1],
              "r",
              encoding="utf-8"
          ) as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]

          print(
              f"{float(scenes[-1]['end']):.6f}"
          )
          PY
          )"

          WIDTH="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$OUT"
          )"

          HEIGHT="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          echo "======================================"
          echo "AICAP FINAL VIDEO VERIFICATION"
          echo "======================================"

          echo "Width          : $WIDTH"
          echo "Height         : $HEIGHT"
          echo "Video Codec    : $VIDEO_CODEC"
          echo "Audio Codec    : $AUDIO_CODEC"
          echo "Expected       : ${EXPECTED_DURATION}s"
          echo "Video Duration : ${VIDEO_DURATION}s"
          echo "Audio Duration : ${AUDIO_DURATION}s"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$VIDEO_CODEC" = "h264"
          test "$AUDIO_CODEC" = "aac"

          python3 \
            "$EXPECTED_DURATION" \
            "$VIDEO_DURATION" \
            "$AUDIO_DURATION" <<'PY'
          import sys

          expected = float(
              sys.argv[1]
          )

          video = float(
              sys.argv[2]
          )

          audio = float(
              sys.argv[3]
          )

          tolerance = 0.20

          if abs(video - expected) > tolerance:
              raise SystemExit(
                  "Rendered video duration does not match "
                  "scene timeline: "
                  f"expected={expected:.3f}s "
                  f"video={video:.3f}s"
              )

          if audio < expected - tolerance:
              raise SystemExit(
                  "Narration audio is materially shorter "
                  "than the visual timeline: "
                  f"expected={expected:.3f}s "
                  f"audio={audio:.3f}s"
              )

          print(
              "Timeline verified: "
              f"expected={expected:.3f}s "
              f"video={video:.3f}s "
              f"audio={audio:.3f}s"
          )
          PY

          echo "======================================"
          echo "VIDEO       : VERIFIED"
          echo "AUDIO       : VERIFIED"
          echo "SIZE        : 1080x1920 VERIFIED"
          echo "CODEC       : H264 + AAC VERIFIED"
          echo "TIMELINE    : VERIFIED"
          echo "SUBTITLES   : RENDERED BY DRAWTEXT"
          echo "======================================"


      # ============================================================
      # 7. PACKAGE RENDER ARTIFACT
      # ============================================================

      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp \
            "$ROOT/aicap_final.mp4" \
            artifact/aicap_final.mp4

          cp \
            "$ROOT/scene_config.json" \
            artifact/scene_config.json

          cp \
            "$ROOT/narration.mp3" \
            artifact/narration.mp3

          find "$ROOT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.png" \
            \) \
            -exec cp {} artifact/ \;


      # ============================================================
      # 8. UPLOAD GITHUB ARTIFACT
      # ============================================================

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7


      # ============================================================
      # 9. RENDER COMPLETE
      # ============================================================

      - name: Render complete
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "AICAP RENDER COMPLETE"
          echo "======================================"

          echo "Job ID    : ${JOB_ID}"
          echo "Workflow  : aicap-free-video-render-v3.yml"
          echo "Renderer  : GitHub Actions + FFmpeg"
          echo "Status    : SUCCESS"

          echo "======================================"
