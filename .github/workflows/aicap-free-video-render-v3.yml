name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout renderer
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL AND VERIFY FFMPEG + FONTS
      # ============================================================
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "AICAP RENDER ENVIRONMENT"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

          command -v ffmpeg
          command -v ffprobe

          FONT="/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"

          test -f "$FONT"

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

          echo "Caption font:"
          echo "$FONT"

          echo "======================================"
          echo "RENDER ENVIRONMENT : VERIFIED"
          echo "======================================"


      # ============================================================
      # 3. LOCATE RENDER JOB
      # ============================================================
      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          ROOT="aicap-render-jobs/${JOB_ID}"

          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -s "$ROOT/narration.mp3"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "RENDER JOB LOCATED"
          echo "Job ID : $JOB_ID"
          echo "Root   : $ROOT"
          echo "======================================"


      # ============================================================
      # 4. VALIDATE COMPLETE RENDER PACKAGE
      # ============================================================
      - name: Validate render package
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"

          python3 - "$CFG" "$ROOT" "$AUDIO" <<'PY'
          import json
          import os
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]
          audio = sys.argv[3]

          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          previous_end = 0.0
          subtitle_count = 0

          for i, scene in enumerate(scenes, 1):

              try:
                  start = float(scene["start"])
                  end = float(scene["end"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"Invalid timing in scene {i}: {exc}"
                  )

              if start < 0:
                  raise SystemExit(
                      f"Invalid scene {i}: start < 0"
                  )

              if end <= start:
                  raise SystemExit(
                      f"Invalid scene {i}: end <= start"
                  )

              if abs(start - previous_end) > 0.001:
                  raise SystemExit(
                      f"Timeline gap/overlap before scene {i}: "
                      f"{start} != {previous_end}"
                  )

              filename = (
                  scene.get("filename")
                  or f"scene_{i:02d}.jpg"
              )

              image_path = os.path.join(
                  root,
                  filename
              )

              if not os.path.isfile(image_path):
                  raise SystemExit(
                      f"Missing scene image: {image_path}"
                  )

              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get("text", "")
                  ).strip()

                  if not text:
                      raise SystemExit(
                          f"Scene {i} subtitles are enabled "
                          f"but subtitle text is empty"
                      )

                  subtitle_count += 1

                  style = subtitle.get("style") or {}

                  try:
                      size = int(style.get("size", 80))
                      outline = int(style.get("outline", 5))
                      shadow = int(style.get("shadow", 3))
                      margin = int(style.get("margin", 90))
                  except (TypeError, ValueError) as exc:
                      raise SystemExit(
                          f"Invalid subtitle style in scene "
                          f"{i}: {exc}"
                      )

                  if size < 20 or size > 140:
                      raise SystemExit(
                          f"Subtitle size out of safe range "
                          f"in scene {i}: {size}"
                      )

                  if outline < 0 or outline > 20:
                      raise SystemExit(
                          f"Subtitle outline out of safe range "
                          f"in scene {i}: {outline}"
                      )

                  if shadow < 0 or shadow > 20:
                      raise SystemExit(
                          f"Subtitle shadow out of safe range "
                          f"in scene {i}: {shadow}"
                      )

                  if margin < 0 or margin > 500:
                      raise SystemExit(
                          f"Subtitle margin out of safe range "
                          f"in scene {i}: {margin}"
                      )

              previous_end = end

          if not os.path.isfile(audio):
              raise SystemExit(
                  "Missing narration.mp3"
              )

          print("======================================")
          print("AICAP RENDER PACKAGE VALIDATION")
          print("======================================")
          print(f"Scenes            : {len(scenes)}")
          print(f"Timeline duration : {previous_end:.3f}s")
          print(
              f"Subtitle scenes   : "
              f"{subtitle_count}/{len(scenes)}"
          )
          print("Timeline          : VERIFIED")
          print("Images            : VERIFIED")
          print("Audio             : VERIFIED")
          print("Subtitle metadata : VERIFIED")
          print("======================================")
          PY


      # ============================================================
      # 5. RENDER VIDEO
      #
      # SUBTITLE DESIGN:
      #
      # 1. Each scene is rendered independently.
      # 2. Caption belongs only to that scene.
      # 3. Caption therefore cannot leak into another scene.
      # 4. Caption text is stored in a text file.
      # 5. expansion=none prevents FFmpeg interpreting caption
      #    characters such as %, backslashes, etc.
      # 6. Long captions are wrapped before rendering.
      # 7. Font size is reduced for unusually long captions.
      # 8. y uses text_h, so multiline captions remain bottom-centered.
      # ============================================================
      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          rm -f "$OUT"

          python3 - "$CFG" "$ROOT" "$AUDIO" "$OUT" > /tmp/render.sh <<'PY'
          import json
          import os
          import shlex
          import sys
          import textwrap

          cfg_path, root, audio, out = sys.argv[1:5]

          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          fps = int(cfg.get("fps", 30))
          width = int(cfg.get("width", 1080))
          height = int(cfg.get("height", 1920))

          if fps <= 0:
              raise SystemExit("Invalid FPS")

          if width <= 0 or height <= 0:
              raise SystemExit("Invalid render dimensions")

          caption_font = (
              "/usr/share/fonts/truetype/"
              "liberation2/"
              "LiberationSans-Bold.ttf"
          )

          if not os.path.isfile(caption_font):
              raise SystemExit(
                  f"Caption font not found: {caption_font}"
              )

          def shell_quote(value):
              return shlex.quote(str(value))

          inputs = []
          filters = []
          video_labels = []

          for i, scene in enumerate(scenes):

              filename = (
                  scene.get("filename")
                  or f"scene_{i + 1:02d}.jpg"
              )

              image = os.path.join(
                  root,
                  filename
              )

              start = float(scene["start"])
              end = float(scene["end"])
              duration = end - start

              if duration <= 0:
                  raise SystemExit(
                      f"Invalid scene duration: {i + 1}"
                  )

              frames = max(
                  1,
                  int(round(duration * fps))
              )

              motion = scene.get("motion", "")

              if motion not in (
                  "zoom_in",
                  "zoom_out",
                  "pan_left",
                  "pan_right"
              ):
                  motion = (
                      "zoom_in",
                      "zoom_out",
                      "pan_left",
                      "pan_right"
                  )[i % 4]

              # ====================================================
              # MOTION
              # ====================================================

              if motion == "zoom_in":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='min(zoom+0.0007,1.12)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "zoom_out":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='if(eq(on,0),1.12,"
                      f"max(1.0,zoom-0.0007))':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "pan_left":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*"
                      f"min(on/{frames},1)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              else:

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*"
                      f"(1-min(on/{frames},1))':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ====================================================
              # SUBTITLE
              # ====================================================

              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):

                  raw_text = str(
                      subtitle.get("text", "")
                  )

                  # Normalize all newline forms.
                  raw_text = raw_text.replace(
                      "\r\n",
                      "\n"
                  ).replace(
                      "\r",
                      "\n"
                  )

                  # Normalize excessive whitespace without removing
                  # intentional line breaks.
                  normalized_lines = []

                  for line in raw_text.split("\n"):
                      clean_line = " ".join(
                          line.strip().split()
                      )

                      if clean_line:
                          normalized_lines.append(
                              clean_line
                          )

                  caption_text = "\n".join(
                      normalized_lines
                  ).strip()

                  if not caption_text:
                      raise SystemExit(
                          f"Scene {i + 1} has empty subtitle text"
                      )

                  style = subtitle.get("style") or {}

                  requested_size = int(
                      style.get("size", 80)
                  )

                  outline = int(
                      style.get("outline", 5)
                  )

                  shadow = int(
                      style.get("shadow", 3)
                  )

                  margin = int(
                      style.get("margin", 90)
                  )

                  # ------------------------------------------------
                  # SAFE CAPTION WRAPPING
                  #
                  # 1080x1920 vertical video.
                  #
                  # Approximately 30 characters per line gives a
                  # conservative readable width with Liberation Sans
                  # Bold.
                  # ------------------------------------------------

                  wrapped_lines = []

                  for line in caption_text.split("\n"):

                      if len(line) <= 30:
                          wrapped_lines.append(line)
                      else:
                          wrapped_lines.extend(
                              textwrap.wrap(
                                  line,
                                  width=30,
                                  break_long_words=False,
                                  break_on_hyphens=False
                              )
                          )

                  caption_text = "\n".join(
                      wrapped_lines
                  )

                  line_count = max(
                      1,
                      len(wrapped_lines)
                  )

                  # ------------------------------------------------
                  # DYNAMIC FONT SIZE
                  #
                  # Keep normal captions at requested size.
                  # Reduce only when captions become unusually long.
                  # ------------------------------------------------

                  if line_count <= 2:
                      fontsize = requested_size
                  elif line_count == 3:
                      fontsize = min(
                          requested_size,
                          72
                      )
                  elif line_count == 4:
                      fontsize = min(
                          requested_size,
                          64
                      )
                  else:
                      fontsize = min(
                          requested_size,
                          56
                      )

                  fontsize = max(
                      48,
                      fontsize
                  )

                  caption_file = (
                      f"/tmp/aicap_caption_"
                      f"{i + 1:02d}.txt"
                  )

                  # UTF-8 caption file.
                  #
                  # FFmpeg drawtext reads this file directly.
                  with open(
                      caption_file,
                      "w",
                      encoding="utf-8"
                  ) as caption_handle:

                      caption_handle.write(
                          caption_text
                      )

                  bottom_margin = max(
                      100,
                      margin + 30
                  )

                  # ------------------------------------------------
                  # CRITICAL:
                  #
                  # expansion=none prevents drawtext from treating
                  # characters in captions as expressions.
                  #
                  # This is particularly important for:
                  #
                  # %
                  # \
                  # :
                  # '
                  # $
                  # brackets
                  # etc.
                  #
                  # The caption is therefore rendered as LITERAL TEXT.
                  # ------------------------------------------------

                  drawtext = (
                      "drawtext="
                      f"fontfile={shell_quote(caption_font)}:"
                      f"textfile={shell_quote(caption_file)}:"
                      "expansion=none:"
                      "fontcolor=white:"
                      f"fontsize={fontsize}:"
                      "x='(w-text_w)/2':"
                      f"y='h-text_h-{bottom_margin}':"
                      "line_spacing=10:"
                      f"borderw={outline}:"
                      "bordercolor=black@0.90:"
                      f"shadowx={shadow}:"
                      f"shadowy={shadow}:"
                      "shadowcolor=black@0.85:"
                      "fix_bounds=1"
                  )

                  vf += "," + drawtext

                  print(
                      f"# Scene {i + 1}: "
                      f"subtitle enabled | "
                      f"lines={line_count} | "
                      f"fontsize={fontsize}",
                      file=sys.stderr
                  )

              # ====================================================
              # INPUT
              # ====================================================

              inputs += [
                  "-loop",
                  "1",
                  "-framerate",
                  str(fps),
                  "-t",
                  f"{duration:.6f}",
                  "-i",
                  image
              ]

              # ====================================================
              # SCENE VIDEO
              # ====================================================

              filters.append(
                  f"[{i}:v]"
                  f"{vf},"
                  f"trim=duration={duration:.6f},"
                  f"setpts=PTS-STARTPTS"
                  f"[v{i}]"
              )

              video_labels.append(
                  f"[v{i}]"
              )

          # ========================================================
          # CONCATENATE ALL SCENES
          # ========================================================

          total_duration = float(
              scenes[-1]["end"]
          )

          filters.append(
              "".join(video_labels)
              + f"concat=n={len(scenes)}:v=1:a=0,"
              + f"trim=duration={total_duration:.6f},"
              + "setpts=PTS-STARTPTS[v]"
          )

          audio_input_index = len(scenes)

          # ========================================================
          # FFMPEG COMMAND
          # ========================================================

          cmd = [
              "ffmpeg",
              "-y",
              "-hide_banner",
              "-loglevel",
              "error"
          ]

          cmd += inputs

          cmd += [
              "-i",
              audio,

              "-filter_complex",
              ";".join(filters),

              "-map",
              "[v]",

              "-map",
              f"{audio_input_index}:a",

              "-c:v",
              "libx264",

              "-preset",
              "medium",

              "-crf",
              "20",

              "-pix_fmt",
              "yuv420p",

              "-r",
              str(fps),

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-t",
              f"{total_duration:.6f}",

              "-af",
              "aresample=async=1:first_pts=0",

              "-movflags",
              "+faststart",

              out
          ]

          print(
              " ".join(
                  shell_quote(x)
                  for x in cmd
              )
          )
          PY

          chmod +x /tmp/render.sh

          echo "======================================"
          echo "AICAP VIDEO RENDER"
          echo "======================================"

          /tmp/render.sh | bash

          test -s "$OUT"

          echo "======================================"
          echo "RENDER : SUCCESS"
          echo "OUTPUT : $OUT"
          echo "======================================"


      # ============================================================
      # 6. VERIFY FINAL MP4
      # ============================================================
      - name: Verify output
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"
          CFG="$ROOT/scene_config.json"

          test -s "$OUT"

          echo "======================================"
          echo "AICAP FINAL VIDEO VERIFICATION"
          echo "======================================"

          echo "===== VIDEO STREAM ====="

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          echo "===== AUDIO STREAM ====="

          ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          WIDTH="$(
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$OUT"
          )"

          HEIGHT="$(
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_CODEC="$(
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_CODEC="$(
            ffprobe -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_DURATION="$(
            ffprobe -v error \
              -select_streams v:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_DURATION="$(
            ffprobe -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$VIDEO_CODEC" = "h264"
          test "$AUDIO_CODEC" = "aac"

          python3 - "$CFG" "$VIDEO_DURATION" "$AUDIO_DURATION" <<'PY'
          import json
          import sys

          cfg_path = sys.argv[1]
          video_duration = float(sys.argv[2])
          audio_duration = float(sys.argv[3])

          with open(
              cfg_path,
              "r",
              encoding="utf-8"
          ) as f:
              cfg = json.load(f)

          scenes = cfg.get("scenes")

          if not scenes:
              raise SystemExit(
                  "No scenes found during final verification"
              )

          expected = float(
              scenes[-1]["end"]
          )

          # Video must closely match the authoritative scene timeline.
          if abs(video_duration - expected) > 0.20:
              raise SystemExit(
                  "Rendered video duration mismatch: "
                  f"expected={expected:.3f}s "
                  f"actual={video_duration:.3f}s"
              )

          # Audio must not be materially shorter.
          if audio_duration < expected - 0.20:
              raise SystemExit(
                  "Narration audio is materially shorter "
                  f"than expected: "
                  f"expected={expected:.3f}s "
                  f"actual={audio_duration:.3f}s"
              )

          print(
              "Timeline verified:"
              f" expected={expected:.3f}s"
              f" video={video_duration:.3f}s"
              f" audio={audio_duration:.3f}s"
          )
          PY

          echo "======================================"
          echo "VIDEO        : VERIFIED"
          echo "AUDIO        : VERIFIED"
          echo "SIZE         : 1080x1920 VERIFIED"
          echo "CODEC        : H264 + AAC VERIFIED"
          echo "TIMELINE     : VERIFIED"
          echo "SUBTITLE     : DRAWN BY FFMPEG"
          echo "======================================"


      # ============================================================
      # 7. PACKAGE RENDER ARTIFACT
      # ============================================================
      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp \
            "$ROOT/aicap_final.mp4" \
            artifact/aicap_final.mp4

          cp \
            "$ROOT/scene_config.json" \
            artifact/scene_config.json

          cp \
            "$ROOT/narration.mp3" \
            artifact/narration.mp3

          find "$ROOT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.png" \
            \) \
            -exec cp {} artifact/ \;

          echo "======================================"
          echo "ARTIFACT PACKAGE : READY"
          echo "======================================"


      # ============================================================
      # 8. UPLOAD GITHUB ARTIFACT
      # ============================================================
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
