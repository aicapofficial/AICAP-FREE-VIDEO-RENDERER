name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout renderer
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL FFMPEG + FONTS
      # ============================================================
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-liberation

          command -v ffmpeg
          command -v ffprobe

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          FONT="/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"

          test -f "$FONT"

          echo "Using subtitle font: $FONT"


      # ============================================================
      # 3. LOCATE AICAP RENDER JOB
      # ============================================================
      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          ROOT="aicap-render-jobs/${JOB_ID}"

          echo "======================================"
          echo "AICAP RENDER JOB"
          echo "======================================"
          echo "JOB_ID : ${JOB_ID}"
          echo "ROOT   : ${ROOT}"
          echo "======================================"

          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -s "$ROOT/narration.mp3"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo "Render job located successfully."


      # ============================================================
      # 4. VALIDATE JSON RENDER PACKAGE
      #
      # CRITICAL:
      #
      # scene_config.json is JSON DATA.
      #
      # NEVER execute scene_config.json as Python.
      #
      # JSON:
      #     true
      #     false
      #     null
      #
      # are valid JSON values.
      #
      # Python receives the JSON through json.load().
      # Therefore true/false are converted correctly to:
      #
      #     True
      #     False
      #
      # internally.
      # ============================================================
      - name: Validate render package
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"

          echo "======================================"
          echo "AICAP JSON VALIDATION"
          echo "======================================"

          python3 - "$CFG" "$ROOT" <<'PY'
          import json
          import os
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]

          print("Reading JSON:", cfg_path)

          # IMPORTANT:
          # JSON is READ as DATA.
          # It is NEVER executed as Python.
          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          if not isinstance(cfg, dict):
              raise SystemExit(
                  "scene_config.json root must be an object"
              )

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          fps = int(cfg.get("fps", 30))
          width = int(cfg.get("width", 1080))
          height = int(cfg.get("height", 1920))

          if fps <= 0:
              raise SystemExit("Invalid FPS")

          if width <= 0 or height <= 0:
              raise SystemExit(
                  "Invalid render dimensions"
              )

          prev_end = 0.0

          allowed_motions = {
              "zoom_in",
              "zoom_out",
              "pan_left",
              "pan_right"
          }

          for i, scene in enumerate(scenes, 1):

              if not isinstance(scene, dict):
                  raise SystemExit(
                      f"Scene {i} is not an object"
                  )

              try:
                  start = float(scene["start"])
                  end = float(scene["end"])
              except (
                  KeyError,
                  TypeError,
                  ValueError
              ) as exc:
                  raise SystemExit(
                      f"Invalid timing in scene {i}: {exc}"
                  )

              if start < 0:
                  raise SystemExit(
                      f"Invalid scene {i}: start < 0"
                  )

              if end <= start:
                  raise SystemExit(
                      f"Invalid scene {i}: end <= start"
                  )

              if abs(start - prev_end) > 0.001:
                  raise SystemExit(
                      f"Timeline gap/overlap before scene {i}: "
                      f"{start} != {prev_end}"
                  )

              filename = (
                  scene.get("filename")
                  or f"scene_{i:02d}.jpg"
              )

              image_path = os.path.join(
                  root,
                  filename
              )

              if not os.path.isfile(image_path):
                  raise SystemExit(
                      f"Missing scene image: {image_path}"
                  )

              motion = scene.get("motion", "")

              if motion and motion not in allowed_motions:
                  print(
                      f"WARNING: unsupported motion in scene "
                      f"{i}; renderer fallback will be used"
                  )

              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get("text", "")
                  ).strip()

                  if not text:
                      raise SystemExit(
                          f"Scene {i} subtitles enabled "
                          f"but subtitle text is empty"
                      )

              prev_end = end

          narration = os.path.join(
              root,
              "narration.mp3"
          )

          if not os.path.isfile(narration):
              raise SystemExit(
                  "Missing narration.mp3"
              )

          if os.path.getsize(narration) <= 0:
              raise SystemExit(
                  "narration.mp3 is empty"
              )

          print("")
          print("======================================")
          print("JSON VALIDATION : SUCCESS")
          print("======================================")
          print(f"Scenes           : {len(scenes)}")
          print(f"Resolution       : {width}x{height}")
          print(f"FPS              : {fps}")
          print(
              f"Timeline duration: {prev_end:.3f}s"
          )
          print("Narration        : PRESENT")
          print("Scene images     : VERIFIED")
          print("JSON booleans    : PARSED")
          print("======================================")
          PY


      # ============================================================
      # 5. RENDER VIDEO
      #
      # AUDIO-DRIVEN
      #
      # Every scene duration comes directly from:
      #
      #     scene["end"] - scene["start"]
      #
      # The complete narration remains continuous.
      #
      # Motion:
      #     zoom_in
      #     zoom_out
      #     pan_left
      #     pan_right
      #
      # Subtitle:
      #     FFmpeg drawtext
      #
      # Transition:
      #     fade in / fade out
      # ============================================================
      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          python3 \
            "$CFG" \
            "$ROOT" \
            "$AUDIO" \
            "$OUT" \
            > /tmp/aicap_render.sh <<'PY'

          import json
          import os
          import shlex
          import sys

          cfg_path, root, audio, out = sys.argv[1:5]

          # ========================================================
          # CRITICAL FIX
          #
          # JSON FILE IS DATA ONLY.
          #
          # It is read with json.load().
          #
          # NEVER:
          #
          #   python3 scene_config.json
          #
          # ========================================================
          with open(
              cfg_path,
              "r",
              encoding="utf-8"
          ) as f:
              cfg = json.load(f)

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          fps = int(
              cfg.get("fps", 30)
          )

          width = int(
              cfg.get("width", 1080)
          )

          height = int(
              cfg.get("height", 1920)
          )

          if fps <= 0:
              raise SystemExit(
                  "Invalid FPS"
              )

          if width <= 0 or height <= 0:
              raise SystemExit(
                  "Invalid render dimensions"
              )

          caption_font = (
              "/usr/share/fonts/truetype/"
              "liberation2/"
              "LiberationSans-Bold.ttf"
          )

          if not os.path.isfile(caption_font):
              raise SystemExit(
                  f"Caption font not found: "
                  f"{caption_font}"
              )

          def q(value):
              return shlex.quote(
                  str(value)
              )

          inputs = []
          filters = []
          concat_labels = []

          motions = (
              "zoom_in",
              "zoom_out",
              "pan_left",
              "pan_right"
          )

          # ========================================================
          # BUILD EACH SCENE
          # ========================================================
          for i, scene in enumerate(scenes):

              filename = (
                  scene.get("filename")
                  or f"scene_{i + 1:02d}.jpg"
              )

              image = os.path.join(
                  root,
                  filename
              )

              start = float(
                  scene["start"]
              )

              end = float(
                  scene["end"]
              )

              dur = end - start

              if dur <= 0:
                  raise SystemExit(
                      f"Invalid duration "
                      f"for scene {i + 1}: {dur}"
                  )

              motion = scene.get(
                  "motion",
                  ""
              )

              if motion not in motions:
                  motion = motions[
                      i % len(motions)
                  ]

              frames = max(
                  1,
                  int(round(dur * fps))
              )

              # ----------------------------------------------------
              # IMAGE INPUT
              # ----------------------------------------------------
              inputs += [
                  "-loop",
                  "1",
                  "-framerate",
                  str(fps),
                  "-t",
                  f"{dur:.6f}",
                  "-i",
                  image
              ]

              # ----------------------------------------------------
              # MOTION
              # ----------------------------------------------------
              if motion == "zoom_in":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='min(zoom+0.0007,1.12)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "zoom_out":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='if(lte(on,1),1.12,"
                      f"max(1.0,zoom-0.0007))':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "pan_left":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*"
                      f"min(on/max(1,{frames}),1)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              else:

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*(1-"
                      f"min(on/max(1,{frames}),1))':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # SUBTITLES
              # ----------------------------------------------------
              subtitle = (
                  scene.get("subtitle")
                  or {}
              )

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get(
                          "text",
                          ""
                      )
                  ).replace(
                      "\r\n",
                      "\n"
                  ).replace(
                      "\r",
                      "\n"
                  ).strip()

                  caption_file = (
                      f"/tmp/aicap_caption_"
                      f"{i + 1:02d}.txt"
                  )

                  with open(
                      caption_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(text)

                  style = (
                      subtitle.get("style")
                      or {}
                  )

                  fontsize = int(
                      style.get(
                          "size",
                          80
                      )
                  )

                  outline = int(
                      style.get(
                          "outline",
                          5
                      )
                  )

                  shadow = int(
                      style.get(
                          "shadow",
                          3
                      )
                  )

                  margin = int(
                      style.get(
                          "margin",
                          90
                      )
                  )

                  bottom_margin = max(
                      100,
                      margin + 30
                  )

                  drawtext = (
                      "drawtext="
                      f"fontfile={q(caption_font)}:"
                      f"textfile={q(caption_file)}:"
                      "fontcolor=white:"
                      f"fontsize={fontsize}:"
                      "x='(w-text_w)/2':"
                      f"y='h-text_h-{bottom_margin}':"
                      "line_spacing=10:"
                      f"borderw={outline}:"
                      "bordercolor=black@0.85:"
                      f"shadowx={shadow}:"
                      f"shadowy={shadow}:"
                      "shadowcolor=black@0.80:"
                      "fix_bounds=1"
                  )

                  vf += "," + drawtext

              # ----------------------------------------------------
              # FADE
              # ----------------------------------------------------
              fade = min(
                  0.5,
                  max(
                      0.05,
                      dur / 4.0
                  )
              )

              fade_out_start = max(
                  0,
                  dur - fade
              )

              vf += (
                  f",fade=t=in:"
                  f"st=0:"
                  f"d={fade:.6f}"
              )

              vf += (
                  f",fade=t=out:"
                  f"st={fade_out_start:.6f}:"
                  f"d={fade:.6f}"
              )

              # ----------------------------------------------------
              # EXACT SCENE DURATION
              # ----------------------------------------------------
              filters.append(
                  f"[{i}:v]"
                  f"{vf},"
                  f"trim=duration={dur:.6f},"
                  f"setpts=PTS-STARTPTS"
                  f"[v{i}]"
              )

              concat_labels.append(
                  f"[v{i}]"
              )

          # ========================================================
          # CONCATENATE ALL VISUAL SCENES
          # ========================================================
          total_duration = float(
              scenes[-1]["end"]
          )

          audio_input_index = len(
              scenes
          )

          filters.append(
              "".join(concat_labels)
              +
              f"concat=n={len(scenes)}:"
              f"v=1:a=0,"
              f"trim=duration={total_duration:.6f},"
              "setpts=PTS-STARTPTS[v]"
          )

          # ========================================================
          # FFMPEG COMMAND
          # ========================================================
          cmd = [
              "ffmpeg",
              "-y",
              "-hide_banner",
              "-loglevel",
              "error"
          ] + inputs

          cmd += [
              "-i",
              audio,

              "-filter_complex",
              ";".join(filters),

              "-map",
              "[v]",

              "-map",
              f"{audio_input_index}:a",

              "-c:v",
              "libx264",

              "-preset",
              "medium",

              "-crf",
              "20",

              "-pix_fmt",
              "yuv420p",

              "-r",
              str(fps),

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-t",
              f"{total_duration:.6f}",

              "-af",
              "aresample=async=1:first_pts=0",

              "-movflags",
              "+faststart",

              out
          ]

          print(
              " ".join(
                  q(x)
                  for x in cmd
              )
          )

          PY

          chmod +x /tmp/aicap_render.sh

          /tmp/aicap_render.sh | bash

          test -s "$OUT"

          echo ""
          echo "======================================"
          echo "AICAP RENDER COMPLETED"
          echo "======================================"
          echo "Output : $OUT"
          echo "======================================"


      # ============================================================
      # 6. FINAL OUTPUT VERIFICATION
      # ============================================================
      - name: Verify output
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"

          test -s "$OUT"

          echo "======================================"
          echo "AICAP FINAL OUTPUT VERIFICATION"
          echo "======================================"

          echo "===== VIDEO STREAM ====="

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries \
              stream=codec_name,width,height,r_frame_rate,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          echo "===== AUDIO STREAM ====="

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries \
              stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          WIDTH="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$OUT"
          )"

          HEIGHT="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$AUDIO_CODEC" = "aac"

          python3 \
            "$VIDEO_DURATION" \
            "$AUDIO_DURATION" \
            "${{ steps.locate.outputs.root }}/scene_config.json" \
            <<'PY'

          import json
          import sys

          video = float(
              sys.argv[1]
          )

          audio = float(
              sys.argv[2]
          )

          cfg_path = sys.argv[3]

          with open(
              cfg_path,
              "r",
              encoding="utf-8"
          ) as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]

          expected = float(
              scenes[-1]["end"]
          )

          # Video must match the audio-driven scene timeline.
          if abs(video - expected) > 0.20:
              raise SystemExit(
                  "Rendered video duration does not "
                  "match scene timeline: "
                  f"expected={expected:.3f}s "
                  f"video={video:.3f}s"
              )

          # Audio must not be materially shorter.
          if audio < expected - 0.20:
              raise SystemExit(
                  "Narration audio is materially shorter "
                  "than the visual timeline: "
                  f"expected={expected:.3f}s "
                  f"audio={audio:.3f}s"
              )

          print(
              "Timeline verified: "
              f"expected={expected:.3f}s "
              f"video={video:.3f}s "
              f"audio={audio:.3f}s"
          )

          PY

          echo ""
          echo "======================================"
          echo "FINAL VERIFICATION : SUCCESS"
          echo "======================================"
          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "Audio      : ${AUDIO_CODEC}"
          echo "Video      : ${VIDEO_DURATION}s"
          echo "Audio      : ${AUDIO_DURATION}s"
          echo "Timeline   : VERIFIED"
          echo "======================================"


      # ============================================================
      # 7. PACKAGE ARTIFACT
      # ============================================================
      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp \
            "$ROOT/aicap_final.mp4" \
            artifact/aicap_final.mp4

          cp \
            "$ROOT/scene_config.json" \
            artifact/scene_config.json

          cp \
            "$ROOT/narration.mp3" \
            artifact/narration.mp3

          find "$ROOT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.png" \
            \) \
            -exec cp {} artifact/ \;

          echo "Artifact package prepared."


      # ============================================================
      # 8. UPLOAD FINAL GITHUB ARTIFACT
      # ============================================================
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
