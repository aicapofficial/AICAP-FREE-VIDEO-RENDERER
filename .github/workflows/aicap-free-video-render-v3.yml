name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout renderer
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL FFMPEG + FONTS
      # ============================================================
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

          echo "===== FFMPEG ====="
          command -v ffmpeg
          ffmpeg -version | head -n 1

          echo "===== FFPROBE ====="
          command -v ffprobe
          ffprobe -version | head -n 1

          echo "===== FONT ====="
          FONT="/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          test -f "$FONT"
          echo "Using subtitle font: $FONT"


      # ============================================================
      # 3. LOCATE AICAP RENDER JOB
      # ============================================================
      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          ROOT="aicap-render-jobs/${JOB_ID}"

          echo "======================================"
          echo "AICAP RENDER JOB"
          echo "======================================"
          echo "Job ID : ${JOB_ID}"
          echo "Root   : ${ROOT}"
          echo "======================================"

          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -f "$ROOT/narration.mp3"

          echo "Render job directory : VERIFIED"
          echo "scene_config.json     : VERIFIED"
          echo "narration.mp3         : VERIFIED"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. VALIDATE JSON CONFIGURATION
      #
      # CRITICAL:
      # scene_config.json is DATA.
      #
      # It is NEVER executed as Python.
      #
      # Python receives the filename as sys.argv and json.load()
      # parses it.
      # ============================================================
      - name: Validate render configuration
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"

          echo "======================================"
          echo "AICAP JSON CONFIGURATION VALIDATION"
          echo "======================================"
          echo "Config : $CFG"
          echo "======================================"

          python3 - "$CFG" "$ROOT" <<'PY'
          import json
          import os
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]

          print("Reading JSON configuration...")
          print(f"Config path: {cfg_path}")

          # --------------------------------------------------------
          # CRITICAL FIX
          # --------------------------------------------------------
          # The JSON file is opened and parsed as JSON.
          # It is NOT executed as Python.
          # Therefore JSON values true/false/null are handled
          # correctly.
          # --------------------------------------------------------
          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          if not isinstance(cfg, dict):
              raise SystemExit(
                  "scene_config.json root must be a JSON object"
              )

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          fps = int(cfg.get("fps", 30))
          width = int(cfg.get("width", 1080))
          height = int(cfg.get("height", 1920))

          if fps <= 0:
              raise SystemExit("Invalid FPS")

          if width <= 0 or height <= 0:
              raise SystemExit(
                  "Invalid output dimensions"
              )

          previous_end = 0.0

          allowed_motion = {
              "zoom_in",
              "zoom_out",
              "pan_left",
              "pan_right",
          }

          for index, scene in enumerate(scenes, 1):

              if not isinstance(scene, dict):
                  raise SystemExit(
                      f"Scene {index} is not an object"
                  )

              try:
                  start = float(scene["start"])
                  end = float(scene["end"])
              except (
                  KeyError,
                  TypeError,
                  ValueError,
              ) as exc:
                  raise SystemExit(
                      f"Invalid timing in scene {index}: {exc}"
                  )

              if start < 0:
                  raise SystemExit(
                      f"Invalid scene {index}: start < 0"
                  )

              if end <= start:
                  raise SystemExit(
                      f"Invalid scene {index}: end <= start"
                  )

              if abs(start - previous_end) > 0.001:
                  raise SystemExit(
                      "Timeline gap/overlap before "
                      f"scene {index}: "
                      f"{start} != {previous_end}"
                  )

              filename = (
                  scene.get("filename")
                  or f"scene_{index:02d}.jpg"
              )

              image_path = os.path.join(
                  root,
                  filename
              )

              if not os.path.isfile(image_path):
                  raise SystemExit(
                      f"Missing scene image: {image_path}"
                  )

              motion = scene.get("motion", "")

              if (
                  motion
                  and motion not in allowed_motion
              ):
                  print(
                      f"WARNING: unsupported motion "
                      f"in scene {index}: {motion}"
                  )

              subtitle = (
                  scene.get("subtitle")
                  or {}
              )

              if subtitle.get("enabled"):

                  subtitle_text = str(
                      subtitle.get("text", "")
                  ).strip()

                  if not subtitle_text:
                      raise SystemExit(
                          "Scene "
                          f"{index} subtitles are enabled "
                          "but subtitle text is empty"
                      )

              previous_end = end

          narration = os.path.join(
              root,
              "narration.mp3"
          )

          if not os.path.isfile(narration):
              raise SystemExit(
                  "Missing narration.mp3"
              )

          print("")
          print("======================================")
          print("JSON VALIDATION SUCCESS")
          print("======================================")
          print(f"Scenes           : {len(scenes)}")
          print(f"Resolution       : {width}x{height}")
          print(f"FPS              : {fps}")
          print(
              f"Timeline duration: "
              f"{previous_end:.3f}s"
          )
          print("JSON parser      : Python json.load()")
          print("JSON execution   : NONE")
          print("Subtitle metadata: VERIFIED")
          print("Images           : VERIFIED")
          print("Narration        : VERIFIED")
          print("======================================")
          PY


      # ============================================================
      # 5. GENERATE FFmpeg COMMAND
      #
      # IMPORTANT:
      # Again, JSON is passed as DATA.
      # It is never executed.
      # ============================================================
      - name: Generate FFmpeg render script
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          python3 \
            - "$CFG" "$ROOT" "$AUDIO" "$OUT" \
            > /tmp/aicap_render.sh <<'PY'

          import json
          import os
          import shlex
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]
          audio = sys.argv[3]
          output = sys.argv[4]

          # --------------------------------------------------------
          # CRITICAL JSON FIX
          # --------------------------------------------------------
          # JSON is loaded as DATA.
          # Never execute scene_config.json.
          # --------------------------------------------------------
          with open(
              cfg_path,
              "r",
              encoding="utf-8"
          ) as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]

          fps = int(
              cfg.get("fps", 30)
          )

          width = int(
              cfg.get("width", 1080)
          )

          height = int(
              cfg.get("height", 1920)
          )

          if fps <= 0:
              raise SystemExit(
                  "Invalid FPS"
              )

          if width <= 0 or height <= 0:
              raise SystemExit(
                  "Invalid output dimensions"
              )

          def quote(value):
              return shlex.quote(
                  str(value)
              )

          inputs = []
          filters = []
          labels = []

          font = (
              "/usr/share/fonts/"
              "truetype/liberation2/"
              "LiberationSans-Bold.ttf"
          )

          motions = (
              "zoom_in",
              "zoom_out",
              "pan_left",
              "pan_right",
          )

          for index, scene in enumerate(
              scenes
          ):

              filename = (
                  scene.get("filename")
                  or f"scene_{index + 1:02d}.jpg"
              )

              image = os.path.join(
                  root,
                  filename
              )

              start = float(
                  scene["start"]
              )

              end = float(
                  scene["end"]
              )

              duration = end - start

              if duration <= 0:
                  raise SystemExit(
                      "Invalid duration for "
                      f"scene {index + 1}"
                  )

              motion = scene.get(
                  "motion",
                  ""
              )

              if motion not in motions:
                  motion = motions[
                      index % len(motions)
                  ]

              frames = max(
                  1,
                  int(
                      round(
                          duration * fps
                      )
                  )
              )

              inputs += [
                  "-loop",
                  "1",
                  "-framerate",
                  str(fps),
                  "-t",
                  f"{duration:.6f}",
                  "-i",
                  image,
              ]

              # ----------------------------------------------------
              # MOTION
              # ----------------------------------------------------

              if motion == "zoom_in":

                  vf = (
                      f"scale={width * 2}:"
                      f"{height * 2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:"
                      f"{height * 2},"
                      "zoompan="
                      "z='min(zoom+0.0007,1.12)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "zoom_out":

                  vf = (
                      f"scale={width * 2}:"
                      f"{height * 2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:"
                      f"{height * 2},"
                      "zoompan="
                      "z='if(lte(on,1),1.12,"
                      "max(1.0,zoom-0.0007))':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "pan_left":

                  vf = (
                      f"scale={width * 2}:"
                      f"{height * 2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:"
                      f"{height * 2},"
                      "zoompan="
                      "z='1.08':"
                      f"x='(iw-iw/zoom)*"
                      f"min(on/max(1,{frames}),1)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              else:

                  vf = (
                      f"scale={width * 2}:"
                      f"{height * 2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:"
                      f"{height * 2},"
                      "zoompan="
                      "z='1.08':"
                      f"x='(iw-iw/zoom)*(1-"
                      f"min(on/max(1,{frames}),1))':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # SUBTITLES
              # ----------------------------------------------------

              subtitle = (
                  scene.get("subtitle")
                  or {}
              )

              if subtitle.get(
                  "enabled"
              ):

                  text = str(
                      subtitle.get(
                          "text",
                          ""
                      )
                  )

                  text = (
                      text
                      .replace(
                          "\r\n",
                          "\n"
                      )
                      .replace(
                          "\r",
                          "\n"
                      )
                      .strip()
                  )

                  caption_file = (
                      f"/tmp/"
                      f"aicap_caption_"
                      f"{index + 1:02d}.txt"
                  )

                  with open(
                      caption_file,
                      "w",
                      encoding="utf-8"
                  ) as caption:

                      caption.write(
                          text
                      )

                  style = (
                      subtitle.get(
                          "style"
                      )
                      or {}
                  )

                  fontsize = int(
                      style.get(
                          "size",
                          80
                      )
                  )

                  outline = int(
                      style.get(
                          "outline",
                          5
                      )
                  )

                  shadow = int(
                      style.get(
                          "shadow",
                          3
                      )
                  )

                  margin = int(
                      style.get(
                          "margin",
                          90
                      )
                  )

                  bottom_margin = max(
                      100,
                      margin + 30
                  )

                  drawtext = (
                      "drawtext="
                      f"fontfile={quote(font)}:"
                      f"textfile={quote(caption_file)}:"
                      "fontcolor=white:"
                      f"fontsize={fontsize}:"
                      "x='(w-text_w)/2':"
                      f"y='h-text_h-{bottom_margin}':"
                      "line_spacing=10:"
                      f"borderw={outline}:"
                      "bordercolor=black@0.85:"
                      f"shadowx={shadow}:"
                      f"shadowy={shadow}:"
                      "shadowcolor=black@0.80:"
                      "fix_bounds=1"
                  )

                  vf += "," + drawtext

              # ----------------------------------------------------
              # FADE IN / FADE OUT
              # ----------------------------------------------------

              fade_duration = min(
                  0.5,
                  max(
                      0.05,
                      duration / 4.0
                  )
              )

              fade_start = max(
                  0.0,
                  duration - fade_duration
              )

              vf += (
                  f",fade=t=in:"
                  f"st=0:"
                  f"d={fade_duration:.6f}"
                  f",fade=t=out:"
                  f"st={fade_start:.6f}:"
                  f"d={fade_duration:.6f}"
              )

              filters.append(
                  f"[{index}:v]"
                  f"{vf},"
                  f"trim="
                  f"duration={duration:.6f},"
                  "setpts=PTS-STARTPTS"
                  f"[v{index}]"
              )

              labels.append(
                  f"[v{index}]"
              )

          # --------------------------------------------------------
          # CONCATENATE ALL SCENES
          # --------------------------------------------------------

          total_duration = float(
              scenes[-1]["end"]
          )

          audio_input_index = len(
              scenes
          )

          filters.append(
              "".join(labels)
              + f"concat=n={len(scenes)}:"
              "v=1:a=0,"
              f"trim=duration="
              f"{total_duration:.6f},"
              "setpts=PTS-STARTPTS"
              "[v]"
          )

          # --------------------------------------------------------
          # FINAL FFMPEG COMMAND
          # --------------------------------------------------------

          command = [
              "ffmpeg",
              "-y",
              "-hide_banner",
              "-loglevel",
              "error",
          ]

          command += inputs

          command += [
              "-i",
              audio,

              "-filter_complex",
              ";".join(filters),

              "-map",
              "[v]",

              "-map",
              f"{audio_input_index}:a",

              "-c:v",
              "libx264",

              "-preset",
              "medium",

              "-crf",
              "20",

              "-pix_fmt",
              "yuv420p",

              "-r",
              str(fps),

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-t",
              f"{total_duration:.6f}",

              "-af",
              "aresample=async=1:first_pts=0",

              "-movflags",
              "+faststart",

              output,
          ]

          print(
              " ".join(
                  quote(item)
                  for item in command
              )
          )

          PY

          chmod +x /tmp/aicap_render.sh


      # ============================================================
      # 6. EXECUTE REAL FFMPEG RENDER
      # ============================================================
      - name: Render video with FFmpeg
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"

          echo "======================================"
          echo "AICAP REAL FFMPEG RENDER"
          echo "======================================"
          echo "Output : $OUT"
          echo "======================================"

          /tmp/aicap_render.sh | bash

          test -s "$OUT"

          echo ""
          echo "======================================"
          echo "FFMPEG RENDER SUCCESS"
          echo "======================================"
          echo "Output exists : YES"
          echo "Output size   : $(du -h "$OUT" | cut -f1)"
          echo "======================================"


      # ============================================================
      # 7. VERIFY FINAL MP4
      # ============================================================
      - name: Verify final MP4
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"
          CFG="$ROOT/scene_config.json"

          test -s "$OUT"

          echo "======================================"
          echo "AICAP FINAL OUTPUT VERIFICATION"
          echo "======================================"

          echo ""
          echo "===== VIDEO STREAM ====="

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries \
              stream=codec_name,width,height,r_frame_rate,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          echo ""
          echo "===== AUDIO STREAM ====="

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries \
              stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          WIDTH="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$OUT"
          )"

          HEIGHT="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$AUDIO_CODEC" = "aac"

          EXPECTED_DURATION="$(
            python3 - "$CFG" <<'PY'
          import json
          import sys

          cfg_path = sys.argv[1]

          with open(
              cfg_path,
              "r",
              encoding="utf-8"
          ) as f:
              cfg = json.load(f)

          scenes = cfg.get("scenes") or []

          if not scenes:
              raise SystemExit(
                  "No scenes found"
              )

          print(
              f"{float(scenes[-1]['end']):.6f}"
          )
          PY
          )"

          python3 \
            "$VIDEO_DURATION" \
            "$AUDIO_DURATION" \
            "$EXPECTED_DURATION" <<'PY'

          import sys

          video = float(
              sys.argv[1]
          )

          audio = float(
              sys.argv[2]
          )

          expected = float(
              sys.argv[3]
          )

          # --------------------------------------------------------
          # Audio-driven renderer verification
          # --------------------------------------------------------

          if abs(video - expected) > 0.20:

              raise SystemExit(
                  "Rendered video duration "
                  "does not match scene timeline: "
                  f"expected={expected:.3f}s "
                  f"video={video:.3f}s"
              )

          if audio < expected - 0.20:

              raise SystemExit(
                  "Narration audio is materially "
                  "shorter than visual timeline: "
                  f"expected={expected:.3f}s "
                  f"audio={audio:.3f}s"
              )

          print(
              "Timeline verified: "
              f"expected={expected:.3f}s "
              f"video={video:.3f}s "
              f"audio={audio:.3f}s"
          )

          PY

          echo ""
          echo "======================================"
          echo "FINAL VERIFICATION: SUCCESS"
          echo "======================================"
          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "Audio      : ${AUDIO_CODEC}"
          echo "Video      : ${VIDEO_DURATION}s"
          echo "Audio      : ${AUDIO_DURATION}s"
          echo "Timeline   : ${EXPECTED_DURATION}s"
          echo "Status     : PASSED"
          echo "======================================"


      # ============================================================
      # 8. PACKAGE ARTIFACT
      # ============================================================
      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp \
            "$ROOT/aicap_final.mp4" \
            artifact/aicap_final.mp4

          cp \
            "$ROOT/scene_config.json" \
            artifact/scene_config.json

          cp \
            "$ROOT/narration.mp3" \
            artifact/narration.mp3

          find "$ROOT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.png" \
            \) \
            -exec cp {} artifact/ \;

          echo "Artifact package prepared."


      # ============================================================
      # 9. UPLOAD FINAL GITHUB ARTIFACT
      # ============================================================
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
