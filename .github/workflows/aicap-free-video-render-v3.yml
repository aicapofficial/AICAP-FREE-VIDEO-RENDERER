name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Prepare FFmpeg
        shell: bash
        run: |
          set -e
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -e
          ROOT="aicap-render-jobs/${JOB_ID}"
          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -f "$ROOT/narration.mp3"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          python3 - "$CFG" "$ROOT" <<'PY'
          import json, sys, os

          cfg_path, root = sys.argv[1], sys.argv[2]
          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg.get("scenes")
          if not isinstance(scenes, list) or not scenes:
              raise SystemExit("scene_config.json contains no scenes")

          # Validate the audio-driven timeline.
          prev_end = 0.0
          for i, s in enumerate(scenes, 1):
              start = float(s["start"])
              end = float(s["end"])
              if end <= start:
                  raise SystemExit(f"Invalid scene {i}: end <= start")
              if abs(start - prev_end) > 0.001:
                  raise SystemExit(
                      f"Timeline gap/overlap before scene {i}: "
                      f"{start} != {prev_end}"
                  )
              prev_end = end

          for i, s in enumerate(scenes, 1):
              fid = s.get("fileId") or s.get("imageFileId")
              filename = s.get("filename") or f"scene_{i:02d}.jpg"
              path = os.path.join(root, filename)
              if not os.path.isfile(path):
                  raise SystemExit(f"Missing scene image: {path}")

          print(f"Validated {len(scenes)} audio-driven scenes")
          print(f"Timeline duration: {prev_end:.3f}s")
          PY

          python3 - "$CFG" "$ROOT" > /tmp/render.sh <<'PY'
          import json, sys, os, shlex

          cfg_path, root = sys.argv[1], sys.argv[2]
          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]
          fps = int(cfg.get("fps", 30))
          width = int(cfg.get("width", 1080))
          height = int(cfg.get("height", 1920))

          def q(x): return shlex.quote(str(x))

          inputs = []
          filters = []
          concat_labels = []

          for i, s in enumerate(scenes):
              filename = s.get("filename") or f"scene_{i+1:02d}.jpg"
              image = os.path.join(root, filename)
              start = float(s["start"])
              end = float(s["end"])
              dur = end - start
              motion = s.get("motion", "")
              if motion not in ("zoom_in", "zoom_out", "pan_left", "pan_right"):
                  motion = ("zoom_in", "zoom_out", "pan_left", "pan_right")[i % 4]

              # Slight continuous motion, but NEVER shorten or advance
              # the scene boundary. Every clip is exactly its audio interval.
              if motion == "zoom_in":
                  vf = (
                      f"scale={width*2}:{height*2}:force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan=z='min(zoom+0.0007,1.12)':"
                      f"x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':"
                      f"d=1:s={width}x{height}:fps={fps}"
                  )
              elif motion == "zoom_out":
                  vf = (
                      f"scale={width*2}:{height*2}:force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan=z='if(lte(on,1),1.12,max(1.0,zoom-0.0007))':"
                      f"x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':"
                      f"d=1:s={width}x{height}:fps={fps}"
                  )
              elif motion == "pan_left":
                  vf = (
                      f"scale={width*2}:{height*2}:force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan=z='1.08':"
                      f"x='(iw-iw/zoom)*min(on/(max(1,{dur*fps:.6f})),1)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:s={width}x{height}:fps={fps}"
                  )
              else:
                  vf = (
                      f"scale={width*2}:{height*2}:force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan=z='1.08':"
                      f"x='(iw-iw/zoom)*(1-min(on/(max(1,{dur*fps:.6f})),1))':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:s={width}x{height}:fps={fps}"
                  )

              inputs += ["-loop", "1", "-t", f"{dur:.6f}", "-i", image]
              filters.append(
                  f"[{i}:v]{vf},trim=duration={dur:.6f},"
                  f"setpts=PTS-STARTPTS[v{i}]"
              )
              concat_labels.append(f"[v{i}]")

          filters.append(
              "".join(concat_labels) +
              f"concat=n={len(scenes)}:v=1:a=0,"
              f"trim=duration={float(scenes[-1]['end']):.6f},"
              f"setpts=PTS-STARTPTS[v]"
          )

          cmd = ["ffmpeg", "-y"] + inputs
          cmd += [
              "-i", os.path.join(root, "narration.mp3"),
              "-filter_complex", ";".join(filters),
              "-map", "[v]", "-map", f"{len(scenes)}:a",
              "-c:v", "libx264", "-preset", "medium", "-crf", "20",
              "-pix_fmt", "yuv420p", "-r", str(fps),
              "-c:a", "aac", "-b:a", "192k",
              "-shortest", "-movflags", "+faststart", OUT
          ]

          print(" ".join(q(x) for x in cmd))
          PY

          chmod +x /tmp/render.sh
          /tmp/render.sh | bash

          test -f "$OUT"

      - name: Verify output
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail
          OUT="$ROOT/aicap_final.mp4"

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=width,height,r_frame_rate \
            -of default=noprint_wrappers=1 "$OUT"

          ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 "$OUT"

          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")" = "1920"

      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -e
          mkdir -p artifact
          cp "$ROOT/aicap_final.mp4" artifact/aicap_final.mp4
          cp "$ROOT/scene_config.json" artifact/scene_config.json
          cp "$ROOT/narration.mp3" artifact/narration.mp3
          cp -R "$ROOT"/*.jpg artifact/ 2>/dev/null || true

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
