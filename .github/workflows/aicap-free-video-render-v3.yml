name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          command -v ffmpeg
          command -v ffprobe
          FONT="/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          test -f "$FONT"
          echo "Using subtitle font: $FONT"

      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail
          ROOT="aicap-render-jobs/${JOB_ID}"
          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -s "$ROOT/narration.mp3"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Validate render package
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail
          CFG="$ROOT/scene_config.json"

          # CRITICAL FIX:
          # scene_config.json is JSON DATA. Never execute it as Python.
          # The Python program is supplied through stdin and JSON is passed
          # only as an argument to json.load(). Therefore JSON booleans such
          # as true/false are handled correctly.
          python3 - "$CFG" "$ROOT" <<'PY'
          import json
          import os
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]

          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          if not isinstance(cfg, dict):
              raise SystemExit("scene_config.json root must be an object")

          scenes = cfg.get("scenes")
          if not isinstance(scenes, list) or not scenes:
              raise SystemExit("scene_config.json contains no scenes")

          fps = int(cfg.get("fps", 30))
          width = int(cfg.get("width", 1080))
          height = int(cfg.get("height", 1920))

          if fps <= 0 or width <= 0 or height <= 0:
              raise SystemExit("Invalid render configuration")

          prev_end = 0.0
          allowed = {"zoom_in", "zoom_out", "pan_left", "pan_right"}

          for i, scene in enumerate(scenes, 1):
              if not isinstance(scene, dict):
                  raise SystemExit(f"Scene {i} is not an object")

              try:
                  start = float(scene["start"])
                  end = float(scene["end"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(f"Invalid timing in scene {i}: {exc}")

              if start < 0 or end <= start:
                  raise SystemExit(f"Invalid timing in scene {i}")

              if abs(start - prev_end) > 0.001:
                  raise SystemExit(
                      f"Timeline gap/overlap before scene {i}: "
                      f"{start} != {prev_end}"
                  )

              filename = scene.get("filename") or f"scene_{i:02d}.jpg"
              image = os.path.join(root, filename)
              if not os.path.isfile(image):
                  raise SystemExit(f"Missing scene image: {image}")

              motion = scene.get("motion", "")
              if motion and motion not in allowed:
                  print(f"WARNING: unsupported motion in scene {i}; fallback used")

              subtitle = scene.get("subtitle") or {}
              if subtitle.get("enabled"):
                  text = str(subtitle.get("text", "")).strip()
                  if not text:
                      raise SystemExit(
                          f"Scene {i} subtitles enabled but text is empty"
                      )

              prev_end = end

          if not os.path.isfile(os.path.join(root, "narration.mp3")):
              raise SystemExit("Missing narration.mp3")

          print(f"Validated scenes : {len(scenes)}")
          print(f"Resolution       : {width}x{height}")
          print(f"FPS              : {fps}")
          print(f"Timeline duration: {prev_end:.3f}s")
          print("JSON validation  : SUCCESS")
          PY

      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          # CRITICAL FIX:
          # Again, JSON is passed as DATA. It is never invoked as a Python file.
          python3 - "$CFG" "$ROOT" "$AUDIO" "$OUT" > /tmp/aicap_render.sh <<'PY'
          import json
          import os
          import shlex
          import sys

          cfg_path, root, audio, out = sys.argv[1:5]

          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]
          fps = int(cfg.get("fps", 30))
          width = int(cfg.get("width", 1080))
          height = int(cfg.get("height", 1920))

          def q(value):
              return shlex.quote(str(value))

          inputs = []
          filters = []
          labels = []
          font = "/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"
          motions = ("zoom_in", "zoom_out", "pan_left", "pan_right")

          for i, scene in enumerate(scenes):
              filename = scene.get("filename") or f"scene_{i+1:02d}.jpg"
              image = os.path.join(root, filename)
              dur = float(scene["end"]) - float(scene["start"])
              motion = scene.get("motion", "")
              if motion not in motions:
                  motion = motions[i % 4]

              inputs += ["-loop", "1", "-framerate", str(fps), "-t", f"{dur:.6f}", "-i", image]
              frames = max(1, int(round(dur * fps)))

              if motion == "zoom_in":
                  vf = (f"scale={width*2}:{height*2}:force_original_aspect_ratio=increase,"
                        f"crop={width*2}:{height*2},"
                        f"zoompan=z='min(zoom+0.0007,1.12)':x='iw/2-(iw/zoom/2)':"
                        f"y='ih/2-(ih/zoom/2)':d=1:s={width}x{height}:fps={fps}")
              elif motion == "zoom_out":
                  vf = (f"scale={width*2}:{height*2}:force_original_aspect_ratio=increase,"
                        f"crop={width*2}:{height*2},"
                        f"zoompan=z='if(lte(on,1),1.12,max(1.0,zoom-0.0007))':"
                        f"x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':"
                        f"d=1:s={width}x{height}:fps={fps}")
              elif motion == "pan_left":
                  vf = (f"scale={width*2}:{height*2}:force_original_aspect_ratio=increase,"
                        f"crop={width*2}:{height*2},"
                        f"zoompan=z='1.08':x='(iw-iw/zoom)*min(on/max(1,{frames}),1)':"
                        f"y='ih/2-(ih/zoom/2)':d=1:s={width}x{height}:fps={fps}")
              else:
                  vf = (f"scale={width*2}:{height*2}:force_original_aspect_ratio=increase,"
                        f"crop={width*2}:{height*2},"
                        f"zoompan=z='1.08':x='(iw-iw/zoom)*(1-min(on/max(1,{frames}),1))':"
                        f"y='ih/2-(ih/zoom/2)':d=1:s={width}x{height}:fps={fps}")

              subtitle = scene.get("subtitle") or {}
              if subtitle.get("enabled"):
                  text = str(subtitle.get("text", "")).replace("\r\n", "\n").replace("\r", "\n").strip()
                  caption = f"/tmp/aicap_caption_{i+1:02d}.txt"
                  with open(caption, "w", encoding="utf-8") as f:
                      f.write(text)

                  style = subtitle.get("style") or {}
                  size = int(style.get("size", 80))
                  outline = int(style.get("outline", 5))
                  shadow = int(style.get("shadow", 3))
                  margin = int(style.get("margin", 90))
                  bottom = max(100, margin + 30)

                  vf += (
                      f",drawtext=fontfile={q(font)}:textfile={q(caption)}:"
                      f"fontcolor=white:fontsize={size}:x='(w-text_w)/2':"
                      f"y='h-text_h-{bottom}':line_spacing=10:"
                      f"borderw={outline}:bordercolor=black@0.85:"
                      f"shadowx={shadow}:shadowy={shadow}:shadowcolor=black@0.80:fix_bounds=1"
                  )

              fade = min(0.5, max(0.05, dur / 4.0))
              vf += f",fade=t=in:st=0:d={fade:.6f},fade=t=out:st={max(0,dur-fade):.6f}:d={fade:.6f}"

              filters.append(
                  f"[{i}:v]{vf},trim=duration={dur:.6f},setpts=PTS-STARTPTS[v{i}]"
              )
              labels.append(f"[v{i}]")

          total = float(scenes[-1]["end"])
          audio_index = len(scenes)

          filters.append(
              "".join(labels)
              + f"concat=n={len(scenes)}:v=1:a=0,trim=duration={total:.6f},setpts=PTS-STARTPTS[v]"
          )

          cmd = ["ffmpeg", "-y", "-hide_banner", "-loglevel", "error"] + inputs
          cmd += [
              "-i", audio,
              "-filter_complex", ";".join(filters),
              "-map", "[v]",
              "-map", f"{audio_index}:a",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "20",
              "-pix_fmt", "yuv420p",
              "-r", str(fps),
              "-c:a", "aac",
              "-b:a", "192k",
              "-t", f"{total:.6f}",
              "-af", "aresample=async=1:first_pts=0",
              "-movflags", "+faststart",
              out,
          ]

          print(" ".join(q(x) for x in cmd))
          PY

          chmod +x /tmp/aicap_render.sh
          /tmp/aicap_render.sh | bash
          test -s "$OUT"
          echo "Render completed: $OUT"

      - name: Verify output
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail
          OUT="$ROOT/aicap_final.mp4"
          test -s "$OUT"

          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,duration \
            -of default=noprint_wrappers=1 "$OUT"

          ffprobe -v error -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 "$OUT"

          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUT")"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUT")"
          AUDIO_CODEC="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$OUT")"
          VIDEO_DURATION="$(ffprobe -v error -select_streams v:0 -show_entries stream=duration -of csv=p=0 "$OUT")"
          AUDIO_DURATION="$(ffprobe -v error -select_streams a:0 -show_entries stream=duration -of csv=p=0 "$OUT")"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$AUDIO_CODEC" = "aac"

          python3 - "$VIDEO_DURATION" "$AUDIO_DURATION" <<'PY'
          import sys
          video = float(sys.argv[1])
          audio = float(sys.argv[2])
          if video < audio - 0.20:
              raise SystemExit(
                  f"Rendered video is shorter than audio: video={video:.3f}s audio={audio:.3f}s"
              )
          print(f"Duration verified: video={video:.3f}s audio={audio:.3f}s")
          PY

          echo "FINAL VERIFICATION: SUCCESS"

      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp "$ROOT/aicap_final.mp4" artifact/aicap_final.mp4
          cp "$ROOT/scene_config.json" artifact/scene_config.json
          cp "$ROOT/narration.mp3" artifact/narration.mp3
          find "$ROOT" -maxdepth 1 -type f \
            \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" \) \
            -exec cp {} artifact/ \;

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
