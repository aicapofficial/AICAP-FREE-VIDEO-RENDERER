name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout renderer
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL FFMPEG + SUBTITLE FONT
      # ============================================================
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-liberation

          command -v ffmpeg
          command -v ffprobe

          FONT="/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"

          test -f "$FONT"

          echo "FFmpeg : AVAILABLE"
          echo "ffprobe: AVAILABLE"
          echo "Using subtitle font: $FONT"


      # ============================================================
      # 3. LOCATE AICAP RENDER JOB
      # ============================================================
      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          if [ -z "${JOB_ID:-}" ]; then
            echo "ERROR: job_id input is empty"
            exit 1
          fi

          ROOT="aicap-render-jobs/${JOB_ID}"

          echo "Render root: $ROOT"

          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -s "$ROOT/narration.mp3"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo "Render job located successfully."


      # ============================================================
      # 4. VALIDATE JSON RENDER PACKAGE
      #
      # IMPORTANT:
      # scene_config.json is DATA.
      #
      # It is NEVER executed as Python.
      #
      # Python itself is supplied through stdin using <<'PY'.
      # The JSON path is supplied as an argument.
      #
      # Therefore:
      #
      #     true / false
      #
      # remain valid JSON booleans.
      # ============================================================
      - name: Validate render package
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"

          echo "======================================"
          echo "AICAP JSON PACKAGE VALIDATION"
          echo "======================================"

          python3 - "$CFG" "$ROOT" <<'PY'
          import json
          import os
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]

          print("Reading JSON:", cfg_path)

          # --------------------------------------------------------
          # CRITICAL:
          # Read JSON as DATA.
          # NEVER execute scene_config.json as Python.
          # --------------------------------------------------------
          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          if not isinstance(cfg, dict):
              raise SystemExit(
                  "scene_config.json root must be a JSON object"
              )

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          fps = int(cfg.get("fps", 30))
          width = int(cfg.get("width", 1080))
          height = int(cfg.get("height", 1920))

          if fps <= 0:
              raise SystemExit("Invalid FPS")

          if width <= 0 or height <= 0:
              raise SystemExit("Invalid output dimensions")

          print("Resolution:", f"{width}x{height}")
          print("FPS:", fps)
          print("Scene count:", len(scenes))

          prev_end = 0.0

          allowed_motion = {
              "zoom_in",
              "zoom_out",
              "pan_left",
              "pan_right"
          }

          for i, scene in enumerate(scenes, 1):

              if not isinstance(scene, dict):
                  raise SystemExit(
                      f"Scene {i} is not a JSON object"
                  )

              try:
                  start = float(scene["start"])
                  end = float(scene["end"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"Invalid timing in scene {i}: {exc}"
                  )

              if start < 0:
                  raise SystemExit(
                      f"Invalid scene {i}: start < 0"
                  )

              if end <= start:
                  raise SystemExit(
                      f"Invalid scene {i}: end <= start"
                  )

              if abs(start - prev_end) > 0.001:
                  raise SystemExit(
                      f"Timeline gap/overlap before scene {i}: "
                      f"{start} != {prev_end}"
                  )

              filename = (
                  scene.get("filename")
                  or f"scene_{i:02d}.jpg"
              )

              image_path = os.path.join(
                  root,
                  filename
              )

              if not os.path.isfile(image_path):
                  raise SystemExit(
                      f"Missing scene image: {image_path}"
                  )

              motion = scene.get("motion", "")

              if motion and motion not in allowed_motion:
                  print(
                      f"WARNING: unsupported motion in scene {i}; "
                      f"renderer fallback will be used"
                  )

              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):
                  text = str(
                      subtitle.get("text", "")
                  ).strip()

                  if not text:
                      raise SystemExit(
                          f"Scene {i} subtitles enabled "
                          f"but subtitle text is empty"
                      )

              print(
                  f"Scene {i}: "
                  f"{start:.3f} -> {end:.3f} "
                  f"({end - start:.3f}s) "
                  f"motion={motion or 'fallback'}"
              )

              prev_end = end

          narration = os.path.join(
              root,
              "narration.mp3"
          )

          if not os.path.isfile(narration):
              raise SystemExit(
                  "Missing narration.mp3"
              )

          print("======================================")
          print("JSON validation : SUCCESS")
          print("Scenes          :", len(scenes))
          print("Resolution      :", f"{width}x{height}")
          print("FPS             :", fps)
          print("Timeline        :", f"{prev_end:.3f}s")
          print("Narration       : AVAILABLE")
          print("======================================")
          PY


      # ============================================================
      # 5. GENERATE FFMPEG COMMAND
      #
      # JSON is again read as DATA.
      # It is NOT passed as the Python program.
      # ============================================================
      - name: Generate FFmpeg render command
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          echo "======================================"
          echo "AICAP FFMPEG COMMAND GENERATION"
          echo "======================================"

          python3 - "$CFG" "$ROOT" "$AUDIO" "$OUT" > /tmp/aicap_render.sh <<'PY'
          import json
          import os
          import shlex
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]
          audio = sys.argv[3]
          out = sys.argv[4]

          # --------------------------------------------------------
          # CRITICAL FIX:
          # JSON is read as DATA.
          # --------------------------------------------------------
          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]

          fps = int(
              cfg.get("fps", 30)
          )

          width = int(
              cfg.get("width", 1080)
          )

          height = int(
              cfg.get("height", 1920)
          )

          if fps <= 0:
              raise SystemExit(
                  "Invalid FPS"
              )

          if width <= 0 or height <= 0:
              raise SystemExit(
                  "Invalid output dimensions"
              )

          def q(value):
              return shlex.quote(
                  str(value)
              )

          inputs = []
          filters = []
          labels = []

          caption_font = (
              "/usr/share/fonts/truetype/"
              "liberation2/"
              "LiberationSans-Bold.ttf"
          )

          motions = (
              "zoom_in",
              "zoom_out",
              "pan_left",
              "pan_right"
          )

          for i, scene in enumerate(scenes):

              filename = (
                  scene.get("filename")
                  or f"scene_{i + 1:02d}.jpg"
              )

              image = os.path.join(
                  root,
                  filename
              )

              start = float(
                  scene["start"]
              )

              end = float(
                  scene["end"]
              )

              dur = end - start

              if dur <= 0:
                  raise SystemExit(
                      f"Invalid duration "
                      f"for scene {i + 1}: {dur}"
                  )

              motion = scene.get(
                  "motion",
                  ""
              )

              if motion not in motions:
                  motion = motions[
                      i % len(motions)
                  ]

              frames = max(
                  1,
                  int(round(dur * fps))
              )

              # ----------------------------------------------------
              # MOTION: ZOOM IN
              # ----------------------------------------------------
              if motion == "zoom_in":

                  vf = (
                      f"scale={width*2}:{height*2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='min(zoom+0.0007,1.12)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # MOTION: ZOOM OUT
              # ----------------------------------------------------
              elif motion == "zoom_out":

                  vf = (
                      f"scale={width*2}:{height*2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='if(lte(on,1),1.12,"
                      f"max(1.0,zoom-0.0007))':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # MOTION: PAN LEFT
              # ----------------------------------------------------
              elif motion == "pan_left":

                  vf = (
                      f"scale={width*2}:{height*2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*"
                      f"min(on/max(1,{frames}),1)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # MOTION: PAN RIGHT
              # ----------------------------------------------------
              else:

                  vf = (
                      f"scale={width*2}:{height*2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*"
                      f"(1-min(on/max(1,{frames}),1))':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # SUBTITLES
              # ----------------------------------------------------
              subtitle = (
                  scene.get("subtitle")
                  or {}
              )

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get(
                          "text",
                          ""
                      )
                  )

                  text = (
                      text
                      .replace("\r\n", "\n")
                      .replace("\r", "\n")
                      .strip()
                  )

                  caption_file = (
                      f"/tmp/aicap_caption_"
                      f"{i + 1:02d}.txt"
                  )

                  with open(
                      caption_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(text)

                  style = (
                      subtitle.get("style")
                      or {}
                  )

                  fontsize = int(
                      style.get(
                          "size",
                          80
                      )
                  )

                  outline = int(
                      style.get(
                          "outline",
                          5
                      )
                  )

                  shadow = int(
                      style.get(
                          "shadow",
                          3
                      )
                  )

                  margin = int(
                      style.get(
                          "margin",
                          90
                      )
                  )

                  bottom_margin = max(
                      100,
                      margin + 30
                  )

                  drawtext = (
                      "drawtext="
                      f"fontfile={q(caption_font)}:"
                      f"textfile={q(caption_file)}:"
                      "fontcolor=white:"
                      f"fontsize={fontsize}:"
                      "x='(w-text_w)/2':"
                      f"y='h-text_h-{bottom_margin}':"
                      "line_spacing=10:"
                      f"borderw={outline}:"
                      "bordercolor=black@0.85:"
                      f"shadowx={shadow}:"
                      f"shadowy={shadow}:"
                      "shadowcolor=black@0.80:"
                      "fix_bounds=1"
                  )

                  vf += "," + drawtext

              # ----------------------------------------------------
              # FADE TRANSITIONS
              # ----------------------------------------------------
              fade = min(
                  0.5,
                  max(
                      0.05,
                      dur / 4.0
                  )
              )

              vf += (
                  f",fade=t=in:"
                  f"st=0:"
                  f"d={fade:.6f},"
                  f"fade=t=out:"
                  f"st={max(0, dur-fade):.6f}:"
                  f"d={fade:.6f}"
              )

              # ----------------------------------------------------
              # SCENE INPUT
              # ----------------------------------------------------
              inputs += [
                  "-loop",
                  "1",
                  "-framerate",
                  str(fps),
                  "-t",
                  f"{dur:.6f}",
                  "-i",
                  image
              ]

              filters.append(
                  f"[{i}:v]"
                  f"{vf},"
                  f"trim=duration={dur:.6f},"
                  f"setpts=PTS-STARTPTS"
                  f"[v{i}]"
              )

              labels.append(
                  f"[v{i}]"
              )

          # --------------------------------------------------------
          # CONCATENATE ALL VIDEO SCENES
          # --------------------------------------------------------
          total = float(
              scenes[-1]["end"]
          )

          audio_index = len(
              scenes
          )

          filters.append(
              "".join(labels)
              +
              f"concat=n={len(scenes)}:"
              f"v=1:a=0,"
              f"trim=duration={total:.6f},"
              f"setpts=PTS-STARTPTS"
              f"[v]"
          )

          # --------------------------------------------------------
          # FFMPEG COMMAND
          # --------------------------------------------------------
          cmd = [
              "ffmpeg",
              "-y",
              "-hide_banner",
              "-loglevel",
              "error"
          ]

          cmd += inputs

          cmd += [
              "-i",
              audio,

              "-filter_complex",
              ";".join(filters),

              "-map",
              "[v]",

              "-map",
              f"{audio_index}:a",

              "-c:v",
              "libx264",

              "-preset",
              "medium",

              "-crf",
              "20",

              "-pix_fmt",
              "yuv420p",

              "-r",
              str(fps),

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-t",
              f"{total:.6f}",

              "-af",
              "aresample=async=1:first_pts=0",

              "-movflags",
              "+faststart",

              out
          ]

          print(
              " ".join(
                  q(x)
                  for x in cmd
              )
          )
          PY

          chmod +x /tmp/aicap_render.sh

          echo "FFmpeg command generated successfully."


      # ============================================================
      # 6. RUN REAL FFMPEG RENDER
      # ============================================================
      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"

          echo "======================================"
          echo "AICAP REAL FFMPEG RENDER"
          echo "======================================"

          /tmp/aicap_render.sh | bash

          test -s "$OUT"

          echo ""
          echo "======================================"
          echo "FFMPEG RENDER : PASSED"
          echo "OUTPUT        : $OUT"
          echo "======================================"


      # ============================================================
      # 7. VERIFY FINAL MP4
      # ============================================================
      - name: Verify output
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"
          CFG="$ROOT/scene_config.json"

          test -s "$OUT"

          echo "======================================"
          echo "AICAP FINAL OUTPUT VERIFICATION"
          echo "======================================"

          echo ""
          echo "===== VIDEO STREAM ====="

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries \
              stream=codec_name,width,height,r_frame_rate,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          echo ""
          echo "===== AUDIO STREAM ====="

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries \
              stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          WIDTH="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$OUT"
          )"

          HEIGHT="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          EXPECTED_DURATION="$(
            python3 - "$CFG" <<'PY'
          import json
          import sys

          cfg_path = sys.argv[1]

          # JSON is DATA, not Python source.
          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]

          print(
              f"{float(scenes[-1]['end']):.6f}"
          )
          PY
          )"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$VIDEO_CODEC" = "h264"
          test "$AUDIO_CODEC" = "aac"

          python3 \
            "$VIDEO_DURATION" \
            "$AUDIO_DURATION" \
            "$EXPECTED_DURATION" <<'PY'
          import sys

          video = float(sys.argv[1])
          audio = float(sys.argv[2])
          expected = float(sys.argv[3])

          # --------------------------------------------------------
          # Video must match the Module 19 audio-driven timeline.
          # Small FFmpeg/container tolerance is allowed.
          # --------------------------------------------------------
          if abs(video - expected) > 0.20:
              raise SystemExit(
                  "Rendered video duration does not match "
                  "scene timeline: "
                  f"expected={expected:.3f}s "
                  f"video={video:.3f}s"
              )

          # Narration must not materially end before the timeline.
          if audio < expected - 0.20:
              raise SystemExit(
                  "Narration audio is materially shorter "
                  "than the visual timeline: "
                  f"expected={expected:.3f}s "
                  f"audio={audio:.3f}s"
              )

          print(
              "Timeline verified: "
              f"expected={expected:.3f}s "
              f"video={video:.3f}s "
              f"audio={audio:.3f}s"
          )
          PY

          echo ""
          echo "======================================"
          echo "AICAP FINAL OUTPUT VERIFICATION"
          echo "======================================"
          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "Video      : ${VIDEO_CODEC}"
          echo "Audio      : ${AUDIO_CODEC}"
          echo "Video Time : ${VIDEO_DURATION}s"
          echo "Audio Time : ${AUDIO_DURATION}s"
          echo "Expected   : ${EXPECTED_DURATION}s"
          echo "Status     : PASSED"
          echo "======================================"


      # ============================================================
      # 8. PACKAGE FINAL ARTIFACT
      # ============================================================
      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp \
            "$ROOT/aicap_final.mp4" \
            artifact/aicap_final.mp4

          cp \
            "$ROOT/scene_config.json" \
            artifact/scene_config.json

          cp \
            "$ROOT/narration.mp3" \
            artifact/narration.mp3

          find "$ROOT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.png" \
            \) \
            -exec cp {} artifact/ \;

          echo "Artifact package prepared."


      # ============================================================
      # 9. UPLOAD FINAL GITHUB ARTIFACT
      # ============================================================
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
