name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout renderer
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL FFMPEG + SUBTITLE FONT
      #
      # IMPORTANT:
      # Do NOT assume a fixed Linux font path.
      # Resolve the real installed font dynamically.
      # ============================================================
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "AICAP RENDERER ENVIRONMENT"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-liberation \
            fontconfig

          echo ""
          echo "FFmpeg:"
          command -v ffmpeg
          ffmpeg -version | head -n 1

          echo ""
          echo "FFprobe:"
          command -v ffprobe
          ffprobe -version | head -n 1

          echo ""
          echo "Fontconfig:"
          command -v fc-match
          fc-match --version | head -n 1

          echo ""
          echo "Resolving subtitle font..."

          CAPTION_FONT="$(fc-match -f '%{file}\n' 'Liberation Sans:style=Bold' | head -n 1)"

          if [ -z "$CAPTION_FONT" ]; then
            echo "ERROR: Unable to resolve Liberation Sans Bold font."
            exit 1
          fi

          if [ ! -f "$CAPTION_FONT" ]; then
            echo "ERROR: Resolved font does not exist:"
            echo "$CAPTION_FONT"
            exit 1
          fi

          echo "Resolved subtitle font:"
          echo "$CAPTION_FONT"

          echo "CAPTION_FONT=$CAPTION_FONT" >> "$GITHUB_ENV"

          echo ""
          echo "Subtitle font verification: PASSED"
          echo "======================================"


      # ============================================================
      # 3. LOCATE RENDER JOB
      # ============================================================
      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          ROOT="aicap-render-jobs/${JOB_ID}"

          echo "Render root:"
          echo "$ROOT"

          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -f "$ROOT/narration.mp3"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Render job input validation: PASSED"


      # ============================================================
      # 4. VALIDATE SCENE CONFIGURATION
      # ============================================================
      - name: Validate render inputs
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"

          python3 - "$CFG" "$ROOT" <<'PY'
          import json
          import os
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]

          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          prev_end = 0.0

          for i, scene in enumerate(scenes, 1):

              try:
                  start = float(scene["start"])
                  end = float(scene["end"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"Invalid timing in scene {i}: {exc}"
                  )

              if start < 0:
                  raise SystemExit(
                      f"Invalid scene {i}: start < 0"
                  )

              if end <= start:
                  raise SystemExit(
                      f"Invalid scene {i}: end <= start"
                  )

              if abs(start - prev_end) > 0.001:
                  raise SystemExit(
                      f"Timeline gap/overlap before scene {i}: "
                      f"{start} != {prev_end}"
                  )

              filename = (
                  scene.get("filename")
                  or f"scene_{i:02d}.jpg"
              )

              image_path = os.path.join(
                  root,
                  filename
              )

              if not os.path.isfile(image_path):
                  raise SystemExit(
                      f"Missing scene image: {image_path}"
                  )

              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):
                  subtitle_text = str(
                      subtitle.get("text", "")
                  ).strip()

                  if not subtitle_text:
                      raise SystemExit(
                          f"Scene {i} has subtitles enabled "
                          f"but no subtitle text"
                      )

              prev_end = end

          narration = os.path.join(
              root,
              "narration.mp3"
          )

          if not os.path.isfile(narration):
              raise SystemExit(
                  "Missing narration.mp3"
              )

          print(
              f"Validated {len(scenes)} audio-driven scenes"
          )

          print(
              f"Timeline duration: {prev_end:.3f}s"
          )

          print(
              "Subtitle metadata: VERIFIED"
          )
          PY


      # ============================================================
      # 5. RENDER VIDEO
      #
      # The only renderer-side change relevant to this fix:
      # CAPTION_FONT comes from the dynamically resolved
      # GitHub runner font path.
      # ============================================================
      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
          CAPTION_FONT: ${{ env.CAPTION_FONT }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          if [ -z "${CAPTION_FONT:-}" ]; then
            echo "ERROR: CAPTION_FONT is not set."
            exit 1
          fi

          if [ ! -f "$CAPTION_FONT" ]; then
            echo "ERROR: CAPTION_FONT does not exist:"
            echo "$CAPTION_FONT"
            exit 1
          fi

          echo "Using subtitle font:"
          echo "$CAPTION_FONT"

          python3 \
            "$CFG" \
            "$ROOT" \
            "$AUDIO" \
            "$OUT" \
            "$CAPTION_FONT" \
            > /tmp/render.sh <<'PY'

          import json
          import os
          import shlex
          import sys

          cfg_path, root, audio, out, caption_font = sys.argv[1:6]

          with open(
              cfg_path,
              "r",
              encoding="utf-8"
          ) as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]

          fps = int(
              cfg.get("fps", 30)
          )

          width = int(
              cfg.get("width", 1080)
          )

          height = int(
              cfg.get("height", 1920)
          )

          if fps <= 0:
              raise SystemExit(
                  "Invalid FPS"
              )

          if width <= 0 or height <= 0:
              raise SystemExit(
                  "Invalid output dimensions"
              )

          if not os.path.isfile(caption_font):
              raise SystemExit(
                  "Subtitle font file does not exist: "
                  + caption_font
              )

          def q(value):
              return shlex.quote(
                  str(value)
              )

          inputs = []
          filters = []
          concat_labels = []

          # --------------------------------------------------------
          # SCENE RENDERING
          # --------------------------------------------------------

          for i, scene in enumerate(scenes):

              filename = (
                  scene.get("filename")
                  or f"scene_{i + 1:02d}.jpg"
              )

              image = os.path.join(
                  root,
                  filename
              )

              start = float(
                  scene["start"]
              )

              end = float(
                  scene["end"]
              )

              dur = end - start

              if dur <= 0:
                  raise SystemExit(
                      f"Invalid duration for scene "
                      f"{i + 1}: {dur}"
                  )

              motion = scene.get(
                  "motion",
                  ""
              )

              if motion not in (
                  "zoom_in",
                  "zoom_out",
                  "pan_left",
                  "pan_right",
              ):
                  motion = (
                      "zoom_in",
                      "zoom_out",
                      "pan_left",
                      "pan_right",
                  )[i % 4]

              frames = max(
                  1,
                  int(
                      round(
                          dur * fps
                      )
                  )
              )

              inputs += [
                  "-loop",
                  "1",
                  "-framerate",
                  str(fps),
                  "-t",
                  f"{dur:.6f}",
                  "-i",
                  image,
              ]

              # ----------------------------------------------------
              # ZOOM IN
              # ----------------------------------------------------
              if motion == "zoom_in":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='min(zoom+0.0007,1.12)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # ZOOM OUT
              # ----------------------------------------------------
              elif motion == "zoom_out":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='if(eq(on,0),1.12,"
                      f"max(1.0,zoom-0.0007))':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # PAN LEFT
              # ----------------------------------------------------
              elif motion == "pan_left":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*"
                      f"min(on/max(1,{frames}),1)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # PAN RIGHT
              # ----------------------------------------------------
              else:

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*(1-"
                      f"min(on/max(1,{frames}),1))':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # SUBTITLE
              # ----------------------------------------------------

              subtitle = (
                  scene.get("subtitle")
                  or {}
              )

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get(
                          "text",
                          ""
                      )
                  ).replace(
                      "\r\n",
                      "\n"
                  ).replace(
                      "\r",
                      "\n"
                  ).strip()

                  caption_file = (
                      f"/tmp/"
                      f"aicap_caption_"
                      f"{i + 1:02d}.txt"
                  )

                  with open(
                      caption_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(text)

                  style = (
                      subtitle.get("style")
                      or {}
                  )

                  fontsize = int(
                      style.get(
                          "size",
                          80
                      )
                  )

                  outline = int(
                      style.get(
                          "outline",
                          5
                      )
                  )

                  shadow = int(
                      style.get(
                          "shadow",
                          3
                      )
                  )

                  margin = int(
                      style.get(
                          "margin",
                          90
                      )
                  )

                  # Keep captions safely inside the vertical
                  # 1080x1920 frame.
                  bottom_margin = max(
                      100,
                      margin + 30
                  )

                  drawtext = (
                      "drawtext="
                      f"fontfile={q(caption_font)}:"
                      f"textfile={q(caption_file)}:"
                      "fontcolor=white:"
                      f"fontsize={fontsize}:"
                      "x='(w-text_w)/2':"
                      f"y='h-text_h-{bottom_margin}':"
                      "line_spacing=10:"
                      f"borderw={outline}:"
                      "bordercolor=black@0.85:"
                      f"shadowx={shadow}:"
                      f"shadowy={shadow}:"
                      "shadowcolor=black@0.80:"
                      "fix_bounds=1"
                  )

                  vf += "," + drawtext

              filters.append(
                  f"[{i}:v]"
                  f"{vf},"
                  f"trim=duration={dur:.6f},"
                  f"setpts=PTS-STARTPTS"
                  f"[v{i}]"
              )

              concat_labels.append(
                  f"[v{i}]"
              )

          # --------------------------------------------------------
          # CONCATENATE ALL SCENES
          # --------------------------------------------------------

          total_duration = float(
              scenes[-1]["end"]
          )

          audio_input_index = len(
              scenes
          )

          filters.append(
              "".join(
                  concat_labels
              )
              +
              f"concat=n={len(scenes)}:v=1:a=0,"
              +
              f"trim=duration={total_duration:.6f},"
              +
              "setpts=PTS-STARTPTS[v]"
          )

          # --------------------------------------------------------
          # FFMPEG COMMAND
          # --------------------------------------------------------

          cmd = [
              "ffmpeg",
              "-y",
              "-hide_banner",
              "-loglevel",
              "error",
          ]

          cmd += inputs

          cmd += [
              "-i",
              audio,

              "-filter_complex",
              ";".join(filters),

              "-map",
              "[v]",

              "-map",
              f"{audio_input_index}:a",

              "-c:v",
              "libx264",

              "-preset",
              "medium",

              "-crf",
              "20",

              "-pix_fmt",
              "yuv420p",

              "-r",
              str(fps),

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-t",
              f"{total_duration:.6f}",

              "-af",
              "aresample=async=1:first_pts=0",

              "-movflags",
              "+faststart",

              out,
          ]

          print(
              " ".join(
                  q(x)
                  for x in cmd
              )
          )

          PY

          chmod +x /tmp/render.sh

          /tmp/render.sh | bash

          test -s "$OUT"

          echo ""
          echo "======================================"
          echo "FFMPEG RENDER : PASSED"
          echo "======================================"


      # ============================================================
      # 6. VERIFY FINAL MP4
      # ============================================================
      - name: Verify output
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"

          test -s "$OUT"

          echo "======================================"
          echo "VIDEO STREAM"
          echo "======================================"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries \
              stream=codec_name,width,height,r_frame_rate,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          echo ""
          echo "======================================"
          echo "AUDIO STREAM"
          echo "======================================"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries \
              stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          WIDTH="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$OUT"
          )"

          HEIGHT="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$AUDIO_CODEC" = "aac"

          VIDEO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          python3 \
            "$VIDEO_DURATION" \
            "$AUDIO_DURATION" <<'PY'

          import sys

          video = float(
              sys.argv[1]
          )

          audio = float(
              sys.argv[2]
          )

          # Audio-driven renderer.
          # Allow only a small encoder/container tolerance.
          if video < audio - 0.20:
              raise SystemExit(
                  "Rendered video is shorter than audio: "
                  f"video={video:.3f}s "
                  f"audio={audio:.3f}s"
              )

          print(
              f"Duration verified: "
              f"video={video:.3f}s "
              f"audio={audio:.3f}s"
          )

          PY

          echo ""
          echo "======================================"
          echo "AICAP FINAL OUTPUT VERIFICATION"
          echo "======================================"
          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "Audio      : ${AUDIO_CODEC}"
          echo "Video      : ${VIDEO_DURATION}s"
          echo "Audio      : ${AUDIO_DURATION}s"
          echo "Status     : PASSED"
          echo "======================================"


      # ============================================================
      # 7. PACKAGE ARTIFACT
      # ============================================================
      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp \
            "$ROOT/aicap_final.mp4" \
            artifact/aicap_final.mp4

          cp \
            "$ROOT/scene_config.json" \
            artifact/scene_config.json

          cp \
            "$ROOT/narration.mp3" \
            artifact/narration.mp3

          find "$ROOT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.png" \
            \) \
            -exec cp {} artifact/ \;

          echo "Artifact package prepared."


      # ============================================================
      # 8. UPLOAD FINAL ARTIFACT
      # ============================================================
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
