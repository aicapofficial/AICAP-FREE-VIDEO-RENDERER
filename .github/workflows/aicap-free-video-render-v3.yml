name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout renderer
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL FFMPEG + FONTS
      # ============================================================
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-liberation

          command -v ffmpeg
          command -v ffprobe

          FONT="/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"

          test -f "$FONT"

          echo "======================================"
          echo "AICAP RENDER ENVIRONMENT"
          echo "======================================"
          echo "FFmpeg : AVAILABLE"
          echo "ffprobe: AVAILABLE"
          echo "Font   : $FONT"
          echo "======================================"


      # ============================================================
      # 3. LOCATE RENDER JOB
      # ============================================================
      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          ROOT="aicap-render-jobs/${JOB_ID}"

          echo "======================================"
          echo "AICAP RENDER JOB"
          echo "======================================"
          echo "Job ID : ${JOB_ID}"
          echo "Root   : ${ROOT}"
          echo "======================================"

          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -s "$ROOT/narration.mp3"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. VALIDATE RENDER PACKAGE
      #
      # IMPORTANT:
      # scene_config.json is JSON DATA.
      #
      # It MUST NEVER be executed as Python source.
      #
      # Python receives "-" as its program and the JSON filename
      # only as an argument. json.load() handles JSON true/false.
      # ============================================================
      - name: Validate render package
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"

          python3 - "$CFG" "$ROOT" <<'PY'
          import json
          import os
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]

          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          if not isinstance(cfg, dict):
              raise SystemExit(
                  "scene_config.json root must be an object"
              )

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          fps = int(cfg.get("fps", 30))
          width = int(cfg.get("width", 1080))
          height = int(cfg.get("height", 1920))

          if fps <= 0:
              raise SystemExit("Invalid FPS")

          if width <= 0 or height <= 0:
              raise SystemExit(
                  "Invalid output dimensions"
              )

          prev_end = 0.0

          allowed_motions = {
              "zoom_in",
              "zoom_out",
              "pan_left",
              "pan_right"
          }

          for i, scene in enumerate(scenes, 1):

              if not isinstance(scene, dict):
                  raise SystemExit(
                      f"Scene {i} is not an object"
                  )

              try:
                  start = float(scene["start"])
                  end = float(scene["end"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"Invalid timing in scene {i}: {exc}"
                  )

              if start < 0:
                  raise SystemExit(
                      f"Invalid scene {i}: start < 0"
                  )

              if end <= start:
                  raise SystemExit(
                      f"Invalid scene {i}: end <= start"
                  )

              if abs(start - prev_end) > 0.001:
                  raise SystemExit(
                      f"Timeline gap/overlap before scene {i}: "
                      f"{start} != {prev_end}"
                  )

              filename = (
                  scene.get("filename")
                  or f"scene_{i:02d}.jpg"
              )

              image_path = os.path.join(
                  root,
                  filename
              )

              if not os.path.isfile(image_path):
                  raise SystemExit(
                      f"Missing scene image: {image_path}"
                  )

              motion = scene.get("motion", "")

              if motion and motion not in allowed_motions:
                  print(
                      f"WARNING: unsupported motion in scene "
                      f"{i}; renderer fallback will be used"
                  )

              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):
                  text = str(
                      subtitle.get("text", "")
                  ).strip()

                  if not text:
                      raise SystemExit(
                          f"Scene {i} subtitles enabled "
                          f"but subtitle text is empty"
                      )

              prev_end = end

          narration = os.path.join(
              root,
              "narration.mp3"
          )

          if not os.path.isfile(narration):
              raise SystemExit(
                  "Missing narration.mp3"
              )

          print("======================================")
          print("AICAP PACKAGE VALIDATION")
          print("======================================")
          print(f"Scenes           : {len(scenes)}")
          print(f"Resolution       : {width}x{height}")
          print(f"FPS              : {fps}")
          print(f"Timeline duration: {prev_end:.3f}s")
          print("JSON validation  : SUCCESS")
          print("======================================")
          PY


      # ============================================================
      # 5. RENDER VIDEO
      # ============================================================
      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          python3 - "$CFG" "$ROOT" "$AUDIO" "$OUT" > /tmp/aicap_render.sh <<'PY'
          import json
          import os
          import shlex
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]
          audio = sys.argv[3]
          out = sys.argv[4]

          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]

          fps = int(
              cfg.get("fps", 30)
          )

          width = int(
              cfg.get("width", 1080)
          )

          height = int(
              cfg.get("height", 1920)
          )

          def q(value):
              return shlex.quote(
                  str(value)
              )

          inputs = []
          filters = []
          labels = []

          font = (
              "/usr/share/fonts/"
              "truetype/liberation2/"
              "LiberationSans-Bold.ttf"
          )

          motions = (
              "zoom_in",
              "zoom_out",
              "pan_left",
              "pan_right"
          )

          for i, scene in enumerate(
              scenes
          ):

              filename = (
                  scene.get("filename")
                  or f"scene_{i + 1:02d}.jpg"
              )

              image = os.path.join(
                  root,
                  filename
              )

              start = float(
                  scene["start"]
              )

              end = float(
                  scene["end"]
              )

              dur = end - start

              if dur <= 0:
                  raise SystemExit(
                      f"Invalid duration for scene "
                      f"{i + 1}: {dur}"
                  )

              motion = scene.get(
                  "motion",
                  ""
              )

              if motion not in motions:
                  motion = motions[
                      i % 4
                  ]

              inputs += [
                  "-loop",
                  "1",
                  "-framerate",
                  str(fps),
                  "-t",
                  f"{dur:.6f}",
                  "-i",
                  image
              ]

              frames = max(
                  1,
                  int(
                      round(
                          dur * fps
                      )
                  )
              )

              if motion == "zoom_in":

                  vf = (
                      f"scale="
                      f"{width * 2}:"
                      f"{height * 2}:"
                      f"force_original_aspect_ratio="
                      f"increase,"
                      f"crop="
                      f"{width * 2}:"
                      f"{height * 2},"
                      f"zoompan="
                      f"z='min("
                      f"zoom+0.0007,1.12)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "zoom_out":

                  vf = (
                      f"scale="
                      f"{width * 2}:"
                      f"{height * 2}:"
                      f"force_original_aspect_ratio="
                      f"increase,"
                      f"crop="
                      f"{width * 2}:"
                      f"{height * 2},"
                      f"zoompan="
                      f"z='if("
                      f"lte(on,1),"
                      f"1.12,"
                      f"max("
                      f"1.0,"
                      f"zoom-0.0007"
                      f"))':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "pan_left":

                  vf = (
                      f"scale="
                      f"{width * 2}:"
                      f"{height * 2}:"
                      f"force_original_aspect_ratio="
                      f"increase,"
                      f"crop="
                      f"{width * 2}:"
                      f"{height * 2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='("
                      f"iw-iw/zoom"
                      f")*min("
                      f"on/max(1,{frames}),1)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              else:

                  vf = (
                      f"scale="
                      f"{width * 2}:"
                      f"{height * 2}:"
                      f"force_original_aspect_ratio="
                      f"increase,"
                      f"crop="
                      f"{width * 2}:"
                      f"{height * 2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='("
                      f"iw-iw/zoom"
                      f")*(1-min("
                      f"on/max(1,{frames}),1))':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d=1:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              subtitle = (
                  scene.get("subtitle")
                  or {}
              )

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get(
                          "text",
                          ""
                      )
                  ).replace(
                      "\r\n",
                      "\n"
                  ).replace(
                      "\r",
                      "\n"
                  ).strip()

                  caption = (
                      f"/tmp/"
                      f"aicap_caption_"
                      f"{i + 1:02d}.txt"
                  )

                  with open(
                      caption,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(text)

                  style = (
                      subtitle.get(
                          "style"
                      )
                      or {}
                  )

                  size = int(
                      style.get(
                          "size",
                          80
                      )
                  )

                  outline = int(
                      style.get(
                          "outline",
                          5
                      )
                  )

                  shadow = int(
                      style.get(
                          "shadow",
                          3
                      )
                  )

                  margin = int(
                      style.get(
                          "margin",
                          90
                      )
                  )

                  bottom = max(
                      100,
                      margin + 30
                  )

                  vf += (
                      f",drawtext="
                      f"fontfile={q(font)}:"
                      f"textfile={q(caption)}:"
                      f"fontcolor=white:"
                      f"fontsize={size}:"
                      f"x='(w-text_w)/2':"
                      f"y='h-text_h-{bottom}':"
                      f"line_spacing=10:"
                      f"borderw={outline}:"
                      f"bordercolor=black@0.85:"
                      f"shadowx={shadow}:"
                      f"shadowy={shadow}:"
                      f"shadowcolor=black@0.80:"
                      f"fix_bounds=1"
                  )

              fade = min(
                  0.5,
                  max(
                      0.05,
                      dur / 4.0
                  )
              )

              fade_out_start = max(
                  0,
                  dur - fade
              )

              vf += (
                  f",fade=t=in:"
                  f"st=0:"
                  f"d={fade:.6f},"
                  f"fade=t=out:"
                  f"st={fade_out_start:.6f}:"
                  f"d={fade:.6f}"
              )

              filters.append(
                  f"[{i}:v]"
                  f"{vf},"
                  f"trim="
                  f"duration={dur:.6f},"
                  f"setpts=PTS-STARTPTS"
                  f"[v{i}]"
              )

              labels.append(
                  f"[v{i}]"
              )

          total = float(
              scenes[-1]["end"]
          )

          audio_index = len(
              scenes
          )

          filters.append(
              "".join(labels)
              +
              f"concat="
              f"n={len(scenes)}:"
              f"v=1:"
              f"a=0,"
              f"trim="
              f"duration={total:.6f},"
              f"setpts=PTS-STARTPTS"
              f"[v]"
          )

          cmd = [
              "ffmpeg",
              "-y",
              "-hide_banner",
              "-loglevel",
              "error"
          ]

          cmd += inputs

          cmd += [
              "-i",
              audio,

              "-filter_complex",
              ";".join(filters),

              "-map",
              "[v]",

              "-map",
              f"{audio_index}:a",

              "-c:v",
              "libx264",

              "-preset",
              "medium",

              "-crf",
              "20",

              "-pix_fmt",
              "yuv420p",

              "-r",
              str(fps),

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-t",
              f"{total:.6f}",

              "-af",
              "aresample=async=1:first_pts=0",

              "-movflags",
              "+faststart",

              out
          ]

          print(
              " ".join(
                  q(x)
                  for x in cmd
              )
          )
          PY

          chmod +x /tmp/aicap_render.sh

          /tmp/aicap_render.sh | bash

          test -s "$OUT"

          echo "======================================"
          echo "AICAP RENDER COMPLETE"
          echo "======================================"
          echo "Output: $OUT"
          echo "======================================"


      # ============================================================
      # 6. VERIFY FINAL OUTPUT
      #
      # IMPORTANT FIX:
      # NO python3 duration-check command here.
      #
      # The previous failure:
      #
      # python3: can't open file ".../40.033333"
      #
      # occurred because the duration value was being interpreted
      # as Python's script filename.
      #
      # We use awk for numeric comparison instead.
      # ============================================================
      - name: Verify output
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"

          test -s "$OUT"

          echo ""
          echo "======================================"
          echo "AICAP FINAL OUTPUT VERIFICATION"
          echo "======================================"

          echo ""
          echo "===== VIDEO STREAM ====="

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          echo ""
          echo "===== AUDIO STREAM ====="

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          WIDTH="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$OUT"
          )"

          HEIGHT="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          EXPECTED_DURATION="$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"

          test "$VIDEO_CODEC" = "h264"
          test "$AUDIO_CODEC" = "aac"

          test -n "$VIDEO_DURATION"
          test -n "$AUDIO_DURATION"
          test -n "$EXPECTED_DURATION"

          echo ""
          echo "Resolution       : ${WIDTH}x${HEIGHT}"
          echo "Video codec      : ${VIDEO_CODEC}"
          echo "Audio codec      : ${AUDIO_CODEC}"
          echo "Video duration   : ${VIDEO_DURATION}s"
          echo "Audio duration   : ${AUDIO_DURATION}s"
          echo "Container duration: ${EXPECTED_DURATION}s"

          # Audio-driven render:
          # video must not be materially shorter than audio.
          awk \
            -v video="$VIDEO_DURATION" \
            -v audio="$AUDIO_DURATION" \
            'BEGIN {
              if ((video + 0.0) < ((audio + 0.0) - 0.20)) {
                printf "ERROR: rendered video is shorter than audio: video=%.3fs audio=%.3fs\n", video, audio
                exit 1
              }
            }'

          # Container duration must also be close to the video stream.
          awk \
            -v video="$VIDEO_DURATION" \
            -v container="$EXPECTED_DURATION" \
            'BEGIN {
              diff = video - container
              if (diff < 0) diff = -diff

              if (diff > 0.20) {
                printf "ERROR: container/video duration mismatch: video=%.3fs container=%.3fs\n", video, container
                exit 1
              }
            }'

          echo ""
          echo "======================================"
          echo "FINAL VERIFICATION: SUCCESS"
          echo "======================================"
          echo "VIDEO       : VERIFIED"
          echo "AUDIO       : VERIFIED"
          echo "RESOLUTION  : 1080x1920 VERIFIED"
          echo "CODEC       : H264 + AAC VERIFIED"
          echo "DURATION    : VERIFIED"
          echo "======================================"


      # ============================================================
      # 7. PACKAGE RENDER ARTIFACT
      # ============================================================
      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp \
            "$ROOT/aicap_final.mp4" \
            artifact/aicap_final.mp4

          cp \
            "$ROOT/scene_config.json" \
            artifact/scene_config.json

          cp \
            "$ROOT/narration.mp3" \
            artifact/narration.mp3

          find "$ROOT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.png" \
            \) \
            -exec cp {} artifact/ \;

          echo "======================================"
          echo "ARTIFACT PACKAGE READY"
          echo "======================================"
          ls -lh artifact/
          echo "======================================"


      # ============================================================
      # 8. UPLOAD FINAL GITHUB ARTIFACT
      # ============================================================
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
