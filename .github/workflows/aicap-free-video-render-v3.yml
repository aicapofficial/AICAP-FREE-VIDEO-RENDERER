name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout renderer
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL FFMPEG + FONTS
      # ============================================================
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            ffprobe \
            fonts-dejavu

          command -v ffmpeg
          command -v ffprobe

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          test -f \
            "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          echo "Subtitle font: DejaVuSans-Bold.ttf"
          echo "FFmpeg + fonts: READY"


      # ============================================================
      # 3. LOCATE AICAP RENDER JOB
      # ============================================================
      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          ROOT="aicap-render-jobs/${JOB_ID}"

          echo "Render root: $ROOT"

          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -f "$ROOT/narration.mp3"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

          echo "Render job located successfully."


      # ============================================================
      # 4. VALIDATE PRODUCTION PACKAGE
      # ============================================================
      - name: Validate production package
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"

          python3 - "$CFG" "$ROOT" "$AUDIO" <<'PY'
          import json
          import os
          import sys

          cfg_path, root, audio = sys.argv[1:4]

          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          prev_end = 0.0
          subtitle_count = 0

          for i, scene in enumerate(scenes, 1):

              start = float(scene["start"])
              end = float(scene["end"])

              if end <= start:
                  raise SystemExit(
                      f"Invalid scene {i}: end <= start"
                  )

              if abs(start - prev_end) > 0.001:
                  raise SystemExit(
                      f"Timeline gap/overlap before scene {i}: "
                      f"{start} != {prev_end}"
                  )

              filename = (
                  scene.get("filename")
                  or f"scene_{i:02d}.jpg"
              )

              image_path = os.path.join(root, filename)

              if not os.path.isfile(image_path):
                  raise SystemExit(
                      f"Missing scene image: {image_path}"
                  )

              # ----------------------------------------------------
              # Subtitle validation
              # ----------------------------------------------------
              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get("text", "")
                  ).strip()

                  if not text:
                      raise SystemExit(
                          f"Scene {i} has subtitles enabled "
                          f"but subtitle text is empty"
                      )

                  subtitle_count += 1

                  style = subtitle.get("style") or {}

                  try:
                      size = int(
                          style.get("size", 80)
                      )

                      outline = int(
                          style.get("outline", 5)
                      )

                      shadow = int(
                          style.get("shadow", 3)
                      )

                      margin = int(
                          style.get("margin", 90)
                      )

                  except (TypeError, ValueError) as exc:

                      raise SystemExit(
                          f"Invalid subtitle style in scene "
                          f"{i}: {exc}"
                      )

                  if size <= 0:
                      raise SystemExit(
                          f"Invalid subtitle size in scene {i}"
                      )

                  if outline < 0:
                      raise SystemExit(
                          f"Invalid subtitle outline in scene {i}"
                      )

                  if shadow < 0:
                      raise SystemExit(
                          f"Invalid subtitle shadow in scene {i}"
                      )

                  if margin < 0:
                      raise SystemExit(
                          f"Invalid subtitle margin in scene {i}"
                      )

              prev_end = end

          if not os.path.isfile(audio):
              raise SystemExit(
                  "Missing narration.mp3"
              )

          print("======================================")
          print("AICAP V3 PRODUCTION PACKAGE")
          print("======================================")
          print(f"Scenes              : {len(scenes)}")
          print(f"Timeline duration   : {prev_end:.3f}s")
          print(
              f"Subtitle scenes    : "
              f"{subtitle_count}/{len(scenes)}"
          )
          print("Images              : VERIFIED")
          print("Narration           : VERIFIED")
          print("Timeline            : VERIFIED")
          print("Subtitle metadata   : VERIFIED")
          print("======================================")
          PY


      # ============================================================
      # 5. RENDER VIDEO
      #
      # IMPORTANT:
      #
      # - Existing motion behavior is preserved.
      # - Scene timing comes from scene_config.json.
      # - Audio remains the continuous narration track.
      # - Subtitles are rendered INSIDE EACH SCENE.
      # - Subtitle timing therefore exactly follows scene start/end.
      # - drawtext uses textfile instead of inline text.
      # - This avoids FFmpeg escaping failures caused by:
      #       apostrophes
      #       commas
      #       colons
      #       quotation marks
      #       multiline text
      #       special characters
      # - Subtitle vertical position uses text_h.
      # - This prevents multiline captions from moving outside
      #   the safe area.
      # ============================================================
      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          python3 - "$CFG" "$ROOT" "$AUDIO" "$OUT" > /tmp/render.sh <<'PY'
          import json
          import os
          import shlex
          import sys

          cfg_path, root, audio, out = sys.argv[1:5]

          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list) or not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          fps = int(cfg.get("fps", 30))
          width = int(cfg.get("width", 1080))
          height = int(cfg.get("height", 1920))

          if fps <= 0:
              raise SystemExit("Invalid FPS")

          if width <= 0 or height <= 0:
              raise SystemExit(
                  "Invalid render dimensions"
              )

          fontfile = (
              "/usr/share/fonts/truetype/"
              "dejavu/"
              "DejaVuSans-Bold.ttf"
          )

          if not os.path.isfile(fontfile):
              raise SystemExit(
                  "Subtitle font file is missing: "
                  + fontfile
              )

          def q(value):
              return shlex.quote(str(value))

          def ffmpeg_filter_escape(value):
              """
              Escape values used in FFmpeg filter arguments.

              Text is NOT passed directly to drawtext.
              Subtitle text is written to a text file instead.

              This helper is retained for paths and style values.
              """

              value = str(value)

              value = value.replace("\\", "\\\\")
              value = value.replace(":", "\\:")
              value = value.replace("'", "\\'")

              return value

          inputs = []
          filters = []
          concat_labels = []

          subtitle_files = []

          motion_names = (
              "zoom_in",
              "zoom_out",
              "pan_left",
              "pan_right"
          )

          for i, scene in enumerate(scenes):

              filename = (
                  scene.get("filename")
                  or f"scene_{i+1:02d}.jpg"
              )

              image = os.path.join(root, filename)

              start = float(scene["start"])
              end = float(scene["end"])
              dur = end - start

              if dur <= 0:
                  raise SystemExit(
                      f"Invalid scene duration: scene {i+1}"
                  )

              motion = scene.get("motion", "")

              if motion not in motion_names:
                  motion = motion_names[
                      i % len(motion_names)
                  ]

              frames = max(
                  1,
                  int(round(dur * fps))
              )

              # ====================================================
              # EXISTING MOTION ENGINE
              # ====================================================

              if motion == "zoom_in":

                  vf = (
                      f"scale={width*2}:{height*2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='min(zoom+0.0007,1.12)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "zoom_out":

                  vf = (
                      f"scale={width*2}:{height*2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='if(eq(on,0),1.12,"
                      f"max(1.0,zoom-0.0007))':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "pan_left":

                  vf = (
                      f"scale={width*2}:{height*2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*"
                      f"min(on/{frames},1)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              else:

                  vf = (
                      f"scale={width*2}:{height*2}:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='1.08':"
                      f"x='(iw-iw/zoom)*"
                      f"(1-min(on/{frames},1))':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ====================================================
              # BASE SCENE
              # ====================================================

              scene_filter = (
                  f"[{i}:v]"
                  f"{vf},"
                  f"trim=duration={dur:.6f},"
                  f"setpts=PTS-STARTPTS"
              )

              # ====================================================
              # SUBTITLE RENDERING
              #
              # CRITICAL DESIGN:
              #
              # Do NOT pass subtitle text directly into drawtext.
              #
              # Text goes into a UTF-8 text file.
              #
              # This eliminates the previous class of errors caused
              # by FFmpeg filter-parser escaping.
              # ====================================================

              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get("text", "")
                  ).strip()

                  if not text:
                      raise SystemExit(
                          f"Scene {i+1} subtitle text is empty"
                      )

                  subtitle_path = os.path.join(
                      root,
                      f".subtitle_{i+1:02d}.txt"
                  )

                  # UTF-8 subtitle text.
                  with open(
                      subtitle_path,
                      "w",
                      encoding="utf-8"
                  ) as text_file:

                      text_file.write(text)

                  subtitle_files.append(
                      subtitle_path
                  )

                  style = subtitle.get("style") or {}

                  size = int(
                      style.get("size", 80)
                  )

                  outline = int(
                      style.get("outline", 5)
                  )

                  shadow = int(
                      style.get("shadow", 3)
                  )

                  margin = int(
                      style.get("margin", 90)
                  )

                  color = str(
                      style.get(
                          "color",
                          "#FFFFFF"
                      )
                  ).strip()

                  if color.startswith("#"):
                      color = color[1:]

                  if len(color) != 6:
                      color = "FFFFFF"

                  # Safe subtitle path.
                  subtitle_file_ffmpeg = (
                      ffmpeg_filter_escape(
                          subtitle_path
                      )
                  )

                  # ------------------------------------------------
                  # Renderer-managed safe bottom center.
                  #
                  # text_h is used instead of a fixed Y position.
                  #
                  # This is essential for multiline captions.
                  # ------------------------------------------------

                  drawtext = (
                      "drawtext="
                      f"fontfile="
                      f"'{ffmpeg_filter_escape(fontfile)}':"
                      f"textfile="
                      f"'{subtitle_file_ffmpeg}':"
                      f"fontcolor=0x{color}:"
                      f"fontsize={size}:"
                      f"font=DejaVuSans:"
                      f"borderw={outline}:"
                      f"bordercolor=black@0.95:"
                      f"shadowx={shadow}:"
                      f"shadowy={shadow}:"
                      f"shadowcolor=black@0.70:"
                      f"x='(w-text_w)/2':"
                      f"y='h-text_h-{margin}'"
                  )

                  scene_filter += "," + drawtext

              scene_filter += (
                  f"[v{i}]"
              )

              filters.append(scene_filter)
              concat_labels.append(
                  f"[v{i}]"
              )

          # ========================================================
          # CONCATENATE SCENES
          # ========================================================

          total = float(
              scenes[-1]["end"]
          )

          filters.append(
              "".join(concat_labels)
              +
              f"concat="
              f"n={len(scenes)}:"
              f"v=1:"
              f"a=0,"
              f"trim=duration={total:.6f},"
              f"setpts=PTS-STARTPTS"
              f"[v]"
          )

          # ========================================================
          # FFMPEG COMMAND
          # ========================================================

          cmd = [
              "ffmpeg",
              "-y",
              "-hide_banner",
              "-loglevel",
              "error"
          ]

          cmd += inputs

          # The scene inputs are constructed below.
          #
          # Rebuild them in exactly the same order used by filters.

          cmd = [
              "ffmpeg",
              "-y",
              "-hide_banner",
              "-loglevel",
              "error"
          ]

          for i, scene in enumerate(scenes):

              filename = (
                  scene.get("filename")
                  or f"scene_{i+1:02d}.jpg"
              )

              image = os.path.join(
                  root,
                  filename
              )

              start = float(
                  scene["start"]
              )

              end = float(
                  scene["end"]
              )

              dur = end - start

              cmd += [
                  "-loop",
                  "1",
                  "-t",
                  f"{dur:.6f}",
                  "-i",
                  image
              ]

          # Continuous narration is the final input.
          cmd += [
              "-i",
              audio
          ]

          cmd += [
              "-filter_complex",
              ";".join(filters),

              "-map",
              "[v]",

              "-map",
              f"{len(scenes)}:a",

              "-c:v",
              "libx264",

              "-preset",
              "medium",

              "-crf",
              "20",

              "-pix_fmt",
              "yuv420p",

              "-r",
              str(fps),

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-t",
              f"{total:.6f}",

              "-movflags",
              "+faststart",

              out
          ]

          print("======================================")
          print("AICAP MODULE 20 FFMPEG RENDER")
          print("======================================")
          print(
              f"Resolution       : {width}x{height}"
          )
          print(f"FPS              : {fps}")
          print(
              f"Scenes           : {len(scenes)}"
          )
          print(
              f"Total duration   : {total:.3f}s"
          )
          print(
              f"Subtitle scenes  : {len(subtitle_files)}"
          )
          print(
              "Subtitle engine  : FFmpeg drawtext"
          )
          print(
              "Subtitle input   : UTF-8 textfile"
          )
          print(
              "Subtitle position: bottom center / text_h"
          )
          print("Motion engine     : PRESERVED")
          print("Audio             : CONTINUOUS")
          print("======================================")

          print(
              " ".join(
                  q(x)
                  for x in cmd
              )
          )

          # Remove temporary subtitle files after command
          # generation is complete only AFTER FFmpeg executes.
          #
          # The shell will execute the generated command while
          # these files still exist.

          cleanup = [
              "rm",
              "-f"
          ]

          cleanup += subtitle_files

          print(
              " ".join(
                  q(x)
                  for x in cleanup
              )
          )

          PY

          chmod +x /tmp/render.sh

          /tmp/render.sh > /tmp/render_command.sh

          # The generated file contains:
          # 1. FFmpeg command
          # 2. Cleanup command
          #
          # Execute both.

          bash /tmp/render_command.sh

          test -s "$OUT"

          echo "======================================"
          echo "AICAP VIDEO RENDER : SUCCESS"
          echo "Output: $OUT"
          echo "======================================"


      # ============================================================
      # 6. VERIFY FINAL VIDEO
      # ============================================================
      - name: Verify output
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"

          test -s "$OUT"

          WIDTH="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$OUT"
          )"

          HEIGHT="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          DURATION="$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          echo "======================================"
          echo "AICAP MODULE 20 OUTPUT VERIFICATION"
          echo "======================================"
          echo "Width        : $WIDTH"
          echo "Height       : $HEIGHT"
          echo "Audio codec  : $AUDIO_CODEC"
          echo "Duration     : $DURATION"
          echo "======================================"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$AUDIO_CODEC" = "aac"

          python3 - "$DURATION" "$ROOT/scene_config.json" <<'PY'
          import json
          import sys

          actual = float(sys.argv[1])
          cfg_path = sys.argv[2]

          with open(
              cfg_path,
              "r",
              encoding="utf-8"
          ) as f:
              cfg = json.load(f)

          expected = float(
              cfg["scenes"][-1]["end"]
          )

          difference = abs(
              actual - expected
          )

          print(
              f"Expected duration : {expected:.3f}s"
          )

          print(
              f"Actual duration   : {actual:.3f}s"
          )

          print(
              f"Difference        : {difference:.3f}s"
          )

          # Allow small MP4/container rounding difference.
          if difference > 0.10:
              raise SystemExit(
                  "Final video duration differs "
                  "from scene timeline by more than 0.10s"
              )

          print(
              "Timeline duration : VERIFIED"
          )
          PY


      # ============================================================
      # 7. PACKAGE ARTIFACT
      # ============================================================
      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp \
            "$ROOT/aicap_final.mp4" \
            artifact/aicap_final.mp4

          cp \
            "$ROOT/scene_config.json" \
            artifact/scene_config.json

          cp \
            "$ROOT/narration.mp3" \
            artifact/narration.mp3

          cp -R \
            "$ROOT"/*.jpg \
            artifact/ \
            2>/dev/null || true

          echo "Artifact package created."


      # ============================================================
      # 8. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
