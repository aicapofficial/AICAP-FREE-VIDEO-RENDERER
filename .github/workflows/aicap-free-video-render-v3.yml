name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout renderer
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL FFMPEG + FONTS
      # ============================================================
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

          echo "======================================"
          echo "AICAP RENDER ENVIRONMENT"
          echo "======================================"

          command -v ffmpeg
          command -v ffprobe

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

          FONT="/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf"

          if [ ! -f "$FONT" ]; then
            echo "ERROR: Required subtitle font not found:"
            echo "$FONT"
            exit 1
          fi

          echo "Subtitle font:"
          echo "$FONT"

          echo "======================================"


      # ============================================================
      # 3. LOCATE RENDER JOB
      # ============================================================
      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          if [ -z "${JOB_ID:-}" ]; then
            echo "ERROR: job_id is empty."
            exit 1
          fi

          ROOT="aicap-render-jobs/${JOB_ID}"

          echo "======================================"
          echo "AICAP RENDER JOB"
          echo "======================================"
          echo "Job ID : ${JOB_ID}"
          echo "Root   : ${ROOT}"
          echo "======================================"

          test -d "$ROOT"
          test -f "$ROOT/scene_config.json"
          test -f "$ROOT/narration.mp3"

          echo "Render job directory : VERIFIED"
          echo "scene_config.json     : FOUND"
          echo "narration.mp3         : FOUND"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. VALIDATE JSON PACKAGE
      #
      # IMPORTANT:
      # scene_config.json MUST NEVER be executed as Python.
      #
      # It is read strictly through json.load().
      # ============================================================
      - name: Validate render package
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"

          echo "======================================"
          echo "AICAP JSON VALIDATION"
          echo "======================================"
          echo "Configuration : $CFG"
          echo "======================================"

          python3 - "$CFG" "$ROOT" <<'PY'
          import json
          import os
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]

          print("Reading scene_config.json with Python JSON parser...")

          try:
              with open(cfg_path, "r", encoding="utf-8") as f:
                  cfg = json.load(f)
          except json.JSONDecodeError as exc:
              print("======================================")
              print("INVALID JSON")
              print("======================================")
              print(f"File      : {cfg_path}")
              print(f"Line      : {exc.lineno}")
              print(f"Column    : {exc.colno}")
              print(f"Position  : {exc.pos}")
              print(f"Message   : {exc.msg}")
              print("======================================")
              raise SystemExit(1)

          if not isinstance(cfg, dict):
              raise SystemExit(
                  "scene_config.json root must be a JSON object"
              )

          scenes = cfg.get("scenes")

          if not isinstance(scenes, list):
              raise SystemExit(
                  "scene_config.json field 'scenes' must be an array"
              )

          if not scenes:
              raise SystemExit(
                  "scene_config.json contains no scenes"
              )

          print(f"Scene count : {len(scenes)}")

          prev_end = 0.0

          for i, scene in enumerate(scenes, 1):

              if not isinstance(scene, dict):
                  raise SystemExit(
                      f"Scene {i} is not a JSON object"
                  )

              try:
                  start = float(scene["start"])
                  end = float(scene["end"])
              except (KeyError, TypeError, ValueError) as exc:
                  raise SystemExit(
                      f"Invalid timing in scene {i}: {exc}"
                  )

              if start < 0:
                  raise SystemExit(
                      f"Invalid scene {i}: start < 0"
                  )

              if end <= start:
                  raise SystemExit(
                      f"Invalid scene {i}: end <= start"
                  )

              if abs(start - prev_end) > 0.001:
                  raise SystemExit(
                      "Timeline gap/overlap before scene "
                      f"{i}: {start} != {prev_end}"
                  )

              filename = (
                  scene.get("filename")
                  or f"scene_{i:02d}.jpg"
              )

              image_path = os.path.join(root, filename)

              if not os.path.isfile(image_path):
                  raise SystemExit(
                      f"Missing scene image: {image_path}"
                  )

              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):
                  text = str(
                      subtitle.get("text", "")
                  ).strip()

                  if not text:
                      raise SystemExit(
                          f"Scene {i} subtitles enabled "
                          "but subtitle text is empty"
                      )

              motion = scene.get("motion", "")

              if motion not in (
                  "zoom_in",
                  "zoom_out",
                  "pan_left",
                  "pan_right"
              ):
                  print(
                      f"Scene {i}: unknown motion "
                      f"'{motion}', renderer fallback will be used."
                  )

              prev_end = end

              print(
                  f"Scene {i}: "
                  f"{start:.3f} -> {end:.3f} "
                  f"({end - start:.3f}s) "
                  f"{filename}"
              )

          narration = os.path.join(
              root,
              "narration.mp3"
          )

          if not os.path.isfile(narration):
              raise SystemExit(
                  "Missing narration.mp3"
              )

          total = prev_end

          print("======================================")
          print("JSON PARSE            : PASSED")
          print("SCENE ARRAY           : PASSED")
          print("SCENE IMAGES          : PASSED")
          print("NARRATION             : PASSED")
          print("TIMELINE              : PASSED")
          print(f"TOTAL DURATION        : {total:.3f}s")
          print("======================================")
          PY


      # ============================================================
      # 5. RENDER VIDEO
      #
      # IMPORTANT:
      # The JSON file is parsed with json.load().
      # The generated /tmp/render.sh contains ONLY shell commands.
      # scene_config.json is never executed.
      # ============================================================
      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          echo "======================================"
          echo "AICAP FFMPEG RENDER"
          echo "======================================"
          echo "Config : $CFG"
          echo "Audio  : $AUDIO"
          echo "Output : $OUT"
          echo "======================================"

          python3 - "$CFG" "$ROOT" "$AUDIO" "$OUT" > /tmp/render.sh <<'PY'
          import json
          import os
          import shlex
          import sys

          cfg_path = sys.argv[1]
          root = sys.argv[2]
          audio = sys.argv[3]
          out = sys.argv[4]

          # --------------------------------------------------------
          # JSON IS PARSED ONLY.
          # It is NEVER executed as Python.
          # --------------------------------------------------------
          with open(cfg_path, "r", encoding="utf-8") as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]

          fps = int(cfg.get("fps", 30))
          width = int(cfg.get("width", 1080))
          height = int(cfg.get("height", 1920))

          if fps <= 0:
              raise SystemExit("Invalid FPS")

          if width <= 0 or height <= 0:
              raise SystemExit("Invalid output dimensions")

          def q(value):
              return shlex.quote(str(value))

          inputs = []
          filters = []
          concat_labels = []

          caption_font = (
              "/usr/share/fonts/truetype/"
              "liberation2/"
              "LiberationSans-Bold.ttf"
          )

          for i, scene in enumerate(scenes):

              filename = (
                  scene.get("filename")
                  or f"scene_{i + 1:02d}.jpg"
              )

              image = os.path.join(
                  root,
                  filename
              )

              start = float(scene["start"])
              end = float(scene["end"])
              dur = end - start

              if dur <= 0:
                  raise SystemExit(
                      f"Invalid duration for scene {i + 1}: {dur}"
                  )

              motion = scene.get("motion", "")

              if motion not in (
                  "zoom_in",
                  "zoom_out",
                  "pan_left",
                  "pan_right"
              ):
                  motion = (
                      "zoom_in",
                      "zoom_out",
                      "pan_left",
                      "pan_right"
                  )[i % 4]

              frames = max(
                  1,
                  int(round(dur * fps))
              )

              # ----------------------------------------------------
              # MOTION
              # ----------------------------------------------------

              if motion == "zoom_in":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      "zoompan="
                      "z='min(zoom+0.0007,1.12)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "zoom_out":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      "zoompan="
                      "z='if(eq(on,0),1.12,"
                      "max(1.0,zoom-0.0007))':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              elif motion == "pan_left":

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      "zoompan="
                      "z='1.08':"
                      "x='(iw-iw/zoom)*"
                      f"min(on/max(1,{frames}),1)':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              else:

                  vf = (
                      f"scale={width * 2}:{height * 2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width * 2}:{height * 2},"
                      "zoompan="
                      "z='1.08':"
                      "x='(iw-iw/zoom)*"
                      f"(1-min(on/max(1,{frames}),1))':"
                      "y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )

              # ----------------------------------------------------
              # SUBTITLE
              # ----------------------------------------------------

              subtitle = scene.get("subtitle") or {}

              if subtitle.get("enabled"):

                  text = str(
                      subtitle.get("text", "")
                  ).replace(
                      "\r\n",
                      "\n"
                  ).replace(
                      "\r",
                      "\n"
                  ).strip()

                  caption_file = (
                      f"/tmp/aicap_caption_"
                      f"{i + 1:02d}.txt"
                  )

                  with open(
                      caption_file,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(text)

                  style = subtitle.get("style") or {}

                  fontsize = int(
                      style.get("size", 80)
                  )

                  outline = int(
                      style.get("outline", 5)
                  )

                  shadow = int(
                      style.get("shadow", 3)
                  )

                  margin = int(
                      style.get("margin", 90)
                  )

                  bottom_margin = max(
                      100,
                      margin + 30
                  )

                  drawtext = (
                      "drawtext="
                      f"fontfile={q(caption_font)}:"
                      f"textfile={q(caption_file)}:"
                      "fontcolor=white:"
                      f"fontsize={fontsize}:"
                      "x='(w-text_w)/2':"
                      "y='h-text_h-"
                      f"{bottom_margin}':"
                      "line_spacing=10:"
                      f"borderw={outline}:"
                      "bordercolor=black@0.85:"
                      f"shadowx={shadow}:"
                      f"shadowy={shadow}:"
                      "shadowcolor=black@0.80:"
                      "fix_bounds=1"
                  )

                  vf += "," + drawtext

              inputs += [
                  "-loop",
                  "1",
                  "-t",
                  f"{dur:.6f}",
                  "-i",
                  image
              ]

              filters.append(
                  f"[{i}:v]"
                  f"{vf},"
                  f"trim=duration={dur:.6f},"
                  "setpts=PTS-STARTPTS"
                  f"[v{i}]"
              )

              concat_labels.append(
                  f"[v{i}]"
              )

          total_duration = float(
              scenes[-1]["end"]
          )

          audio_input_index = len(scenes)

          filters.append(
              "".join(concat_labels)
              + f"concat=n={len(scenes)}:v=1:a=0,"
              + f"trim=duration={total_duration:.6f},"
              + "setpts=PTS-STARTPTS[v]"
          )

          cmd = [
              "ffmpeg",
              "-y",
              "-hide_banner",
              "-loglevel",
              "error"
          ]

          cmd += inputs

          cmd += [
              "-i",
              audio,

              "-filter_complex",
              ";".join(filters),

              "-map",
              "[v]",

              "-map",
              f"{audio_input_index}:a",

              "-c:v",
              "libx264",

              "-preset",
              "medium",

              "-crf",
              "20",

              "-pix_fmt",
              "yuv420p",

              "-r",
              str(fps),

              "-c:a",
              "aac",

              "-b:a",
              "192k",

              "-t",
              f"{total_duration:.6f}",

              "-af",
              "aresample=async=1:first_pts=0",

              "-movflags",
              "+faststart",

              out
          ]

          # Output a shell-safe FFmpeg command.
          print(
              " ".join(
                  q(x)
                  for x in cmd
              )
          )
          PY

          chmod +x /tmp/render.sh

          echo "Generated FFmpeg command."

          /tmp/render.sh | bash

          test -s "$OUT"

          echo "======================================"
          echo "FFMPEG RENDER : PASSED"
          echo "======================================"


      # ============================================================
      # 6. VERIFY FINAL OUTPUT
      # ============================================================
      - name: Verify output
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"
          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"

          test -s "$OUT"

          echo "======================================"
          echo "AICAP FINAL OUTPUT VERIFICATION"
          echo "======================================"

          echo ""
          echo "===== VIDEO STREAM ====="

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          echo ""
          echo "===== AUDIO STREAM ====="

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries \
            stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            "$OUT"

          WIDTH="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$OUT"
          )"

          HEIGHT="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_CODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"

          VIDEO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          AUDIO_DURATION="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"

          EXPECTED_DURATION="$(
            python3 - "$CFG" <<'PY'
          import json
          import sys

          cfg_path = sys.argv[1]

          # Again: JSON parsing only.
          with open(
              cfg_path,
              "r",
              encoding="utf-8"
          ) as f:
              cfg = json.load(f)

          scenes = cfg["scenes"]

          print(
              f"{float(scenes[-1]['end']):.6f}"
          )
          PY
          )"

          echo ""
          echo "Resolution      : ${WIDTH}x${HEIGHT}"
          echo "Audio codec     : ${AUDIO_CODEC}"
          echo "Video duration  : ${VIDEO_DURATION}s"
          echo "Audio duration  : ${AUDIO_DURATION}s"
          echo "Expected        : ${EXPECTED_DURATION}s"

          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$AUDIO_CODEC" = "aac"

          python3 \
            "$VIDEO_DURATION" \
            "$AUDIO_DURATION" \
            "$EXPECTED_DURATION" <<'PY'

          import sys

          video = float(sys.argv[1])
          audio = float(sys.argv[2])
          expected = float(sys.argv[3])

          tolerance = 0.20

          if abs(video - expected) > tolerance:
              raise SystemExit(
                  "Rendered video duration does not "
                  "match scene timeline: "
                  f"expected={expected:.3f}s "
                  f"video={video:.3f}s"
              )

          if audio < expected - tolerance:
              raise SystemExit(
                  "Narration audio is materially shorter "
                  "than visual timeline: "
                  f"expected={expected:.3f}s "
                  f"audio={audio:.3f}s"
              )

          if video < audio - tolerance:
              raise SystemExit(
                  "Rendered video is materially shorter "
                  "than audio: "
                  f"video={video:.3f}s "
                  f"audio={audio:.3f}s"
              )

          print(
              "Timeline verified: "
              f"expected={expected:.3f}s "
              f"video={video:.3f}s "
              f"audio={audio:.3f}s"
          )
          PY

          echo ""
          echo "======================================"
          echo "VIDEO       : VERIFIED"
          echo "AUDIO       : VERIFIED"
          echo "SIZE        : 1080x1920 VERIFIED"
          echo "CODEC       : H264 + AAC VERIFIED"
          echo "TIMELINE    : VERIFIED"
          echo "STATUS      : PASSED"
          echo "======================================"


      # ============================================================
      # 7. PACKAGE ARTIFACT
      # ============================================================
      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          mkdir -p artifact

          cp \
            "$ROOT/aicap_final.mp4" \
            artifact/aicap_final.mp4

          cp \
            "$ROOT/scene_config.json" \
            artifact/scene_config.json

          cp \
            "$ROOT/narration.mp3" \
            artifact/narration.mp3

          find "$ROOT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.png" \
            \) \
            -exec cp {} artifact/ \;

          echo "======================================"
          echo "ARTIFACT PACKAGE : READY"
          echo "======================================"

          ls -lh artifact/


      # ============================================================
      # 8. UPLOAD GITHUB ARTIFACT
      # ============================================================
      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
