name: AICAP Free Video Render V3

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

      video_id:
        description: "AICAP video ID"
        required: true
        type: string

      narration_file_id:
        description: "Google Drive narration file ID"
        required: true
        type: string

      scene_config:
        description: "Scene configuration JSON"
        required: true
        type: string

      output_file_name:
        description: "Output video filename"
        required: true
        default: "aicap-final-video.mp4"
        type: string

jobs:

  render:

    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. INSTALL FFMPEG + FONTS
      # ---------------------------------------------------------
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-liberation

          echo "FFmpeg : $(command -v ffmpeg)"
          echo "ffprobe: $(command -v ffprobe)"

          # Ubuntu 24.04 / GitHub runner path
          FONT="/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf"

          # Fallback detection in case runner path changes
          if [ ! -f "$FONT" ]; then
            FONT="$(find /usr/share/fonts -type f \
              \( -iname 'LiberationSans-Bold.ttf' \
              -o -iname 'LiberationSans-Bold.otf' \) \
              | head -n 1 || true)"
          fi

          if [ -z "${FONT:-}" ] || [ ! -f "$FONT" ]; then
            echo "ERROR: Liberation Sans Bold font not found."
            echo "Available Liberation fonts:"
            find /usr/share/fonts -type f \
              \( -iname '*LiberationSans*' -o -iname '*Liberation*' \) \
              | sort || true
            exit 1
          fi

          echo "Using subtitle font: $FONT"

          # Export for all later steps
          echo "AICAP_SUBTITLE_FONT=$FONT" >> "$GITHUB_ENV"

          echo "FFmpeg : AVAILABLE"
          echo "ffprobe: AVAILABLE"
          echo "Font   : AVAILABLE"


      # ---------------------------------------------------------
      # 3. VALIDATE REQUIRED INPUTS
      # ---------------------------------------------------------
      - name: Validate render inputs
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_ID: ${{ inputs.video_id }}
          NARRATION_FILE_ID: ${{ inputs.narration_file_id }}
          SCENE_CONFIG: ${{ inputs.scene_config }}
          OUTPUT_FILE_NAME: ${{ inputs.output_file_name }}
        run: |
          set -euo pipefail

          test -n "$JOB_ID"
          test -n "$VIDEO_ID"
          test -n "$NARRATION_FILE_ID"
          test -n "$SCENE_CONFIG"
          test -n "$OUTPUT_FILE_NAME"

          echo "AICAP Render Job"
          echo "----------------------------"
          echo "Job ID       : $JOB_ID"
          echo "Video ID     : $VIDEO_ID"
          echo "Narration ID : $NARRATION_FILE_ID"
          echo "Output       : $OUTPUT_FILE_NAME"
          echo "Font         : $AICAP_SUBTITLE_FONT"
          echo "----------------------------"


      # ---------------------------------------------------------
      # 4. CREATE JOB DIRECTORY
      # ---------------------------------------------------------
      - name: Prepare render workspace
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          mkdir -p "aicap-render-jobs/$JOB_ID"
          mkdir -p "aicap-render-jobs/$JOB_ID/images"
          mkdir -p "aicap-render-jobs/$JOB_ID/output"

          echo "Workspace prepared:"
          find "aicap-render-jobs/$JOB_ID" -maxdepth 2 -type d | sort


      # ---------------------------------------------------------
      # 5. WRITE SCENE CONFIG
      # ---------------------------------------------------------
      - name: Write scene configuration
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          SCENE_CONFIG: ${{ inputs.scene_config }}
        run: |
          set -euo pipefail

          CONFIG="aicap-render-jobs/$JOB_ID/scene_config.json"

          printf '%s' "$SCENE_CONFIG" > "$CONFIG"

          echo "Scene configuration written:"
          cat "$CONFIG"

          # Validate JSON with Python.
          python3 - "$CONFIG" <<'PY'
          import json
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("scene_config.json : VALID JSON")

          if isinstance(data, dict):
              print("Configuration type: OBJECT")
          elif isinstance(data, list):
              print("Configuration type: ARRAY")
          else:
              raise SystemExit("ERROR: Invalid scene configuration root")

          print("JSON validation successful.")
          PY


      # ---------------------------------------------------------
      # 6. DISPLAY RENDER ENVIRONMENT
      # ---------------------------------------------------------
      - name: Verify render environment
        shell: bash
        run: |
          set -euo pipefail

          echo "======================================"
          echo "AICAP RENDER ENVIRONMENT"
          echo "======================================"

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

          echo "Subtitle font:"
          echo "$AICAP_SUBTITLE_FONT"

          test -f "$AICAP_SUBTITLE_FONT"

          echo "======================================"
          echo "ENVIRONMENT READY"
          echo "======================================"


      # ---------------------------------------------------------
      # 7. FIND RENDERER
      # ---------------------------------------------------------
      - name: Locate renderer
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for AICAP renderer..."

          find . -maxdepth 4 -type f \
            \( -name '*.py' -o -name '*.sh' \) \
            | sort

          echo "Renderer discovery complete."


      # ---------------------------------------------------------
      # 8. RENDER
      # ---------------------------------------------------------
      #
      # IMPORTANT:
      # The existing AICAP renderer is invoked here.
      #
      # If your repository already contains render.py,
      # this block uses it.
      #
      # ---------------------------------------------------------
      - name: Render AICAP video
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_ID: ${{ inputs.video_id }}
          NARRATION_FILE_ID: ${{ inputs.narration_file_id }}
          SCENE_CONFIG: ${{ inputs.scene_config }}
          OUTPUT_FILE_NAME: ${{ inputs.output_file_name }}
        run: |
          set -euo pipefail

          JOB_DIR="aicap-render-jobs/$JOB_ID"
          CONFIG="$JOB_DIR/scene_config.json"
          OUTPUT="$JOB_DIR/output/$OUTPUT_FILE_NAME"

          echo "======================================"
          echo "AICAP REAL VIDEO RENDER"
          echo "======================================"
          echo "Job ID       : $JOB_ID"
          echo "Video ID     : $VIDEO_ID"
          echo "Narration ID : $NARRATION_FILE_ID"
          echo "Config       : $CONFIG"
          echo "Output       : $OUTPUT"
          echo "Font         : $AICAP_SUBTITLE_FONT"
          echo "======================================"

          # Do not execute JSON as Python.
          # scene_config.json is JSON and is loaded with json.load().
          python3 - "$CONFIG" <<'PY'
          import json
          import sys

          config_path = sys.argv[1]

          with open(config_path, "r", encoding="utf-8") as f:
              config = json.load(f)

          print("Scene configuration successfully parsed.")

          if isinstance(config, dict):
              scenes = config.get("scenes", [])
              print("Scene count:", len(scenes))
          elif isinstance(config, list):
              print("Scene count:", len(config))
          PY

          echo "Renderer execution begins after configuration validation."

          # ----------------------------------------------------
          # Locate the existing renderer.
          # ----------------------------------------------------
          RENDERER=""

          if [ -f "./render.py" ]; then
            RENDERER="./render.py"
          elif [ -f "./renderer.py" ]; then
            RENDERER="./renderer.py"
          elif [ -f "./aicap-renderer.py" ]; then
            RENDERER="./aicap-renderer.py"
          elif [ -f "./aicap_renderer.py" ]; then
            RENDERER="./aicap_renderer.py"
          fi

          if [ -n "$RENDERER" ]; then
            echo "Renderer found: $RENDERER"

            python3 "$RENDERER" \
              --job-id "$JOB_ID" \
              --video-id "$VIDEO_ID" \
              --narration-file-id "$NARRATION_FILE_ID" \
              --scene-config "$CONFIG" \
              --output "$OUTPUT" \
              --font "$AICAP_SUBTITLE_FONT"

          else
            echo "No standalone renderer.py found."
            echo "Checking repository for render implementation..."

            find . -type f \
              \( -name '*.py' -o -name '*.sh' \) \
              | sort

            echo ""
            echo "ERROR: AICAP renderer entry point was not found."
            echo "The environment and JSON configuration are valid."
            exit 1
          fi


      # ---------------------------------------------------------
      # 9. VERIFY OUTPUT
      # ---------------------------------------------------------
      - name: Verify rendered video
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          OUTPUT_FILE_NAME: ${{ inputs.output_file_name }}
        run: |
          set -euo pipefail

          OUTPUT="aicap-render-jobs/$JOB_ID/output/$OUTPUT_FILE_NAME"

          echo "======================================"
          echo "AICAP OUTPUT VERIFICATION"
          echo "======================================"

          test -f "$OUTPUT"
          test -s "$OUTPUT"

          echo "Output file:"
          ls -lh "$OUTPUT"

          echo ""
          echo "FFprobe verification:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            "$OUTPUT"

          echo ""
          echo "VIDEO OUTPUT VERIFIED"


      # ---------------------------------------------------------
      # 10. UPLOAD RESULT
      # ---------------------------------------------------------
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: aicap-render-jobs/${{ inputs.job_id }}/output/
          if-no-files-found: error


      # ---------------------------------------------------------
      # 11. SUCCESS
      # ---------------------------------------------------------
      - name: Render completed
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          set -euo pipefail

          echo "======================================"
          echo "AICAP RENDER SUCCESS"
          echo "======================================"
          echo "Job ID   : $JOB_ID"
          echo "Video ID : $VIDEO_ID"
          echo "Status   : SUCCESS"
          echo "======================================"
