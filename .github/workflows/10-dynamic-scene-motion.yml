name: AICAP FREE RENDER — 10 — DYNAMIC SCENE MOTION

on:
  workflow_dispatch:

jobs:
  render-test-10:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 02. INSTALL FFMPEG + JQ
      # ==========================================================

      - name: Install FFmpeg and jq
        run: |
          echo "======================================"
          echo "AICAP FREE RENDER"
          echo "10 — DYNAMIC SCENE MOTION"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

          echo "FFmpeg installed."
          echo "jq installed."


      # ==========================================================
      # 03. VERIFY TOOLS
      # ==========================================================

      - name: Verify rendering tools
        run: |
          echo "======================================"
          echo "TOOL VERIFICATION"
          echo "======================================"

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg : AVAILABLE"
            echo "Path   : $(which ffmpeg)"
          else
            echo "FFmpeg : NOT AVAILABLE"
            exit 1
          fi

          if command -v jq >/dev/null 2>&1; then
            echo "jq     : AVAILABLE"
            echo "Path   : $(which jq)"
          else
            echo "jq     : NOT AVAILABLE"
            exit 1
          fi

          echo "======================================"
          echo "TOOLS : VERIFIED"
          echo "======================================"


      # ==========================================================
      # 04. DEFINE REAL AICAP ASSETS
      # ==========================================================

      - name: Define AICAP assets
        run: |
          echo "======================================"
          echo "REAL AICAP ASSETS"
          echo "======================================"

          echo "Scene 01:"
          echo "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg"

          echo "Scene 02:"
          echo "AICAP_SECTION10_SCENE02_CLOUDFLARE_20260814_122220.jpg"

          echo "Scene 03:"
          echo "AICAP_SECTION10_SCENE03_CLOUDFLARE_20260814_122224.jpg"

          echo "Scene 04:"
          echo "Scene 01 image reused for renderer testing"

          echo "Narration:"
          echo "AI_in_60_Seconds_DEFAULT_20260811_190008.mp3"


      # ==========================================================
      # 05. CREATE TEST 10 JSON
      #
      # Each scene now has an independent motion property.
      #
      # Scene 01 = zoom_in
      # Scene 02 = zoom_out
      # Scene 03 = pan_left
      # Scene 04 = pan_right
      # ==========================================================

      - name: Create dynamic motion JSON
        run: |
          echo "======================================"
          echo "CREATING TEST 10 JSON"
          echo "======================================"

          cat > scene_config.json <<'EOF'
          {
            "project": {
              "name": "AICAP_TEST_10_DYNAMIC_SCENE_MOTION",
              "resolution": {
                "width": 1080,
                "height": 1920
              },
              "fps": 30,
              "total_duration": 60
            },

            "transition": {
              "type": "fade",
              "duration": 1
            },

            "audio": {
              "file": "AI_in_60_Seconds_DEFAULT_20260811_190008.mp3"
            },

            "scenes": [
              {
                "id": 1,
                "image": "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg",
                "duration": 10,
                "motion": "zoom_in"
              },

              {
                "id": 2,
                "image": "AICAP_SECTION10_SCENE02_CLOUDFLARE_20260814_122220.jpg",
                "duration": 15,
                "motion": "zoom_out"
              },

              {
                "id": 3,
                "image": "AICAP_SECTION10_SCENE03_CLOUDFLARE_20260814_122224.jpg",
                "duration": 15,
                "motion": "pan_left"
              },

              {
                "id": 4,
                "image": "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg",
                "duration": 20,
                "motion": "pan_right"
              }
            ]
          }
          EOF

          echo "--------------------------------------"
          echo "TEST 10 JSON"
          echo "--------------------------------------"

          cat scene_config.json

          echo "======================================"
          echo "JSON CREATED"
          echo "======================================"


      # ==========================================================
      # 06. VALIDATE JSON
      # ==========================================================

      - name: Validate JSON configuration
        run: |
          echo "======================================"
          echo "JSON VALIDATION"
          echo "======================================"

          jq empty scene_config.json

          echo "JSON syntax : VALID"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          WIDTH=$(jq -r '.project.resolution.width' scene_config.json)
          HEIGHT=$(jq -r '.project.resolution.height' scene_config.json)
          FPS=$(jq -r '.project.fps' scene_config.json)
          TARGET=$(jq -r '.project.total_duration' scene_config.json)
          TRANSITION=$(jq -r '.transition.duration' scene_config.json)

          echo "Scene Count : $SCENE_COUNT"
          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "FPS        : $FPS"
          echo "Target     : $TARGET seconds"
          echo "Transition : $TRANSITION seconds"

          if [ "$SCENE_COUNT" -ne 4 ]; then
            echo "ERROR: Test 10 requires 4 scenes."
            exit 1
          fi

          echo "======================================"
          echo "JSON : VALID"
          echo "======================================"


      # ==========================================================
      # 07. VALIDATE TOTAL DURATION
      # ==========================================================

      - name: Validate total scene duration
        run: |
          echo "======================================"
          echo "SCENE DURATION VALIDATION"
          echo "======================================"

          SCENE_TOTAL=$(jq '[.scenes[].duration] | add' scene_config.json)
          TARGET_TOTAL=$(jq '.project.total_duration' scene_config.json)

          echo "Scene Duration Sum : $SCENE_TOTAL seconds"
          echo "Target Duration    : $TARGET_TOTAL seconds"

          if [ "$SCENE_TOTAL" -ne "$TARGET_TOTAL" ]; then
            echo "ERROR: Scene durations do not equal target duration."
            exit 1
          fi

          echo "Duration calculation : VALID"

          echo "======================================"


      # ==========================================================
      # 08. VALIDATE MOTION TYPES
      #
      # The renderer explicitly accepts these motion modes:
      #
      # zoom_in
      # zoom_out
      # pan_left
      # pan_right
      # static
      # ==========================================================

      - name: Validate per-scene motion
        run: |
          echo "======================================"
          echo "PER-SCENE MOTION VALIDATION"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            MOTION=$(jq -r ".scenes[$INDEX].motion" scene_config.json)

            echo "Scene $ID"
            echo "Motion : $MOTION"

            case "$MOTION" in

              zoom_in)
                echo "Motion type accepted: zoom_in"
                ;;

              zoom_out)
                echo "Motion type accepted: zoom_out"
                ;;

              pan_left)
                echo "Motion type accepted: pan_left"
                ;;

              pan_right)
                echo "Motion type accepted: pan_right"
                ;;

              static)
                echo "Motion type accepted: static"
                ;;

              *)
                echo "ERROR: Unsupported motion:"
                echo "$MOTION"
                exit 1
                ;;

            esac

            echo "--------------------------------------"

          done

          echo "======================================"
          echo "ALL MOTION TYPES : VALID"
          echo "======================================"


      # ==========================================================
      # 09. VALIDATE JSON ASSETS
      # ==========================================================

      - name: Validate JSON referenced assets
        run: |
          echo "======================================"
          echo "VALIDATING JSON ASSETS"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do

            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)

            echo "Checking:"
            echo "$IMAGE"

            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: Missing image:"
              echo "$IMAGE"
              exit 1
            fi

            SIZE=$(stat -c%s "$IMAGE")

            echo "Size : $SIZE bytes"

            if [ "$SIZE" -le 0 ]; then
              echo "ERROR: Empty image."
              exit 1
            fi

            echo "--------------------------------------"

          done

          AUDIO=$(jq -r '.audio.file' scene_config.json)

          echo "Checking narration:"
          echo "$AUDIO"

          if [ ! -f "$AUDIO" ]; then
            echo "ERROR: Narration file missing."
            exit 1
          fi

          AUDIO_SIZE=$(stat -c%s "$AUDIO")

          echo "Narration Size : $AUDIO_SIZE bytes"

          if [ "$AUDIO_SIZE" -le 0 ]; then
            echo "ERROR: Narration is empty."
            exit 1
          fi

          echo "======================================"
          echo "ALL ASSETS : VERIFIED"
          echo "======================================"


      # ==========================================================
      # 10. CREATE WORKING DIRECTORIES
      # ==========================================================

      - name: Create working directories
        run: |
          mkdir -p work
          mkdir -p output

          echo "Working directories created."


      # ==========================================================
      # 11. EXTRACT GLOBAL SETTINGS
      # ==========================================================

      - name: Extract JSON global settings
        run: |
          WIDTH=$(jq -r '.project.resolution.width' scene_config.json)
          HEIGHT=$(jq -r '.project.resolution.height' scene_config.json)
          FPS=$(jq -r '.project.fps' scene_config.json)
          TARGET=$(jq -r '.project.total_duration' scene_config.json)
          TRANSITION=$(jq -r '.transition.duration' scene_config.json)

          echo "WIDTH=$WIDTH" >> "$GITHUB_ENV"
          echo "HEIGHT=$HEIGHT" >> "$GITHUB_ENV"
          echo "FPS=$FPS" >> "$GITHUB_ENV"
          echo "TARGET_DURATION=$TARGET" >> "$GITHUB_ENV"
          echo "TRANSITION_DURATION=$TRANSITION" >> "$GITHUB_ENV"

          echo "======================================"
          echo "GLOBAL SETTINGS"
          echo "======================================"
          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "FPS        : $FPS"
          echo "Target     : $TARGET seconds"
          echo "Transition : $TRANSITION seconds"
          echo "======================================"


      # ==========================================================
      # 12. DYNAMICALLY RENDER EACH SCENE
      #
      # THIS IS THE CORE OF TEST 10.
      #
      # The renderer reads:
      #
      # image
      # duration
      # motion
      #
      # and selects the appropriate FFmpeg filter.
      # ==========================================================

      - name: Render scenes using JSON motion
        shell: bash
        run: |
          echo "======================================"
          echo "DYNAMIC PER-SCENE MOTION RENDERER"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          echo "Detected scenes : $SCENE_COUNT"

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)
            DURATION=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            MOTION=$(jq -r ".scenes[$INDEX].motion" scene_config.json)

            echo "--------------------------------------"
            echo "SCENE $ID"
            echo "Image    : $IMAGE"
            echo "Duration : $DURATION seconds"
            echo "Motion   : $MOTION"
            echo "--------------------------------------"

            # Add transition tail to every scene except the last.
            if [ "$INDEX" -lt $((SCENE_COUNT - 1)) ]; then
              SOURCE_DURATION=$(awk \
                "BEGIN {print $DURATION + $TRANSITION_DURATION}"
              )
            else
              SOURCE_DURATION="$DURATION"
            fi

            FRAME_COUNT=$(awk \
              "BEGIN {printf \"%d\", $SOURCE_DURATION * $FPS - 1}"
            )

            OUTPUT="work/scene_${ID}.mp4"

            # ------------------------------------------------------
            # ZOOM IN
            # ------------------------------------------------------

            if [ "$MOTION" = "zoom_in" ]; then

              echo "Applying motion: ZOOM IN"

              ffmpeg \
                -y \
                -loop 1 \
                -i "$IMAGE" \
                -t "$SOURCE_DURATION" \
                -filter_complex "\
                [0:v]scale=2160:3840:force_original_aspect_ratio=increase,\
                crop=2160:3840,\
                zoompan=\
                z='1.0+0.15*(0.5-0.5*cos(PI*on/$FRAME_COUNT))':\
                x='(iw-iw/zoom)*(0.5-0.5*cos(PI*on/$FRAME_COUNT))':\
                y='(ih-ih/zoom)/2':\
                d=1:\
                s=${WIDTH}x${HEIGHT}:\
                fps=${FPS},\
                format=yuv420p[v]" \
                -map "[v]" \
                -c:v libx264 \
                -preset veryfast \
                -pix_fmt yuv420p \
                -r "$FPS" \
                "$OUTPUT"


            # ------------------------------------------------------
            # ZOOM OUT
            # ------------------------------------------------------

            elif [ "$MOTION" = "zoom_out" ]; then

              echo "Applying motion: ZOOM OUT"

              ffmpeg \
                -y \
                -loop 1 \
                -i "$IMAGE" \
                -t "$SOURCE_DURATION" \
                -filter_complex "\
                [0:v]scale=2160:3840:force_original_aspect_ratio=increase,\
                crop=2160:3840,\
                zoompan=\
                z='1.15-0.15*(0.5-0.5*cos(PI*on/$FRAME_COUNT))':\
                x='(iw-iw/zoom)/2':\
                y='(ih-ih/zoom)/2':\
                d=1:\
                s=${WIDTH}x${HEIGHT}:\
                fps=${FPS},\
                format=yuv420p[v]" \
                -map "[v]" \
                -c:v libx264 \
                -preset veryfast \
                -pix_fmt yuv420p \
                -r "$FPS" \
                "$OUTPUT"


            # ------------------------------------------------------
            # PAN LEFT
            # ------------------------------------------------------

            elif [ "$MOTION" = "pan_left" ]; then

              echo "Applying motion: PAN LEFT"

              ffmpeg \
                -y \
                -loop 1 \
                -i "$IMAGE" \
                -t "$SOURCE_DURATION" \
                -filter_complex "\
                [0:v]scale=2160:3840:force_original_aspect_ratio=increase,\
                crop=2160:3840,\
                zoompan=\
                z='1.12':\
                x='(iw-iw/zoom)*(1-on/$FRAME_COUNT)':\
                y='(ih-ih/zoom)/2':\
                d=1:\
                s=${WIDTH}x${HEIGHT}:\
                fps=${FPS},\
                format=yuv420p[v]" \
                -map "[v]" \
                -c:v libx264 \
                -preset veryfast \
                -pix_fmt yuv420p \
                -r "$FPS" \
                "$OUTPUT"


            # ------------------------------------------------------
            # PAN RIGHT
            # ------------------------------------------------------

            elif [ "$MOTION" = "pan_right" ]; then

              echo "Applying motion: PAN RIGHT"

              ffmpeg \
                -y \
                -loop 1 \
                -i "$IMAGE" \
                -t "$SOURCE_DURATION" \
                -filter_complex "\
                [0:v]scale=2160:3840:force_original_aspect_ratio=increase,\
                crop=2160:3840,\
                zoompan=\
                z='1.12':\
                x='(iw-iw/zoom)*(on/$FRAME_COUNT)':\
                y='(ih-ih/zoom)/2':\
                d=1:\
                s=${WIDTH}x${HEIGHT}:\
                fps=${FPS},\
                format=yuv420p[v]" \
                -map "[v]" \
                -c:v libx264 \
                -preset veryfast \
                -pix_fmt yuv420p \
                -r "$FPS" \
                "$OUTPUT"


            # ------------------------------------------------------
            # STATIC
            # ------------------------------------------------------

            elif [ "$MOTION" = "static" ]; then

              echo "Applying motion: STATIC"

              ffmpeg \
                -y \
                -loop 1 \
                -i "$IMAGE" \
                -t "$SOURCE_DURATION" \
                -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=decrease,pad=${WIDTH}:${HEIGHT}:(ow-iw)/2:(oh-ih)/2" \
                -r "$FPS" \
                -c:v libx264 \
                -preset veryfast \
                -pix_fmt yuv420p \
                -an \
                "$OUTPUT"


            else

              echo "ERROR: Unsupported motion type:"
              echo "$MOTION"
              exit 1

            fi

            if [ ! -f "$OUTPUT" ]; then
              echo "ERROR: Scene $ID was not rendered."
              exit 1
            fi

            SIZE=$(stat -c%s "$OUTPUT")

            echo "Scene $ID completed."
            echo "Output : $OUTPUT"
            echo "Size   : $SIZE bytes"

          done

          echo "======================================"
          echo "ALL SCENES RENDERED"
          echo "======================================"


      # ==========================================================
      # 13. VERIFY EACH SCENE
      # ==========================================================

      - name: Verify individual scene outputs
        run: |
          echo "======================================"
          echo "VERIFYING SCENE OUTPUTS"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            FILE="work/scene_${ID}.mp4"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing:"
              echo "$FILE"
              exit 1
            fi

            echo "Scene $ID"
            echo "File : $FILE"

            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1 \
              "$FILE"

            echo "--------------------------------------"

          done

          echo "ALL SCENE OUTPUTS : VERIFIED"


      # ==========================================================
      # 14. BUILD DYNAMIC TRANSITION GRAPH
      # ==========================================================

      - name: Build dynamic transition graph
        shell: bash
        run: |
          echo "======================================"
          echo "BUILDING DYNAMIC TRANSITION GRAPH"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          if [ "$SCENE_COUNT" -eq 1 ]; then

            echo "SINGLE_SCENE" > work/filter_mode.txt

          else

            FIRST_DURATION=$(jq -r '.scenes[0].duration' scene_config.json)

            OFFSET="$FIRST_DURATION"

            FILTER="[0:v][1:v]xfade=transition=fade:duration=${TRANSITION_DURATION}:offset=${OFFSET}[v1]"

            if [ "$SCENE_COUNT" -gt 2 ]; then

              for INDEX in $(seq 2 $((SCENE_COUNT - 1)))
              do

                PREVIOUS_INDEX=$((INDEX - 1))

                PREVIOUS_DURATION=$(jq -r \
                  ".scenes[$PREVIOUS_INDEX].duration" \
                  scene_config.json
                )

                OFFSET=$(awk \
                  "BEGIN {print $OFFSET + $PREVIOUS_DURATION}"
                )

                PREVIOUS_LABEL="v$((INDEX - 1))"
                CURRENT_LABEL="v$INDEX"

                FILTER="${FILTER};[${PREVIOUS_LABEL}][${INDEX}:v]xfade=transition=fade:duration=${TRANSITION_DURATION}:offset=${OFFSET}[${CURRENT_LABEL}]"

              done

            fi

            echo "$FILTER" > work/dynamic_xfade_filter.txt

            echo "--------------------------------------"
            cat work/dynamic_xfade_filter.txt
            echo "--------------------------------------"

            echo "DYNAMIC_FILTER" > work/filter_mode.txt

          fi


      # ==========================================================
      # 15. APPLY DYNAMIC TRANSITIONS
      # ==========================================================

      - name: Apply dynamic transitions
        shell: bash
        run: |
          echo "======================================"
          echo "APPLYING DYNAMIC TRANSITIONS"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          if [ "$SCENE_COUNT" -eq 1 ]; then

            cp work/scene_1.mp4 work/video_core.mp4

          else

            INPUT_ARGS=()

            for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
            do

              ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

              INPUT_ARGS+=(
                -i
                "work/scene_${ID}.mp4"
              )

            done

            FILTER=$(cat work/dynamic_xfade_filter.txt)

            FINAL_LABEL="v$((SCENE_COUNT - 1))"

            ffmpeg \
              -y \
              "${INPUT_ARGS[@]}" \
              -filter_complex "$FILTER" \
              -map "[${FINAL_LABEL}]" \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -r "$FPS" \
              work/video_core.mp4

          fi

          echo "======================================"
          echo "TRANSITIONS COMPLETED"
          echo "======================================"


      # ==========================================================
      # 16. VERIFY CORE VIDEO
      # ==========================================================

      - name: Verify core video
        run: |
          echo "======================================"
          echo "CORE VIDEO VERIFICATION"
          echo "======================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/video_core.mp4

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            work/video_core.mp4

          echo "======================================"
          echo "CORE VIDEO : VERIFIED"
          echo "======================================"


      # ==========================================================
      # 17. CREATE TEST 10 SUBTITLES
      # ==========================================================

      - name: Create test subtitles
        run: |
          echo "======================================"
          echo "CREATING TEST 10 SUBTITLES"
          echo "======================================"

          cat > work/subtitles.srt <<'EOF'
          1
          00:00:00,000 --> 00:00:10,000
          Scene one uses dynamic zoom in.

          2
          00:00:10,000 --> 00:00:25,000
          Scene two uses dynamic zoom out.

          3
          00:00:25,000 --> 00:00:40,000
          Scene three uses dynamic pan left.

          4
          00:00:40,000 --> 00:01:00,000
          Scene four uses dynamic pan right.
          EOF

          cat work/subtitles.srt


      # ==========================================================
      # 18. BURN SUBTITLES
      # ==========================================================

      - name: Burn subtitles
        run: |
          echo "======================================"
          echo "BURNING SUBTITLES"
          echo "======================================"

          ffmpeg \
            -y \
            -i work/video_core.mp4 \
            -vf "subtitles=work/subtitles.srt:force_style='FontName=Arial,FontSize=24,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=150'" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r "$FPS" \
            -an \
            work/video_subtitles.mp4

          echo "Subtitles burned."


      # ==========================================================
      # 19. ADD NARRATION
      # ==========================================================

      - name: Add narration from JSON
        run: |
          echo "======================================"
          echo "ADDING NARRATION"
          echo "======================================"

          AUDIO=$(jq -r '.audio.file' scene_config.json)

          echo "Narration selected from JSON:"
          echo "$AUDIO"

          ffmpeg \
            -y \
            -i work/video_subtitles.mp4 \
            -i "$AUDIO" \
            -filter_complex "[1:a]apad[a]" \
            -map 0:v:0 \
            -map "[a]" \
            -t "$TARGET_DURATION" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output/AICAP_FREE_10_DYNAMIC_SCENE_MOTION.mp4

          echo "Narration added."


      # ==========================================================
      # 20. FINAL VERIFICATION
      # ==========================================================

      - name: Verify final Test 10 video
        run: |
          echo "======================================"
          echo "AICAP FREE RENDER"
          echo "10 — DYNAMIC SCENE MOTION"
          echo "FINAL VERIFICATION"
          echo "======================================"

          VIDEO="output/AICAP_FREE_10_DYNAMIC_SCENE_MOTION.mp4"

          if [ ! -f "$VIDEO" ]; then
            echo "ERROR: Final video was not created."
            exit 1
          fi

          SIZE=$(stat -c%s "$VIDEO")

          echo "Output File : $VIDEO"
          echo "File Size   : $SIZE bytes"

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Final video is empty."
            exit 1
          fi

          echo "--------------------------------------"
          echo "VIDEO STREAM"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "--------------------------------------"
          echo "AUDIO STREAM"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "--------------------------------------"
          echo "FINAL FORMAT"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "======================================"
          echo "EXPECTED"
          echo "======================================"
          echo "Configuration     : JSON"
          echo "Scene Count       : 4"
          echo "Scene 01          : 10 sec / zoom_in"
          echo "Scene 02          : 15 sec / zoom_out"
          echo "Scene 03          : 15 sec / pan_left"
          echo "Scene 04          : 20 sec / pan_right"
          echo "Total Duration    : 60 sec"
          echo "Transitions       : 3 x fade"
          echo "Subtitles         : BURNED IN"
          echo "Narration         : JSON SELECTED"
          echo "Resolution        : 1080x1920"
          echo "FPS               : 30"
