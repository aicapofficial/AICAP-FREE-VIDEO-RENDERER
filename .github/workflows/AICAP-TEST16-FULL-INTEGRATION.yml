          EOF

          cat work/test16-report.txt


      # ==========================================================
      # 23. UPLOAD MP4
      # ==========================================================

      - name: Upload large clear MP4
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-16-FULL-INTEGRATION-MP4
          path: output/AICAP_TEST16_FULL_INTEGRATION.mp4
