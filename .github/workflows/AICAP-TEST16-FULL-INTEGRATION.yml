name: AICAP FREE VIDEO RENDER — TEST 16 — FULL INTEGRATION

on:
  workflow_dispatch:

jobs:
  render-test-16:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 02. INSTALL TOOLS
      # ==========================================================

      - name: Install FFmpeg and jq
        run: |
          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "TEST 16 — FULL INTEGRATION"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

          echo "FFmpeg : INSTALLED"
          echo "jq     : INSTALLED"


      # ==========================================================
      # 03. VERIFY TOOLS
      # ==========================================================

      - name: Verify rendering tools
        run: |
          echo "======================================"
          echo "TOOL VERIFICATION"
          echo "======================================"

          command -v ffmpeg
          command -v jq
          command -v python3

          ffmpeg -version | head -n 1
          jq --version
          python3 --version

          echo "TOOLS : VERIFIED"


      # ==========================================================
      # 04. CREATE TEST JSON
      # ==========================================================

      - name: Create Test 16 JSON
        run: |
          echo "======================================"
          echo "CREATING TEST 16 JSON"
          echo "======================================"

          cat > scene_config.json <<'EOF'
          {
            "project": {
              "name": "AICAP_TEST_16_FULL_INTEGRATION",
              "resolution": {
                "width": 1080,
                "height": 1920
              },
              "fps": 30,
              "total_duration": 60
            },

            "transition": {
              "type": "fade",
              "duration": 1
            },

            "narration": {
              "enabled": true,
              "source": "AI_in_60_Seconds_DEFAULT_20260811_190008.mp3",
              "mode": "timeline_sync",

              "segments": [
                {
                  "id": 1,
                  "start": 0,
                  "duration": 10,
                  "end": 10
                },
                {
                  "id": 2,
                  "start": 10,
                  "duration": 15,
                  "end": 25
                },
                {
                  "id": 3,
                  "start": 25,
                  "duration": 15,
                  "end": 40
                },
                {
                  "id": 4,
                  "start": 40,
                  "duration": 20,
                  "end": 60
                }
              ]
            },

            "scenes": [

              {
                "id": 1,
                "image": "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg",
                "start": 0,
                "duration": 10,
                "end": 10,
                "motion": "zoom_in",

                "subtitle": {
                  "enabled": true,
                  "text": "Artificial intelligence is\nchanging the world.",

                  "style": {
                    "font": "Arial",
                    "size": 80,
                    "color": "#FFFFFF",
                    "bold": true,
                    "italic": false,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1580
                    },

                    "outline": 5,
                    "shadow": 3,
                    "margin": 90
                  }
                }
              },

              {
                "id": 2,
                "image": "AICAP_SECTION10_SCENE02_CLOUDFLARE_20260814_122220.jpg",
                "start": 10,
                "duration": 15,
                "end": 25,
                "motion": "zoom_out",

                "subtitle": {
                  "enabled": true,
                  "text": "It helps people work\nfaster and smarter.",

                  "style": {
                    "font": "Arial",
                    "size": 76,
                    "color": "#FFFF00",
                    "bold": false,
                    "italic": true,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1580
                    },

                    "outline": 5,
                    "shadow": 3,
                    "margin": 90
                  }
                }
              },

              {
                "id": 3,
                "image": "AICAP_SECTION10_SCENE03_CLOUDFLARE_20260814_122224.jpg",
                "start": 25,
                "duration": 15,
                "end": 40,
                "motion": "pan_left",

                "subtitle": {
                  "enabled": true,
                  "text": "Creative tools can turn ideas\ninto powerful stories.",

                  "style": {
                    "font": "Arial",
                    "size": 74,
                    "color": "#00FFFF",
                    "bold": true,
                    "italic": true,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1510
                    },

                    "outline": 5,
                    "shadow": 3,
                    "margin": 90
                  }
                }
              },

              {
                "id": 4,
                "image": "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg",
                "start": 40,
                "duration": 20,
                "end": 60,
                "motion": "pan_right",

                "subtitle": {
                  "enabled": true,
                  "text": "AICAP can bring the complete\nstory together.",

                  "style": {
                    "font": "Arial",
                    "size": 80,
                    "color": "#00FF00",
                    "bold": false,
                    "italic": false,
                    "alignment": 2,

                    "position": {
                      "x": 540,
                      "y": 1580
                    },

                    "outline": 5,
                    "shadow": 3,
                    "margin": 90
                  }
                }
              }
            ]
          }
          EOF

          echo "TEST 16 JSON CREATED"


      # ==========================================================
      # 05. VALIDATE JSON
      # ==========================================================

      - name: Validate JSON
        run: |
          echo "======================================"
          echo "JSON VALIDATION"
          echo "======================================"

          jq empty scene_config.json

          echo "JSON : VALID"


      # ==========================================================
      # 06. READ GLOBAL CONFIGURATION
      # ==========================================================

      - name: Read global configuration
        run: |
          WIDTH=$(jq -r '.project.resolution.width' scene_config.json)
          HEIGHT=$(jq -r '.project.resolution.height' scene_config.json)
          FPS=$(jq -r '.project.fps' scene_config.json)
          TARGET_DURATION=$(jq -r '.project.total_duration' scene_config.json)
          TRANSITION_DURATION=$(jq -r '.transition.duration' scene_config.json)

          echo "WIDTH=$WIDTH" >> "$GITHUB_ENV"
          echo "HEIGHT=$HEIGHT" >> "$GITHUB_ENV"
          echo "FPS=$FPS" >> "$GITHUB_ENV"
          echo "TARGET_DURATION=$TARGET_DURATION" >> "$GITHUB_ENV"
          echo "TRANSITION_DURATION=$TRANSITION_DURATION" >> "$GITHUB_ENV"

          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "FPS        : $FPS"
          echo "Duration   : $TARGET_DURATION"
          echo "Transition : $TRANSITION_DURATION"


      # ==========================================================
      # 07. VALIDATE SCENE TIMELINE
      # ==========================================================

      - name: Validate scene timeline
        run: |
          echo "======================================"
          echo "SCENE TIMELINE VALIDATION"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          EXPECTED_START=0

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            START=$(jq -r ".scenes[$INDEX].start" scene_config.json)
            DURATION=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            END=$(jq -r ".scenes[$INDEX].end" scene_config.json)

            echo "Scene $ID : $START → $END"

            if [ "$START" -ne "$EXPECTED_START" ]; then
              echo "ERROR: Scene $ID start mismatch."
              exit 1
            fi

            CALCULATED_END=$((START + DURATION))

            if [ "$END" -ne "$CALCULATED_END" ]; then
              echo "ERROR: Scene $ID end mismatch."
              exit 1
            fi

            EXPECTED_START=$END
          done

          if [ "$EXPECTED_START" -ne "$TARGET_DURATION" ]; then
            echo "ERROR: Timeline does not equal target duration."
            exit 1
          fi

          echo "SCENE TIMELINE : VALID"


      # ==========================================================
      # 08. VALIDATE NARRATION TIMELINE
      # ==========================================================

      - name: Validate narration timeline
        run: |
          echo "======================================"
          echo "NARRATION TIMELINE VALIDATION"
          echo "======================================"

          COUNT=$(jq '.narration.segments | length' scene_config.json)

          EXPECTED_START=0

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            ID=$(jq -r ".narration.segments[$INDEX].id" scene_config.json)
            START=$(jq -r ".narration.segments[$INDEX].start" scene_config.json)
            DURATION=$(jq -r ".narration.segments[$INDEX].duration" scene_config.json)
            END=$(jq -r ".narration.segments[$INDEX].end" scene_config.json)

            echo "Narration $ID : $START → $END"

            if [ "$START" -ne "$EXPECTED_START" ]; then
              echo "ERROR: Narration start mismatch."
              exit 1
            fi

            CALCULATED_END=$((START + DURATION))

            if [ "$END" -ne "$CALCULATED_END" ]; then
              echo "ERROR: Narration end mismatch."
              exit 1
            fi

            EXPECTED_START=$END
          done

          if [ "$EXPECTED_START" -ne "$TARGET_DURATION" ]; then
            echo "ERROR: Narration timeline mismatch."
            exit 1
          fi

          echo "NARRATION TIMELINE : VALID"


      # ==========================================================
      # 09. SCENE / NARRATION SYNC
      # ==========================================================

      - name: Verify scene narration synchronization
        run: |
          echo "======================================"
          echo "SCENE / NARRATION SYNCHRONIZATION"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)
          NARRATION_COUNT=$(jq '.narration.segments | length' scene_config.json)

          if [ "$SCENE_COUNT" -ne "$NARRATION_COUNT" ]; then
            echo "ERROR: Scene and narration counts differ."
            exit 1
          fi

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do
            SCENE_START=$(jq -r ".scenes[$INDEX].start" scene_config.json)
            SCENE_END=$(jq -r ".scenes[$INDEX].end" scene_config.json)

            NARR_START=$(jq -r ".narration.segments[$INDEX].start" scene_config.json)
            NARR_END=$(jq -r ".narration.segments[$INDEX].end" scene_config.json)

            if [ "$SCENE_START" -ne "$NARR_START" ]; then
              echo "ERROR: Start mismatch."
              exit 1
            fi

            if [ "$SCENE_END" -ne "$NARR_END" ]; then
              echo "ERROR: End mismatch."
              exit 1
            fi
          done

          echo "SCENE / NARRATION SYNC : VALID"


      # ==========================================================
      # 10. VERIFY LARGE SUBTITLE SETTINGS
      # ==========================================================

      - name: Verify large subtitle settings
        run: |
          echo "======================================"
          echo "LARGE SUBTITLE SETTINGS"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            SIZE=$(jq -r ".scenes[$INDEX].subtitle.style.size" scene_config.json)
            COLOR=$(jq -r ".scenes[$INDEX].subtitle.style.color" scene_config.json)

            echo "Scene $ID"
            echo "Font size : $SIZE"
            echo "Color     : $COLOR"

            if [ "$SIZE" -lt 70 ]; then
              echo "ERROR: Subtitle size is below 70."
              exit 1
            fi

          done

          echo "LARGE SUBTITLE SETTINGS : VERIFIED"


      # ==========================================================
      # 11. VERIFY ASSETS
      # ==========================================================

      - name: Verify assets
        run: |
          echo "======================================"
          echo "ASSET VERIFICATION"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)

            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: Missing image: $IMAGE"
              exit 1
            fi

            echo "FOUND: $IMAGE"
          done

          AUDIO=$(jq -r '.narration.source' scene_config.json)

          if [ ! -f "$AUDIO" ]; then
            echo "ERROR: Missing audio: $AUDIO"
            exit 1
          fi

          echo "FOUND: $AUDIO"

          mkdir -p work
          mkdir -p output

          echo "ASSETS : VERIFIED"


      # ==========================================================
      # 12. VERIFY NARRATION SOURCE
      # ==========================================================

      - name: Verify narration source and prepare looping strategy
        run: |
          set -e

          AUDIO=$(jq -r '.narration.source' scene_config.json)
          TARGET=$(jq -r '.project.total_duration' scene_config.json)

          AUDIO_DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$AUDIO")

          echo "Source narration duration : ${AUDIO_DURATION}s"
          echo "Required final duration   : ${TARGET}s"
          echo "Audio strategy             : LOOP SOURCE TO FULL TIMELINE"

          if ! awk -v a="$AUDIO_DURATION" 'BEGIN { exit !(a > 0) }'; then
            echo "ERROR: Narration source has no usable duration."
            exit 1
          fi

          echo "NARRATION SOURCE : VERIFIED"
          echo "NARRATION LOOPING : REQUIRED FOR FULL 60s"


      # ==========================================================
      # 13. RENDER SCENES
      # ==========================================================

      - name: Render scenes
        shell: bash
        run: |
          echo "======================================"
          echo "RENDERING SCENES"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)
            DURATION=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            MOTION=$(jq -r ".scenes[$INDEX].motion" scene_config.json)

            if [ "$INDEX" -lt $((COUNT - 1)) ]; then
              RENDER_DURATION=$((DURATION + TRANSITION_DURATION))
            else
              RENDER_DURATION="$DURATION"
            fi

            OUTPUT="work/scene_${ID}.mp4"

            echo "--------------------------------------"
            echo "Scene    : $ID"
            echo "Duration : $DURATION"
            echo "Render   : $RENDER_DURATION"
            echo "Motion   : $MOTION"
            echo "--------------------------------------"

            case "$MOTION" in

              zoom_in)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='min(pzoom+0.004,1.15)':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              zoom_out)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='if(eq(on,0),1.15,max(pzoom-0.003,1.0))':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              pan_left)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='1.10':x='(iw-iw/zoom)*(1-on/(30*${RENDER_DURATION}))':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              pan_right)

                ffmpeg -y \
                  -loop 1 \
                  -framerate 30 \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='1.10':x='(iw-iw/zoom)*(on/(30*${RENDER_DURATION}))':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"
                ;;

              *)

                echo "ERROR: Unsupported motion: $MOTION"
                exit 1
                ;;

            esac

            if [ ! -f "$OUTPUT" ]; then
              echo "ERROR: Scene $ID was not rendered."
              exit 1
            fi

            SIZE=$(stat -c%s "$OUTPUT")

            if [ "$SIZE" -le 0 ]; then
              echo "ERROR: Scene $ID output is empty."
              exit 1
            fi

            echo "Scene $ID : RENDERED"

          done

          echo "ALL SCENES : RENDERED"



      # ==========================================================
      # 13. VERIFY ACTUAL SCENE MOTION
      # ==========================================================

      - name: Verify actual scene motion
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ACTUAL SCENE MOTION VERIFICATION"
          echo "======================================"

          verify_motion() {
            SCENE="$1"
            EXPECTED="$2"
            FILE="work/scene_${SCENE}.mp4"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Scene $SCENE output missing."
              exit 1
            fi

            ffmpeg -y -v error \
              -i "$FILE" \
              -frames:v 1 \
              "work/scene_${SCENE}_first.jpg"

            ffmpeg -y -v error \
              -sseof -0.10 \
              -i "$FILE" \
              -frames:v 1 \
              "work/scene_${SCENE}_last.jpg"

            SSIM_LINE=$(ffmpeg -v error \
              -i "work/scene_${SCENE}_first.jpg" \
              -i "work/scene_${SCENE}_last.jpg" \
              -lavfi "ssim=stats_file=-" \
              -f null - 2>&1 | grep "All:" | tail -n 1 || true)

            SSIM=$(echo "$SSIM_LINE" | sed -n 's/.*Y:\([0-9.]*\).*/\1/p')

            echo "Scene $SCENE"
            echo "Expected motion : $EXPECTED"
            echo "SSIM first/last : ${SSIM:-UNAVAILABLE}"

            if [ -z "$SSIM" ]; then
              echo "ERROR: Could not calculate motion comparison."
              exit 1
            fi

            if awk -v s="$SSIM" 'BEGIN { exit !(s >= 0.998) }'; then
              echo "ERROR: Scene $SCENE appears visually static."
              echo "Expected actual motion: $EXPECTED"
              exit 1
            fi

            echo "Scene $SCENE motion : VERIFIED"
            echo ""
          }

          verify_motion 1 "ZOOM IN"
          verify_motion 2 "ZOOM OUT"
          verify_motion 3 "PAN LEFT"
          verify_motion 4 "PAN RIGHT"

          echo "======================================"
          echo "ALL FOUR SCENE MOTIONS VERIFIED"
          echo "======================================"

      # ==========================================================
      # 14. VERIFY SCENE DURATIONS
      # ==========================================================

      - name: Verify scene video durations
        shell: bash
        run: |
          echo "======================================"
          echo "VERIFYING SCENE DURATIONS"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            if [ "$INDEX" -lt $((COUNT - 1)) ]; then
              EXPECTED=$(( $(jq -r ".scenes[$INDEX].duration" scene_config.json) + TRANSITION_DURATION ))
            else
              EXPECTED=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            fi

            ACTUAL=$(ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "work/scene_${ID}.mp4")

            echo "Scene $ID"
            echo "Expected : ${EXPECTED}s"
            echo "Actual   : ${ACTUAL}s"

            if ! awk -v actual="$ACTUAL" -v expected="$EXPECTED" \
              'BEGIN { exit !(actual >= expected-0.15 && actual <= expected+0.15) }'
            then
              echo "ERROR: Scene $ID duration outside tolerance."
              exit 1
            fi

          done

          echo "SCENE DURATIONS : VERIFIED"


      # ==========================================================
      # 15. BUILD TRANSITIONS
      # ==========================================================

      - name: Build timeline transitions
        shell: bash
        run: |
          echo "======================================"
          echo "BUILDING TIMELINE TRANSITIONS"
          echo "======================================"

          COUNT=$(jq '.scenes | length' scene_config.json)

          INPUT_ARGS=()

          for INDEX in $(seq 0 $((COUNT - 1)))
          do
            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            INPUT_ARGS+=(
              -i
              "work/scene_${ID}.mp4"
            )
          done

          FILTER=""

          for INDEX in $(seq 1 $((COUNT - 1)))
          do

            PREVIOUS_INDEX=$((INDEX - 1))

            if [ "$INDEX" -eq 1 ]; then
              PREVIOUS_LABEL="[0:v]"
            else
              PREVIOUS_LABEL="[v${PREVIOUS_INDEX}]"
            fi

            CURRENT_START=$(jq -r ".scenes[$INDEX].start" scene_config.json)

            FILTER="${FILTER}${PREVIOUS_LABEL}[${INDEX}:v]xfade=transition=fade:duration=${TRANSITION_DURATION}:offset=${CURRENT_START}[v${INDEX}];"

          done

          FINAL_LABEL="[v$((COUNT - 1))]"

          ffmpeg -y \
            "${INPUT_ARGS[@]}" \
            -filter_complex "$FILTER" \
            -map "$FINAL_LABEL" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -an \
            work/video_core.mp4

          echo "TRANSITIONS : COMPLETE"


      # ==========================================================
      # 15. VERIFY CORE VIDEO
      # ==========================================================

      - name: Verify core video
        run: |
          echo "======================================"
          echo "CORE VIDEO VERIFICATION"
          echo "======================================"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/video_core.mp4

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            work/video_core.mp4

          echo "CORE VIDEO : VALID"


      # ==========================================================
      # 16. GENERATE ASS DIRECTLY WITH PYTHON
      # ==========================================================

      - name: Generate large clear ASS subtitles
        shell: bash
        run: |
          echo "======================================"
          echo "GENERATING LARGE CLEAR ASS SUBTITLES"
          echo "======================================"

          python3 <<'PY'
          import json
          from pathlib import Path

          with open("scene_config.json", "r", encoding="utf-8") as f:
              config = json.load(f)

          Path("work").mkdir(exist_ok=True)

          # Exact ASS BGR colour values.
          ASS_COLORS = {
              "#FFFFFF": "&H00FFFFFF",
              "#FFFF00": "&H0000FFFF",
              "#00FFFF": "&H00FFFF00",
              "#00FF00": "&H0000FF00"
          }

          def ass_time(seconds):
              hours = int(seconds // 3600)
              minutes = int((seconds % 3600) // 60)
              secs = seconds % 60
              return f"{hours}:{minutes:02d}:{secs:05.2f}"

          lines = [
              "[Script Info]",
              "ScriptType: v4.00+",
              "PlayResX: 1080",
              "PlayResY: 1920",
              "ScaledBorderAndShadow: yes",
              "WrapStyle: 0",
              "",
              "[V4+ Styles]",
              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",
              "Default,Arial,120,&H00FFFFFF,&H00FFFFFF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,5,3,2,90,90,100,1",
              "",
              "[Events]",
              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"
          ]

          for scene in config["scenes"]:

              subtitle = scene["subtitle"]

              if not subtitle.get("enabled", False):
                  continue

              style = subtitle["style"]

              scene_id = scene["id"]
              text = subtitle["text"]

              size = int(style["size"])
              color_hex = style["color"].upper()

              if color_hex not in ASS_COLORS:
                  raise ValueError(
                      f"Unsupported subtitle colour in Scene {scene_id}: {color_hex}"
                  )

              ass_color = ASS_COLORS[color_hex]

              bold = 1 if style.get("bold", False) else 0
              italic = 1 if style.get("italic", False) else 0

              x = int(style["position"]["x"])
              y = int(style["position"]["y"])

              outline = int(style.get("outline", 5))
              shadow = int(style.get("shadow", 3))

              start = ass_time(scene["start"])
              end = ass_time(scene["end"])

              # Escape ASS special braces in user text.
              text = text.replace("{", r"\{").replace("}", r"\}")
              text = text.replace("\n", r"\N")

              inline = (
                  f"{{\\fs{size}"
                  f"\\c{ass_color}"
                  f"\\b{bold}"
                  f"\\i{italic}"
                  f"\\bord{outline}"
                  f"\\shad{shadow}"
                  f"\\q2"
                  f"\\pos({x},{y})}}"
              )

              dialogue = (
                  f"Dialogue: 0,{start},{end},Default,,0,0,0,,"
                  f"{inline}{text}"
              )

              lines.append(dialogue)

              print(f"Scene {scene_id}")
              print(f"  Font size : {size}")
              print(f"  Colour    : {color_hex}")
              print(f"  ASS color : {ass_color}")
              print(f"  Bold      : {bold}")
              print(f"  Italic    : {italic}")
              print(f"  Position  : {x},{y}")
              print()

          ass_path = Path("work/subtitles.ass")

          ass_path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("======================================")
          print("GENERATED ASS FILE")
          print("======================================")

          print(ass_path.read_text(encoding="utf-8"))
          PY

          echo "ASS GENERATION : COMPLETE"

      # ==========================================================
      # 18. ROBUST ASS VALIDATION
      # ==========================================================

      - name: Validate generated ASS
        shell: bash
        run: |
          echo "======================================"
          echo "ROBUST ASS VALIDATION"
          echo "======================================"

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("work/subtitles.ass")

          if not path.exists():
              print("ERROR: subtitles.ass does not exist.")
              raise SystemExit(1)

          text = path.read_text(encoding="utf-8")

          dialogue = [
              line for line in text.splitlines()
              if line.startswith("Dialogue:")
          ]

          print(f"Dialogue events : {len(dialogue)}")

          if len(dialogue) != 4:
              print("ERROR: Expected exactly 4 Dialogue events.")
              raise SystemExit(1)

          for scene_number, line in enumerate(dialogue, start=1):
              if r"\N" not in line:
                  print(f"ERROR: Scene {scene_number} subtitle line break missing.")
                  raise SystemExit(1)
              print(f"Scene {scene_number} line breaks : VERIFIED")

          expected = [
              {
                  "size": "80",
                  "color": "FFFFFF",
                  "bold": "1",
                  "italic": "0"
              },
              {
                  "size": "76",
                  "color": "FFFF00",
                  "bold": "0",
                  "italic": "1"
              },
              {
                  "size": "74",
                  "color": "00FFFF",
                  "bold": "1",
                  "italic": "1"
              },
              {
                  "size": "80",
                  "color": "00FF00",
                  "bold": "0",
                  "italic": "0"
              }
          ]

          for number, (line, wanted) in enumerate(
              zip(dialogue, expected),
              start=1
          ):

              print("")
              print("--------------------------------------")
              print(f"Scene {number}")
              print("--------------------------------------")

              print("Dialogue:")
              print(line)

              # --------------------------------------------------
              # FONT SIZE
              # --------------------------------------------------

              size_match = re.search(r"\\fs(\d+)", line)

              if not size_match:
                  print("ERROR: Font size command missing.")
                  raise SystemExit(1)

              actual_size = size_match.group(1)

              if actual_size != wanted["size"]:
                  print(
                      f"ERROR: Expected font size "
                      f"{wanted['size']}, found {actual_size}."
                  )
                  raise SystemExit(1)

              print(f"Font size : {actual_size}px VERIFIED")

              # --------------------------------------------------
              # COLOR
              # --------------------------------------------------

              color_match = re.search(
                  r"\\c&H([0-9A-Fa-f]{8})",
                  line
              )

              if not color_match:
                  print("ERROR: ASS colour command missing.")
                  raise SystemExit(1)

              actual_ass_color = color_match.group(1).upper()

              rgb = wanted["color"].upper()

              expected_ass_color = (
                  "00"
                  + rgb[4:6]
                  + rgb[2:4]
                  + rgb[0:2]
              )

              if actual_ass_color != expected_ass_color:
                  print(
                      f"ERROR: Expected ASS colour "
                      f"{expected_ass_color}, "
                      f"found {actual_ass_color}."
                  )
                  raise SystemExit(1)

              print(
                  f"Colour    : #{rgb} "
                  f"(ASS {actual_ass_color}) VERIFIED"
              )

              # --------------------------------------------------
              # BOLD
              # --------------------------------------------------

              bold_match = re.search(r"\\b([01])", line)

              if not bold_match:
                  print("ERROR: Bold command missing.")
                  raise SystemExit(1)

              actual_bold = bold_match.group(1)

              if actual_bold != wanted["bold"]:
                  print(
                      f"ERROR: Expected bold "
                      f"{wanted['bold']}, found {actual_bold}."
                  )
                  raise SystemExit(1)

              print(f"Bold      : {actual_bold} VERIFIED")

              # --------------------------------------------------
              # ITALIC
              # --------------------------------------------------

              italic_match = re.search(r"\\i([01])", line)

              if not italic_match:
                  print("ERROR: Italic command missing.")
                  raise SystemExit(1)

              actual_italic = italic_match.group(1)

              if actual_italic != wanted["italic"]:
                  print(
                      f"ERROR: Expected italic "
                      f"{wanted['italic']}, found {actual_italic}."
                  )
                  raise SystemExit(1)

              print(f"Italic    : {actual_italic} VERIFIED")

              # --------------------------------------------------
              # OUTLINE
              # --------------------------------------------------

              if not re.search(r"\\bord5(?:\D|$)", line):
                  print("ERROR: Outline command missing.")
                  raise SystemExit(1)

              print("Outline   : 5 VERIFIED")

              # --------------------------------------------------
              # SHADOW
              # --------------------------------------------------

              if not re.search(r"\\shad3(?:\D|$)", line):
                  print("ERROR: Shadow command missing.")
                  raise SystemExit(1)

              print("Shadow    : 3 VERIFIED")

              # --------------------------------------------------
              # POSITION
              # --------------------------------------------------

              if not re.search(
                  r"\\pos\(540,1510\)|\\pos\(540,1580\)",
                  line
              ):
                  print("ERROR: Position command missing.")
                  raise SystemExit(1)

              print("Position  : VERIFIED")

          print("")
          print("======================================")
          print("ASS FORMAT : FULLY VERIFIED")
          print("======================================")
          PY
          
      # ==========================================================
      # 18. BURN SUBTITLES
      # ==========================================================

      - name: Burn large clear subtitles
        run: |
          echo "======================================"
          echo "BURNING LARGE CLEAR SUBTITLES"
          echo "======================================"

          ffmpeg -y \
            -i work/video_core.mp4 \
            -vf "ass=work/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -an \
            work/video_subtitles.mp4

          echo "SUBTITLES : BURNED"


      # ==========================================================
      # 19. VERIFY SUBTITLE VIDEO
      # ==========================================================

      - name: Verify subtitled video
        run: |
          echo "======================================"
          echo "SUBTITLE VIDEO VERIFICATION"
          echo "======================================"

          if [ ! -f work/video_subtitles.mp4 ]; then
            echo "ERROR: Subtitle video missing."
            exit 1
          fi

          SIZE=$(stat -c%s work/video_subtitles.mp4)

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Subtitle video is empty."
            exit 1
          fi

          echo "Subtitle video : $SIZE bytes"
          echo "SUBTITLE VIDEO : VALID"


      # ==========================================================
      # 20. ADD NARRATION
      # ==========================================================

      - name: Add narration
        run: |
          echo "======================================"
          echo "ADDING NARRATION"
          echo "======================================"

          AUDIO=$(jq -r '.narration.source' scene_config.json)

          SOURCE_DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$AUDIO")

          echo "Source narration : ${SOURCE_DURATION}s"
          echo "Final timeline   : ${TARGET_DURATION}s"
          echo "Looping source narration until the complete timeline is filled."

          ffmpeg -y \
            -i work/video_subtitles.mp4 \
            -stream_loop -1 \
            -i "$AUDIO" \
            -map 0:v:0 \
            -map 1:a:0 \
            -t "$TARGET_DURATION" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output/AICAP_TEST16_FULL_INTEGRATION.mp4

          echo "NARRATION : ADDED AS ONE CONTINUOUS LOOPED TRACK"


      # ==========================================================
      # 21. VERIFY ONE CONTINUOUS NARRATION TRACK
      # ==========================================================

      - name: Verify continuous narration across all four scenes
        shell: bash
        run: |
          set -e

          VIDEO="output/AICAP_TEST16_FULL_INTEGRATION.mp4"

          AUDIO_STREAMS=$(ffprobe -v error -select_streams a \
            -show_entries stream=index -of csv=p=0 "$VIDEO" | wc -l)

          if [ "$AUDIO_STREAMS" -ne 1 ]; then
            echo "ERROR: Expected exactly one continuous narration stream; found $AUDIO_STREAMS."
            exit 1
          fi

          AUDIO_DURATION=$(ffprobe -v error -select_streams a:0 \
            -show_entries stream=duration \
            -of default=noprint_wrappers=1:nokey=1 "$VIDEO")

          echo "Audio streams : $AUDIO_STREAMS"
          echo "Audio duration: ${AUDIO_DURATION}s"

          if ! awk -v a="$AUDIO_DURATION" 'BEGIN { exit !(a >= 59.5) }'; then
            echo "ERROR: Final audio does not cover the complete timeline."
            exit 1
          fi

          for RANGE in "0 10 1" "10 15 2" "25 15 3" "40 20 4"; do
            set -- $RANGE
            START=$1
            LENGTH=$2
            SCENE=$3

            PACKETS=$(ffprobe -v error \
              -read_intervals "${START}%+${LENGTH}" \
              -select_streams a:0 \
              -show_entries packet=pts_time \
              -of csv=p=0 "$VIDEO" | head -n 1)

            if [ -z "$PACKETS" ]; then
              echo "ERROR: No audio packets found in Scene $SCENE interval ($START-$((START+LENGTH))s)."
              exit 1
            fi

            echo "Scene $SCENE audio interval : VERIFIED"
          done

          echo "ONE CONTINUOUS AUDIO STREAM : VERIFIED"
          echo "AUDIO SCENE 1 : VERIFIED"
          echo "AUDIO SCENE 2 : VERIFIED"
          echo "AUDIO SCENE 3 : VERIFIED"
          echo "AUDIO SCENE 4 : VERIFIED"


      # ==========================================================
      # 23. FINAL VALIDATION
      # ==========================================================

      - name: Validate final video
        run: |
          echo "======================================"
          echo "FINAL VIDEO VALIDATION"
          echo "======================================"

          VIDEO="output/AICAP_TEST16_FULL_INTEGRATION.mp4"

          if [ ! -f "$VIDEO" ]; then
            echo "ERROR: Final MP4 missing."
            exit 1
          fi

          SIZE=$(stat -c%s "$VIDEO")

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Final MP4 is empty."
            exit 1
          fi

          echo "File size : $SIZE bytes"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,duration \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "FINAL VIDEO : VALID"


      # ==========================================================
      # 24. CREATE REPORT
      # ==========================================================

      - name: Create Test 16 report
        run: |
          cat > work/test16-report.txt <<'EOF'
