name: AICAP FREE RENDER — 09 — DYNAMIC SCENE COUNT

on:
  workflow_dispatch:

jobs:
  render-test-09:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 02. INSTALL FFMPEG + JQ
      # ==========================================================

      - name: Install FFmpeg and jq
        run: |
          echo "======================================"
          echo "AICAP FREE RENDER"
          echo "09 — DYNAMIC SCENE COUNT"
          echo "======================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

          echo "FFmpeg installed."
          echo "jq installed."


      # ==========================================================
      # 03. VERIFY TOOLS
      # ==========================================================

      - name: Verify rendering tools
        run: |
          echo "======================================"
          echo "TOOL VERIFICATION"
          echo "======================================"

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg : AVAILABLE"
            echo "Path   : $(which ffmpeg)"
          else
            echo "FFmpeg : NOT AVAILABLE"
            exit 1
          fi

          if command -v jq >/dev/null 2>&1; then
            echo "jq     : AVAILABLE"
            echo "Path   : $(which jq)"
          else
            echo "jq     : NOT AVAILABLE"
            exit 1
          fi

          echo "======================================"
          echo "TOOLS : VERIFIED"
          echo "======================================"


      # ==========================================================
      # 04. DEFINE REAL AICAP ASSETS
      # ==========================================================

      - name: Define AICAP assets
        run: |
          echo "======================================"
          echo "REAL AICAP ASSETS"
          echo "======================================"

          echo "Scene 01:"
          echo "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg"

          echo "Scene 02:"
          echo "AICAP_SECTION10_SCENE02_CLOUDFLARE_20260814_122220.jpg"

          echo "Scene 03:"
          echo "AICAP_SECTION10_SCENE03_CLOUDFLARE_20260814_122224.jpg"

          echo "Scene 04:"
          echo "REUSES SCENE 01 IMAGE FOR DYNAMIC COUNT TEST"

          echo "Narration:"
          echo "AI_in_60_Seconds_DEFAULT_20260811_190008.mp3"


      # ==========================================================
      # 05. CREATE DYNAMIC 4-SCENE JSON
      #
      # IMPORTANT:
      #
      # There is NO hard-coded scene count in the renderer.
      #
      # The renderer will discover:
      #
      # .scenes | length
      #
      # and automatically process all scenes.
      #
      # Scene durations:
      #
      # 10 + 15 + 15 + 20 = 60 seconds
      # ==========================================================

      - name: Create dynamic 4 scene JSON
        run: |
          echo "======================================"
          echo "CREATING TEST 09 JSON"
          echo "======================================"

          cat > scene_config.json <<'EOF'
          {
            "project": {
              "name": "AICAP_TEST_09_DYNAMIC_SCENE_COUNT",
              "resolution": {
                "width": 1080,
                "height": 1920
              },
              "fps": 30,
              "total_duration": 60
            },

            "transition": {
              "type": "fade",
              "duration": 1
            },

            "audio": {
              "file": "AI_in_60_Seconds_DEFAULT_20260811_190008.mp3"
            },

            "scenes": [
              {
                "id": 1,
                "image": "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg",
                "duration": 10,
                "motion": "zoom_in"
              },

              {
                "id": 2,
                "image": "AICAP_SECTION10_SCENE02_CLOUDFLARE_20260814_122220.jpg",
                "duration": 15,
                "motion": "zoom_in"
              },

              {
                "id": 3,
                "image": "AICAP_SECTION10_SCENE03_CLOUDFLARE_20260814_122224.jpg",
                "duration": 15,
                "motion": "zoom_in"
              },

              {
                "id": 4,
                "image": "AICAP_SECTION10_SCENE01_CLOUDFLARE_20260814_122215.jpg",
                "duration": 20,
                "motion": "zoom_in"
              }
            ]
          }
          EOF

          echo "--------------------------------------"
          echo "TEST 09 JSON"
          echo "--------------------------------------"

          cat scene_config.json

          echo "======================================"
          echo "JSON CREATED"
          echo "======================================"


      # ==========================================================
      # 06. VALIDATE JSON
      # ==========================================================

      - name: Validate JSON configuration
        run: |
          echo "======================================"
          echo "JSON VALIDATION"
          echo "======================================"

          jq empty scene_config.json

          echo "JSON syntax : VALID"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          echo "Detected Scene Count : $SCENE_COUNT"

          if [ "$SCENE_COUNT" -lt 1 ]; then
            echo "ERROR: Scene count must be at least 1."
            exit 1
          fi

          WIDTH=$(jq -r '.project.resolution.width' scene_config.json)
          HEIGHT=$(jq -r '.project.resolution.height' scene_config.json)
          FPS=$(jq -r '.project.fps' scene_config.json)
          TOTAL=$(jq -r '.project.total_duration' scene_config.json)
          TRANSITION=$(jq -r '.transition.duration' scene_config.json)

          echo "Width              : $WIDTH"
          echo "Height             : $HEIGHT"
          echo "FPS                : $FPS"
          echo "Target Duration    : $TOTAL"
          echo "Transition         : $TRANSITION seconds"

          echo "======================================"
          echo "JSON : VALID"
          echo "======================================"


      # ==========================================================
      # 07. CALCULATE SCENE TOTAL FROM JSON
      # ==========================================================

      - name: Calculate dynamic scene timing
        run: |
          echo "======================================"
          echo "DYNAMIC SCENE TIMING"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          SCENE_TOTAL=$(jq '[.scenes[].duration] | add' scene_config.json)

          TARGET_TOTAL=$(jq '.project.total_duration' scene_config.json)

          echo "Detected Scene Count : $SCENE_COUNT"
          echo "Scene Duration Sum   : $SCENE_TOTAL seconds"
          echo "Target Duration      : $TARGET_TOTAL seconds"

          if [ "$SCENE_TOTAL" -ne "$TARGET_TOTAL" ]; then
            echo "ERROR: Scene durations do not equal target duration."
            exit 1
          fi

          echo "Scene duration calculation : VALID"

          echo "======================================"


      # ==========================================================
      # 08. PRINT EVERY SCENE DYNAMICALLY
      # ==========================================================

      - name: Read all scenes dynamically
        run: |
          echo "======================================"
          echo "DYNAMIC SCENE DISCOVERY"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          echo "Renderer discovered $SCENE_COUNT scenes."
          echo "--------------------------------------"

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)
            DURATION=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            MOTION=$(jq -r ".scenes[$INDEX].motion" scene_config.json)

            echo "Scene ID : $ID"
            echo "Image    : $IMAGE"
            echo "Duration : $DURATION seconds"
            echo "Motion   : $MOTION"
            echo "--------------------------------------"

          done

          echo "======================================"
          echo "DYNAMIC SCENE DISCOVERY COMPLETE"
          echo "======================================"


      # ==========================================================
      # 09. VALIDATE JSON REFERENCED FILES
      # ==========================================================

      - name: Validate JSON assets
        run: |
          echo "======================================"
          echo "VALIDATING JSON ASSETS"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do

            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)

            echo "Checking:"
            echo "$IMAGE"

            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: Missing image:"
              echo "$IMAGE"
              exit 1
            fi

            SIZE=$(stat -c%s "$IMAGE")

            echo "Size: $SIZE bytes"

            if [ "$SIZE" -le 0 ]; then
              echo "ERROR: Empty image."
              exit 1
            fi

            echo "--------------------------------------"

          done

          AUDIO=$(jq -r '.audio.file' scene_config.json)

          echo "Checking narration:"
          echo "$AUDIO"

          if [ ! -f "$AUDIO" ]; then
            echo "ERROR: Narration file missing."
            exit 1
          fi

          AUDIO_SIZE=$(stat -c%s "$AUDIO")

          echo "Narration Size: $AUDIO_SIZE bytes"

          if [ "$AUDIO_SIZE" -le 0 ]; then
            echo "ERROR: Narration is empty."
            exit 1
          fi

          echo "======================================"
          echo "ALL JSON ASSETS : VERIFIED"
          echo "======================================"


      # ==========================================================
      # 10. CREATE WORKING DIRECTORIES
      # ==========================================================

      - name: Create working directories
        run: |
          mkdir -p work
          mkdir -p output

          echo "Working directories created."


      # ==========================================================
      # 11. EXTRACT GLOBAL JSON SETTINGS
      # ==========================================================

      - name: Extract JSON settings
        run: |
          WIDTH=$(jq -r '.project.resolution.width' scene_config.json)
          HEIGHT=$(jq -r '.project.resolution.height' scene_config.json)
          FPS=$(jq -r '.project.fps' scene_config.json)
          TARGET=$(jq -r '.project.total_duration' scene_config.json)
          TRANSITION=$(jq -r '.transition.duration' scene_config.json)

          echo "WIDTH=$WIDTH" >> "$GITHUB_ENV"
          echo "HEIGHT=$HEIGHT" >> "$GITHUB_ENV"
          echo "FPS=$FPS" >> "$GITHUB_ENV"
          echo "TARGET_DURATION=$TARGET" >> "$GITHUB_ENV"
          echo "TRANSITION_DURATION=$TRANSITION" >> "$GITHUB_ENV"

          echo "======================================"
          echo "GLOBAL SETTINGS"
          echo "======================================"
          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "FPS        : $FPS"
          echo "Target     : $TARGET seconds"
          echo "Transition : $TRANSITION seconds"
          echo "======================================"


      # ==========================================================
      # 12. DYNAMICALLY RENDER EVERY SCENE
      #
      # This is the CORE of Test 09.
      #
      # The loop does NOT know beforehand whether there are
      # 3, 4, 5, 6 or more scenes.
      #
      # It simply reads .scenes[] from JSON.
      # ==========================================================

      - name: Dynamically render every scene
        shell: bash
        run: |
          echo "======================================"
          echo "DYNAMIC SCENE RENDERER"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          echo "Scenes discovered: $SCENE_COUNT"
          echo "======================================"

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)
            IMAGE=$(jq -r ".scenes[$INDEX].image" scene_config.json)
            DURATION=$(jq -r ".scenes[$INDEX].duration" scene_config.json)
            MOTION=$(jq -r ".scenes[$INDEX].motion" scene_config.json)

            echo "--------------------------------------"
            echo "RENDERING SCENE $ID"
            echo "Image    : $IMAGE"
            echo "Duration : $DURATION"
            echo "Motion   : $MOTION"
            echo "--------------------------------------"

            # Every scene except the final scene receives an
            # additional transition-duration tail.
            if [ "$INDEX" -lt $((SCENE_COUNT - 1)) ]; then
              SOURCE_DURATION=$(awk "BEGIN {print $DURATION + $TRANSITION_DURATION}")
            else
              SOURCE_DURATION="$DURATION"
            fi

            FRAME_COUNT=$(awk \
              "BEGIN {printf \"%d\", $SOURCE_DURATION * $FPS - 1}"
            )

            OUTPUT="work/scene_${ID}.mp4"

            if [ "$MOTION" = "zoom_in" ]; then

              ffmpeg \
                -y \
                -loop 1 \
                -i "$IMAGE" \
                -t "$SOURCE_DURATION" \
                -filter_complex "\
                [0:v]scale=2160:3840:force_original_aspect_ratio=increase,\
                crop=2160:3840,\
                zoompan=\
                z='1.0+0.15*(0.5-0.5*cos(PI*on/$FRAME_COUNT))':\
                x='(iw-iw/zoom)*(0.5-0.5*cos(PI*on/$FRAME_COUNT))':\
                y='(ih-ih/zoom)/2':\
                d=1:\
                s=${WIDTH}x${HEIGHT}:\
                fps=${FPS},\
                format=yuv420p[v]" \
                -map "[v]" \
                -c:v libx264 \
                -preset veryfast \
                -pix_fmt yuv420p \
                -r "$FPS" \
                "$OUTPUT"

            else

              ffmpeg \
                -y \
                -loop 1 \
                -i "$IMAGE" \
                -t "$SOURCE_DURATION" \
                -vf "scale=${WIDTH}:${HEIGHT}:force_original_aspect_ratio=decrease,pad=${WIDTH}:${HEIGHT}:(ow-iw)/2:(oh-ih)/2" \
                -r "$FPS" \
                -c:v libx264 \
                -preset veryfast \
                -pix_fmt yuv420p \
                -an \
                "$OUTPUT"

            fi

            if [ ! -f "$OUTPUT" ]; then
              echo "ERROR: Scene $ID failed to render."
              exit 1
            fi

            SIZE=$(stat -c%s "$OUTPUT")

            echo "Scene $ID output:"
            echo "$OUTPUT"
            echo "Size: $SIZE bytes"

            echo "Scene $ID completed."

          done

          echo "======================================"
          echo "ALL $SCENE_COUNT SCENES RENDERED"
          echo "======================================"


      # ==========================================================
      # 13. VERIFY ALL GENERATED SCENE FILES
      # ==========================================================

      - name: Verify all generated scenes
        run: |
          echo "======================================"
          echo "VERIFYING GENERATED SCENES"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

            FILE="work/scene_${ID}.mp4"

            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing scene output:"
              echo "$FILE"
              exit 1
            fi

            echo "Scene $ID:"
            echo "$FILE"

            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1 \
              "$FILE"

            echo "--------------------------------------"

          done

          echo "ALL GENERATED SCENES : VERIFIED"


      # ==========================================================
      # 14. BUILD DYNAMIC XFADE FILTER GRAPH
      #
      # This is the MOST IMPORTANT PART of Test 09.
      #
      # The filter graph is generated automatically according
      # to however many scenes are present in the JSON.
      #
      # No fixed 3-scene or 4-scene FFmpeg graph is used.
      # ==========================================================

      - name: Build dynamic FFmpeg transition graph
        shell: bash
        run: |
          echo "======================================"
          echo "BUILDING DYNAMIC XFADE GRAPH"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          if [ "$SCENE_COUNT" -eq 1 ]; then

            echo "Only one scene."
            echo "No transition graph required."

            echo "SINGLE_SCENE" > work/filter_mode.txt

          else

            FILTER=""
            OFFSET=0

            # First transition begins after Scene 01's
            # unique duration.
            FIRST_DURATION=$(jq -r '.scenes[0].duration' scene_config.json)

            OFFSET="$FIRST_DURATION"

            FILTER="[0:v][1:v]xfade=transition=fade:duration=${TRANSITION_DURATION}:offset=${OFFSET}[v1]"

            # Additional scenes are appended dynamically.
            #
            # Example for 4 scenes:
            #
            # [0][1] -> [v1]
            # [v1][2] -> [v2]
            # [v2][3] -> [v3]

            for INDEX in $(seq 2 $((SCENE_COUNT - 1)))
            do

              PREVIOUS_INDEX=$((INDEX - 1))

              PREVIOUS_DURATION=$(jq -r \
                ".scenes[$PREVIOUS_INDEX].duration" \
                scene_config.json
              )

              OFFSET=$(awk \
                "BEGIN {print $OFFSET + $PREVIOUS_DURATION}"
              )

              PREVIOUS_LABEL="v$((INDEX - 1))"
              CURRENT_LABEL="v$INDEX"

              FILTER="${FILTER};[${PREVIOUS_LABEL}][${INDEX}:v]xfade=transition=fade:duration=${TRANSITION_DURATION}:offset=${OFFSET}[${CURRENT_LABEL}]"

            done

            echo "$FILTER" > work/dynamic_xfade_filter.txt

            echo "--------------------------------------"
            echo "GENERATED FILTER GRAPH"
            echo "--------------------------------------"
            cat work/dynamic_xfade_filter.txt
            echo "--------------------------------------"

            echo "DYNAMIC_FILTER" > work/filter_mode.txt

          fi

          echo "======================================"
          echo "DYNAMIC XFADE GRAPH READY"
          echo "======================================"


      # ==========================================================
      # 15. APPLY DYNAMIC XFADE GRAPH
      # ==========================================================

      - name: Apply dynamic scene transitions
        shell: bash
        run: |
          echo "======================================"
          echo "APPLYING DYNAMIC TRANSITIONS"
          echo "======================================"

          SCENE_COUNT=$(jq '.scenes | length' scene_config.json)

          if [ "$SCENE_COUNT" -eq 1 ]; then

            cp work/scene_1.mp4 work/video_core.mp4

          else

            INPUT_ARGS=()

            for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
            do
              ID=$(jq -r ".scenes[$INDEX].id" scene_config.json)

              INPUT_ARGS+=(
                -i
                "work/scene_${ID}.mp4"
              )
            done

            FILTER=$(cat work/dynamic_xfade_filter.txt)

            FINAL_LABEL="v$((SCENE_COUNT - 1))"

            echo "Scene count : $SCENE_COUNT"
            echo "Final label : $FINAL_LABEL"
            echo "--------------------------------------"
            echo "$FILTER"
            echo "--------------------------------------"

            ffmpeg \
              -y \
              "${INPUT_ARGS[@]}" \
              -filter_complex "$FILTER" \
              -map "[${FINAL_LABEL}]" \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -r "$FPS" \
              work/video_core.mp4

          fi

          echo "======================================"
          echo "DYNAMIC TRANSITIONS COMPLETED"
          echo "======================================"


      # ==========================================================
      # 16. VERIFY CORE VIDEO
      # ==========================================================

      - name: Verify dynamic core video
        run: |
          echo "======================================"
          echo "CORE VIDEO VERIFICATION"
          echo "======================================"

          if [ ! -f work/video_core.mp4 ]; then
            echo "ERROR: Core video missing."
            exit 1
          fi

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            work/video_core.mp4

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            work/video_core.mp4

          echo "======================================"
          echo "CORE VIDEO : VERIFIED"
          echo "======================================"


      # ==========================================================
      # 17. CREATE TEST SUBTITLES
      # ==========================================================

      - name: Create dynamic scene subtitles
        run: |
          echo "======================================"
          echo "CREATING TEST 09 SUBTITLES"
          echo "======================================"

          cat > work/subtitles.srt <<'EOF'
          1
          00:00:00,000 --> 00:00:10,000
          AICAP is reading the scene configuration.

          2
          00:00:10,000 --> 00:00:25,000
          Scene two was discovered automatically.

          3
          00:00:25,000 --> 00:00:40,000
          Scene three was discovered automatically.

          4
          00:00:40,000 --> 00:01:00,000
          Scene four was discovered without changing the renderer.
          EOF

          cat work/subtitles.srt


      # ==========================================================
      # 18. BURN SUBTITLES
      # ==========================================================

      - name: Burn subtitles
        run: |
          echo "======================================"
          echo "BURNING SUBTITLES"
          echo "======================================"

          ffmpeg \
            -y \
            -i work/video_core.mp4 \
            -vf "subtitles=work/subtitles.srt:force_style='FontName=Arial,FontSize=24,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BorderStyle=1,Outline=3,Shadow=1,Alignment=2,MarginV=150'" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r "$FPS" \
            -an \
            work/video_subtitles.mp4

          echo "Subtitles burned."


      # ==========================================================
      # 19. ADD NARRATION FROM JSON
      # ==========================================================

      - name: Add narration from JSON
        run: |
          echo "======================================"
          echo "ADDING JSON-SELECTED NARRATION"
          echo "======================================"

          AUDIO=$(jq -r '.audio.file' scene_config.json)

          echo "Narration selected from JSON:"
          echo "$AUDIO"

          ffmpeg \
            -y \
            -i work/video_subtitles.mp4 \
            -i "$AUDIO" \
            -filter_complex "[1:a]apad[a]" \
            -map 0:v:0 \
            -map "[a]" \
            -t "$TARGET_DURATION" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -movflags +faststart \
            output/AICAP_FREE_09_DYNAMIC_SCENE_COUNT.mp4

          echo "Narration added."


      # ==========================================================
      # 20. FINAL VIDEO VERIFICATION
      # ==========================================================

      - name: Verify final Test 09 video
        run: |
          echo "======================================"
          echo "AICAP FREE RENDER"
          echo "09 — DYNAMIC SCENE COUNT"
          echo "FINAL VERIFICATION"
          echo "======================================"

          VIDEO="output/AICAP_FREE_09_DYNAMIC_SCENE_COUNT.mp4"

          if [ ! -f "$VIDEO" ]; then
            echo "ERROR: Final video was not created."
            exit 1
          fi

          SIZE=$(stat -c%s "$VIDEO")

          echo "Output File : $VIDEO"
          echo "File Size   : $SIZE bytes"

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Final video is empty."
            exit 1
          fi

          echo "--------------------------------------"
          echo "VIDEO STREAM"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "--------------------------------------"
          echo "AUDIO STREAM"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "--------------------------------------"
          echo "FINAL FORMAT"
          echo "--------------------------------------"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo "======================================"
          echo "EXPECTED"
          echo "======================================"
          echo "Configuration     : JSON"
          echo "Detected Scenes   : 4"
          echo "Scene 01          : 10 seconds"
          echo "Scene 02          : 15 seconds"
          echo "Scene 03          : 15 seconds"
          echo "Scene 04          : 20 seconds"
          echo "Total Duration    : 60 seconds"
          echo "Transitions       : 3"
          echo "Transition Style  : FADE"
          echo "Motion            : JSON CONTROLLED"
          echo "Subtitles         : BURNED IN"
          echo "Narration         : JSON SELECTED"
          echo "Resolution        : 1080x1920"
          echo "FPS               : 30"
          echo "Video Codec       : H.264"
          echo "Audio Codec       : AAC"
          echo "======================================"


      # ==========================================================
      # 21. UPLOAD VIDEO ARTIFACT
      # ==========================================================

      - name: Upload Test 09 MP4
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-09-DYNAMIC-SCENE-COUNT
          path: output/AICAP_FREE_09_DYNAMIC_SCENE_COUNT.mp4
          retention-days: 1


      # ==========================================================
      # 22. UPLOAD JSON ARTIFACT
      # ==========================================================

      - name: Upload Test 09 JSON configuration
        uses: actions/upload-artifact@v5
        with:
          name: AICAP-FREE-09-JSON-CONFIG
          path: scene_config.json
          retention-days: 1


      # ==========================================================
      # 23. FINAL RESULT
      # ==========================================================

      - name: Test 09 final result
        run: |
          echo "======================================"
          echo "AICAP FREE RENDER"
          echo "09 — DYNAMIC SCENE COUNT"
          echo "======================================"

          echo "STATUS            : PASSED"
          echo "CONFIGURATION     : JSON"
          echo "SCENE COUNT       : DYNAMIC"
          echo "TEST SCENE COUNT  : 4"
          echo "SCENE 01          : 10 seconds"
          echo "SCENE 02          : 15 seconds"
          echo "SCENE 03          : 15 seconds"
          echo "SCENE 04          : 20 seconds"
          echo "TOTAL VIDEO       : 60 seconds"
          echo "TRANSITIONS       : DYNAMIC"
          echo "MOTION            : JSON CONTROLLED"
          echo "SUBTITLES         : BURNED IN"
          echo "NARRATION         : JSON SELECTED"
          echo "RESOLUTION        : 1080x1920"
          echo "FPS               : 30"
          echo "VIDEO CODEC       : H.264"
          echo "AUDIO CODEC       : AAC"
          echo "OUTPUT            : AICAP_FREE_09_DYNAMIC_SCENE_COUNT.mp4"
          echo "ARTIFACT          : AICAP-FREE-09-DYNAMIC-SCENE-COUNT"
