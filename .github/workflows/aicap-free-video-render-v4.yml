name: AICAP Free Video Render V4

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "AICAP render job ID"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout renderer
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALL FFMPEG + FONTS
      #
      # IMPORTANT:
      # Do NOT use grep against ffmpeg -filters here.
      # FFmpeg itself is the authoritative test.
      # ============================================================
      - name: Install FFmpeg and fonts
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-liberation \
            fontconfig

          command -v ffmpeg
          command -v ffprobe
          command -v fc-match

          FONT_FILE="$(
            fc-match \
              -f '%{file}\n' \
              'Liberation Sans:style=Bold' \
              | head -n 1
          )"

          FONT_DIR="$(dirname "$FONT_FILE")"

          test -n "$FONT_FILE"
          test -f "$FONT_FILE"
          test -d "$FONT_DIR"

          echo "======================================"
          echo "AICAP RENDER ENVIRONMENT"
          echo "======================================"
          echo "FFmpeg   : $(ffmpeg -version | head -n 1)"
          echo "ffprobe  : $(ffprobe -version | head -n 1)"
          echo "Font     : $FONT_FILE"
          echo "Font dir : $FONT_DIR"
          echo "======================================"


      # ============================================================
      # 3. LOCATE RENDER JOB
      # ============================================================
      - name: Locate render job
        id: locate
        shell: bash
        env:
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -euo pipefail

          ROOT="aicap-render-jobs/${JOB_ID}"

          echo "======================================"
          echo "AICAP RENDER JOB"
          echo "======================================"
          echo "Job ID : ${JOB_ID}"
          echo "Root   : ${ROOT}"
          echo "======================================"

          test -d "$ROOT"
          test -s "$ROOT/scene_config.json"
          test -s "$ROOT/narration.mp3"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. RENDER VIDEO
      #
      # scene_config.json is DATA.
      #
      # It is passed to Python as an argument and parsed with
      # json.load().
      #
      # It is NEVER executed as Python source.
      #
      # Pipeline:
      #
      # JSON
      #   ↓
      # Validate audio-driven timeline
      #   ↓
      # Build global ASS subtitles
      #   ↓
      # Render each scene independently
      #   ↓
      # Concatenate scene clips
      #   ↓
      # Apply subtitles
      #   ↓
      # Add Module 17 narration
      #   ↓
      # Final MP4
      # ============================================================
      - name: Render video
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          CFG="$ROOT/scene_config.json"
          AUDIO="$ROOT/narration.mp3"
          OUT="$ROOT/aicap_final.mp4"

          python3 - "$CFG" "$ROOT" "$AUDIO" "$OUT" <<'PY'

          import json
          import os
          import shlex
          import subprocess
          import sys
          from pathlib import Path


          # ============================================================
          # PATHS
          # ============================================================

          cfg_path = Path(sys.argv[1]).resolve()
          root = Path(sys.argv[2]).resolve()
          audio = Path(sys.argv[3]).resolve()
          output = Path(sys.argv[4]).resolve()

          WORK = root / "_aicap_work"
          WORK.mkdir(parents=True, exist_ok=True)


          # ============================================================
          # HELPERS
          # ============================================================

          def fail(message):
              raise SystemExit(
                  "AICAP RENDER ERROR: " +
                  str(message)
              )


          def run(cmd, label):

              print("")
              print("======================================")
              print(label)
              print("======================================")

              print(
                  " ".join(
                      shlex.quote(str(x))
                      for x in cmd
                  )
              )

              result = subprocess.run(
                  [str(x) for x in cmd],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              print(result.stdout)

              if result.returncode != 0:
                  fail(
                      label +
                      " failed with exit code " +
                      str(result.returncode)
                  )

              return result


          def probe_duration(path):

              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True
              )

              if result.returncode != 0:
                  fail(
                      "ffprobe failed for " +
                      str(path) +
                      "\n" +
                      result.stdout
                  )

              try:
                  return float(
                      result.stdout.strip()
                  )
              except Exception:
                  fail(
                      "Could not read duration from " +
                      str(path) +
                      "\n" +
                      result.stdout
                  )


          # ============================================================
          # 1. READ JSON AS JSON DATA
          # ============================================================

          try:

              with cfg_path.open(
                  "r",
                  encoding="utf-8"
              ) as f:

                  cfg = json.load(f)

          except Exception as exc:

              fail(
                  "Cannot parse scene_config.json as JSON: " +
                  str(exc)
              )


          if not isinstance(cfg, dict):

              fail(
                  "scene_config.json root must be an object"
              )


          project = cfg.get("project") or {}

          resolution = (
              project.get("resolution") or {}
          )


          width = int(
              resolution.get(
                  "width",
                  cfg.get("width", 1080)
              )
          )


          height = int(
              resolution.get(
                  "height",
                  cfg.get("height", 1920)
              )
          )


          fps = int(
              project.get(
                  "fps",
                  cfg.get("fps", 30)
              )
          )


          if width != 1080 or height != 1920:

              fail(
                  "Required output is 1080x1920, received " +
                  f"{width}x{height}"
              )


          if fps != 30:

              fail(
                  "Required FPS is 30, received " +
                  str(fps)
              )


          scenes = cfg.get("scenes")


          if (
              not isinstance(scenes, list)
              or not scenes
          ):

              fail(
                  "scene_config.json contains no scenes"
              )


          # ============================================================
          # 2. AUTHORITATIVE AUDIO-DRIVEN TIMELINE
          # ============================================================

          normalized = []

          previous_end = 0.0


          for index, scene in enumerate(
              scenes,
              1
          ):

              if not isinstance(
                  scene,
                  dict
              ):

                  fail(
                      f"Scene {index} is not an object"
                  )


              try:

                  start = float(
                      scene["start"]
                  )

                  end = float(
                      scene["end"]
                  )

              except Exception as exc:

                  fail(
                      f"Scene {index} has invalid "
                      f"start/end: {exc}"
                  )


              if start < -0.001:

                  fail(
                      f"Scene {index} starts before zero"
                  )


              if end <= start:

                  fail(
                      f"Scene {index} has end <= start"
                  )


              if abs(
                  start - previous_end
              ) > 0.01:

                  fail(
                      f"Timeline gap/overlap before "
                      f"scene {index}: "
                      f"{start:.3f} != "
                      f"{previous_end:.3f}"
                  )


              filename = str(
                  scene.get("filename") or
                  f"scene_{index:02d}.jpg"
              ).strip()


              image = (
                  root /
                  filename
              ).resolve()


              if (
                  not image.is_file()
                  or image.stat().st_size == 0
              ):

                  fail(
                      "Missing/empty scene image: " +
                      str(image)
                  )


              duration = end - start


              subtitle_value = (
                  scene.get("subtitle") or {}
              )


              if not isinstance(
                  subtitle_value,
                  dict
              ):

                  subtitle_value = {}


              normalized.append(
                  {
                      "index": index,
                      "start": start,
                      "end": end,
                      "duration": duration,
                      "filename": filename,
                      "image": image,
                      "motion": str(
                          scene.get("motion") or ""
                      ).strip(),
                      "subtitle": subtitle_value
                  }
              )


              previous_end = end


          total_duration = float(
              previous_end
          )


          if total_duration <= 0:

              fail(
                  "Total timeline duration is zero"
              )


          # ============================================================
          # MODULE 17 REAL NARRATION
          # ============================================================

          if (
              not audio.is_file()
              or audio.stat().st_size == 0
          ):

              fail(
                  "Module 17 narration.mp3 is "
                  "missing or empty"
              )


          audio_duration = probe_duration(
              audio
          )


          if abs(
              audio_duration -
              total_duration
          ) > 0.25:

              fail(
                  "Narration/timeline mismatch: " +
                  f"audio={audio_duration:.3f}s " +
                  f"timeline={total_duration:.3f}s"
              )


          print("")
          print("======================================")
          print("AICAP INPUT VALIDATION : PASSED")
          print("======================================")
          print(
              f"Scenes           : {len(normalized)}"
          )
          print(
              f"Resolution       : {width}x{height}"
          )
          print(
              f"FPS              : {fps}"
          )
          print(
              f"Timeline         : {total_duration:.3f}s"
          )
          print(
              f"Narration        : {audio_duration:.3f}s"
          )
          print(
              "Audio difference : " +
              f"{abs(audio_duration-total_duration):.3f}s"
          )
          print(
              "JSON parser      : Python json.load()"
          )
          print("======================================")


          # ============================================================
          # 3. BUILD GLOBAL ASS SUBTITLES
          # ============================================================

          def ass_time(seconds):

              seconds = max(
                  0.0,
                  float(seconds)
              )

              total_cs = int(
                  round(seconds * 100)
              )

              hours = (
                  total_cs //
                  360000
              )

              minutes = (
                  total_cs %
                  360000
              ) // 6000

              seconds_part = (
                  total_cs %
                  6000
              ) // 100

              centiseconds = (
                  total_cs %
                  100
              )

              return (
                  f"{hours}:" +
                  f"{minutes:02d}:" +
                  f"{seconds_part:02d}." +
                  f"{centiseconds:02d}"
              )


          def ass_text(value):

              text = (
                  ""
                  if value is None
                  else str(value)
              )


              text = (
                  text
                  .replace("\r\n", "\n")
                  .replace("\r", "\n")
                  .replace("\x00", "")
              )


              # Prevent arbitrary ASS override tags.
              text = (
                  text
                  .replace("{", "(")
                  .replace("}", ")")
              )


              # Escape ASS backslash.
              text = text.replace(
                  "\\",
                  r"\\"
              )


              # ASS line breaks.
              text = text.replace(
                  "\n",
                  r"\N"
              )


              return text.strip()


          def wrap_caption(
              value,
              width_chars=32,
              max_lines=3
          ):

              text = (
                  ""
                  if value is None
                  else str(value)
              ).strip()


              if not text:
                  return ""


              words = text.split()

              lines = []
              current = ""


              for word in words:

                  candidate = (
                      word
                      if not current
                      else current +
                      " " +
                      word
                  )


                  if len(candidate) <= width_chars:

                      current = candidate

                  else:

                      if current:
                          lines.append(
                              current
                          )

                      current = word


              if current:
                  lines.append(
                      current
                  )


              if len(lines) > max_lines:

                  lines = lines[
                      :max_lines
                  ]

                  lines[-1] = (
                      lines[-1]
                      .rstrip(
                          ".,;:!?"
                      ) +
                      "…"
                  )


              return "\n".join(lines)


          ass_path = (
              WORK /
              "aicap_subtitles.ass"
          )


          subtitle_size = 80
          subtitle_outline = 5
          subtitle_shadow = 3
          subtitle_margin = 90


          ass_lines = [

              "[Script Info]",

              "ScriptType: v4.00+",

              "PlayResX: 1080",

              "PlayResY: 1920",

              "ScaledBorderAndShadow: yes",

              "",

              "[V4+ Styles]",

              (
                  "Format: Name, Fontname, Fontsize, "
                  "PrimaryColour, SecondaryColour, "
                  "OutlineColour, BackColour, Bold, "
                  "Italic, Underline, StrikeOut, "
                  "ScaleX, ScaleY, Spacing, Angle, "
                  "BorderStyle, Outline, Shadow, "
                  "Alignment, MarginL, MarginR, "
                  "MarginV, Encoding"
              ),

              (
                  "Style: AICAP,"
                  "Liberation Sans,"
                  f"{subtitle_size},"
                  "&H00FFFFFF,"
                  "&H00FFFFFF,"
                  "&H80000000,"
                  "&H80000000,"
                  "-1,0,0,0,"
                  "100,100,0,0,1,"
                  f"{subtitle_outline},"
                  f"{subtitle_shadow},"
                  "2,"
                  f"{subtitle_margin},"
                  f"{subtitle_margin},"
                  f"{subtitle_margin},"
                  "1"
              ),

              "",

              "[Events]",

              (
                  "Format: Layer, Start, End, Style, "
                  "Name, MarginL, MarginR, MarginV, "
                  "Effect, Text"
              )
          ]


          subtitle_count = 0


          for scene in normalized:

              subtitle = scene["subtitle"]

              enabled = subtitle.get(
                  "enabled",
                  True
              )


              if not enabled:
                  continue


              text = subtitle.get(
                  "text",
                  ""
              )


              text = wrap_caption(
                  text
              )


              if not text:
                  continue


              ass_lines.append(
                  "Dialogue: 0," +
                  ass_time(
                      scene["start"]
                  ) +
                  "," +
                  ass_time(
                      scene["end"]
                  ) +
                  ",AICAP,,0,0," +
                  str(
                      subtitle_margin
                  ) +
                  ",," +
                  ass_text(text)
              )


              subtitle_count += 1


          ass_path.write_text(
              "\n".join(
                  ass_lines
              ) +
              "\n",
              encoding="utf-8"
          )


          print("")
          print("======================================")
          print("AICAP SUBTITLE FILE")
          print("======================================")
          print(
              f"Subtitle events : {subtitle_count}"
          )
          print(
              f"ASS file        : {ass_path}"
          )
          print(
              "Subtitle engine : FFmpeg libass"
          )
          print(
              "Timing          : scene start/end"
          )
          print(
              "Position        : bottom center"
          )
          print("======================================")


          if subtitle_count == 0:

              fail(
                  "No enabled subtitle events "
                  "were found in scene_config.json"
              )


          # ============================================================
          # 4. RENDER EACH SCENE INDEPENDENTLY
          # ============================================================

          allowed_motions = {
              "zoom_in",
              "zoom_out",
              "pan_left",
              "pan_right"
          }


          clip_paths = []


          for scene in normalized:

              i = scene["index"]

              dur = scene["duration"]

              image = scene["image"]

              motion = scene["motion"]


              if motion not in allowed_motions:

                  motion = (
                      "zoom_in",
                      "zoom_out",
                      "pan_left",
                      "pan_right"
                  )[
                      (i - 1) % 4
                  ]


              frames = max(
                  1,
                  int(
                      round(
                          dur * fps
                      )
                  )
              )


              zoom_amount = 1.08


              if motion == "zoom_in":

                  visual = (
                      f"scale={width*2}:{height*2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='min(zoom+0.0008,{zoom_amount})':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )


              elif motion == "zoom_out":

                  visual = (
                      f"scale={width*2}:{height*2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='max(1.0,{zoom_amount}-"
                      f"on*0.0008)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )


              elif motion == "pan_left":

                  visual = (
                      f"scale={width*2}:{height*2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='1.05':"
                      f"x='(iw-iw/zoom)*"
                      f"(1-min(on/"
                      f"max(1,{frames-1}),1))':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )


              else:

                  visual = (
                      f"scale={width*2}:{height*2}:"
                      "force_original_aspect_ratio=increase,"
                      f"crop={width*2}:{height*2},"
                      f"zoompan="
                      f"z='1.05':"
                      f"x='(iw-iw/zoom)*"
                      f"min(on/"
                      f"max(1,{frames-1}),1)':"
                      f"y='ih/2-(ih/zoom/2)':"
                      f"d={frames}:"
                      f"s={width}x{height}:"
                      f"fps={fps}"
                  )


              fade = min(
                  0.5,
                  max(
                      0.05,
                      dur / 4.0
                  )
              )


              fade_out_start = max(
                  0.0,
                  dur - fade
              )


              visual += (
                  f",fade=t=in:"
                  f"st=0:"
                  f"d={fade:.6f}"
                  f",fade=t=out:"
                  f"st={fade_out_start:.6f}:"
                  f"d={fade:.6f}"
                  ",format=yuv420p"
              )


              clip = (
                  WORK /
                  f"scene_{i:02d}.mp4"
              )


              run(
                  [
                      "ffmpeg",
                      "-y",
                      "-hide_banner",
                      "-loglevel",
                      "error",
                      "-loop",
                      "1",
                      "-framerate",
                      str(fps),
                      "-i",
                      str(image),
                      "-t",
                      f"{dur:.6f}",
                      "-vf",
                      visual,
                      "-an",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "20",
                      "-pix_fmt",
                      "yuv420p",
                      "-r",
                      str(fps),
                      "-movflags",
                      "+faststart",
                      str(clip)
                  ],
                  (
                      f"RENDER SCENE {i}/"
                      f"{len(normalized)} "
                      f"[{motion}]"
                  )
              )


              if (
                  not clip.is_file()
                  or clip.stat().st_size == 0
              ):

                  fail(
                      f"Scene {i} produced no output"
                  )


              clip_duration = probe_duration(
                  clip
              )


              if abs(
                  clip_duration -
                  dur
              ) > 0.15:

                  fail(
                      f"Scene {i} duration mismatch: "
                      f"expected={dur:.3f}s "
                      f"actual={clip_duration:.3f}s"
                  )


              clip_paths.append(
                  clip
              )


          # ============================================================
          # 5. CONCATENATE SCENE CLIPS
          # ============================================================

          concat_list = (
              WORK /
              "concat.txt"
          )


          concat_lines = []


          for clip in clip_paths:

              path_text = str(
                  clip
              ).replace(
                  "'",
                  "'\\''"
              )


              concat_lines.append(
                  "file '" +
                  path_text +
                  "'"
              )


          concat_list.write_text(
              "\n".join(
                  concat_lines
              ) +
              "\n",
              encoding="utf-8"
          )


          joined = (
              WORK /
              "aicap_joined.mp4"
          )


          run(
              [
                  "ffmpeg",
                  "-y",
                  "-hide_banner",
                  "-loglevel",
                  "error",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_list),
                  "-c",
                  "copy",
                  "-movflags",
                  "+faststart",
                  str(joined)
              ],
              "JOIN SCENES"
          )


          joined_duration = probe_duration(
              joined
          )


          if abs(
              joined_duration -
              total_duration
          ) > 0.20:

              fail(
                  "Joined video duration mismatch: "
                  f"expected={total_duration:.3f}s "
                  f"actual={joined_duration:.3f}s"
              )


          # ============================================================
          # 6. FINAL PASS
          #
          # Burn global ASS subtitles.
          # Add the REAL Module 17 narration.
          # ============================================================

          font_file_result = subprocess.run(
              [
                  "fc-match",
                  "-f",
                  "%{file}\n",
                  "Liberation Sans:style=Bold"
              ],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True
          )


          if (
              font_file_result.returncode != 0
          ):

              fail(
                  "fontconfig could not resolve "
                  "Liberation Sans Bold\n" +
                  font_file_result.stdout
              )


          font_lines = (
              font_file_result.stdout
              .strip()
              .splitlines()
          )


          if not font_lines:

              fail(
                  "Could not determine subtitle font"
              )


          font_file = font_lines[0].strip()

          font_dir = str(
              Path(font_file).parent
          )


          if not Path(
              font_file
          ).is_file():

              fail(
                  "Resolved subtitle font does "
                  "not exist: " +
                  font_file
              )


          subtitle_filter = (
              "subtitles=" +
              str(ass_path) +
              ":fontsdir=" +
              font_dir
          )


          run(
              [
                  "ffmpeg",
                  "-y",
                  "-hide_banner",
                  "-loglevel",
                  "error",
                  "-i",
                  str(joined),
                  "-i",
                  str(audio),
                  "-vf",
                  subtitle_filter,
                  "-map",
                  "0:v:0",
                  "-map",
                  "1:a:0",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "medium",
                  "-crf",
                  "20",
                  "-pix_fmt",
                  "yuv420p",
                  "-r",
                  str(fps),
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-af",
                  "aresample=async=1:first_pts=0",
                  "-t",
                  f"{total_duration:.6f}",
                  "-movflags",
                  "+faststart",
                  str(output)
              ],
              "FINALIZE VIDEO + SUBTITLES + NARRATION"
          )


          if (
              not output.is_file()
              or output.stat().st_size == 0
          ):

              fail(
                  "Final MP4 was not created"
              )


          final_duration = probe_duration(
              output
          )


          if abs(
              final_duration -
              total_duration
          ) > 0.25:

              fail(
                  "Final video duration mismatch: "
                  f"expected={total_duration:.3f}s "
                  f"actual={final_duration:.3f}s"
              )


          print("")
          print("======================================")
          print("AICAP RENDER COMPLETE")
          print("======================================")
          print(
              f"Output           : {output}"
          )
          print(
              f"Duration         : {final_duration:.3f}s"
          )
          print(
              f"Resolution       : {width}x{height}"
          )
          print(
              f"FPS              : {fps}"
          )
          print(
              f"Subtitle events  : {subtitle_count}"
          )
          print(
              "Subtitles burned : YES"
          )
          print(
              "Narration        : MODULE 17 REAL"
          )
          print(
              "Motion           : YES"
          )
          print(
              "Fade transitions : YES"
          )
          print("======================================")

          PY


      # ============================================================
      # 5. VERIFY FINAL MP4
      # ============================================================
      - name: Verify final MP4
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          OUT="$ROOT/aicap_final.mp4"

          test -s "$OUT"


          WIDTH="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=width \
              -of csv=p=0 \
              "$OUT"
          )"


          HEIGHT="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=height \
              -of csv=p=0 \
              "$OUT"
          )"


          VCODEC="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"


          ACODEC="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=codec_name \
              -of csv=p=0 \
              "$OUT"
          )"


          V_DURATION="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"


          A_DURATION="$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of csv=p=0 \
              "$OUT"
          )"


          FPS="$(
            ffprobe \
              -v error \
              -select_streams v:0 \
              -show_entries stream=r_frame_rate \
              -of csv=p=0 \
              "$OUT"
          )"


          test "$WIDTH" = "1080"
          test "$HEIGHT" = "1920"
          test "$VCODEC" = "h264"
          test "$ACODEC" = "aac"
          test -n "$V_DURATION"
          test -n "$A_DURATION"


          echo ""
          echo "======================================"
          echo "AICAP FINAL MP4 VERIFICATION"
          echo "======================================"
          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "FPS        : ${FPS}"
          echo "Video      : ${VCODEC}"
          echo "Audio      : ${ACODEC}"
          echo "Video time : ${V_DURATION}s"
          echo "Audio time : ${A_DURATION}s"
          echo "======================================"


          awk \
            -v v="$V_DURATION" \
            -v a="$A_DURATION" \
            'BEGIN {
              d = v - a
              if (d < 0) d = -d
              if (d > 0.25) {
                printf "ERROR: video/audio duration mismatch: %.3fs vs %.3fs\n", v, a
                exit 1
              }
            }'


          echo ""
          echo "FINAL VERIFICATION: SUCCESS"


      # ============================================================
      # 6. PACKAGE RENDER ARTIFACT
      # ============================================================
      - name: Package render artifact
        shell: bash
        env:
          ROOT: ${{ steps.locate.outputs.root }}
        run: |
          set -euo pipefail

          rm -rf artifact
          mkdir -p artifact


          cp \
            "$ROOT/aicap_final.mp4" \
            artifact/aicap_final.mp4


          cp \
            "$ROOT/scene_config.json" \
            artifact/scene_config.json


          cp \
            "$ROOT/narration.mp3" \
            artifact/narration.mp3


          if [ \
            -f \
            "$ROOT/_aicap_work/aicap_subtitles.ass" \
          ]; then

            cp \
              "$ROOT/_aicap_work/aicap_subtitles.ass" \
              artifact/aicap_subtitles.ass

          fi


          find "$ROOT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.jpg" \
              -o -name "*.jpeg" \
              -o -name "*.png" \
            \) \
            -exec cp {} artifact/ \;


          echo "======================================"
          echo "ARTIFACT PACKAGE READY"
          echo "======================================"

          ls -lh artifact/

          echo "======================================"


      # ============================================================
      # 7. UPLOAD FINAL RENDER ARTIFACT
      # ============================================================
      - name: Upload final render artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicap-render-${{ inputs.job_id }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
