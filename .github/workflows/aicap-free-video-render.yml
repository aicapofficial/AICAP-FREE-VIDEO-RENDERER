name: AICAP FREE VIDEO RENDER

on:
  workflow_dispatch:
    inputs:

      job_id:
        description: "AICAP Render Job ID"
        required: true
        type: string

      video_id:
        description: "AICAP Video ID"
        required: true
        type: string

      script_id:
        description: "AICAP Script ID"
        required: false
        type: string
        default: ""

      input_root:
        description: "AICAP GitHub input directory"
        required: true
        type: string

      output_file:
        description: "Final MP4 file name"
        required: true
        type: string

      config:
        description: "Scene configuration JSON path"
        required: true
        type: string


jobs:

  render:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v6


      # ==========================================================
      # 02. INSTALL TOOLS
      # ==========================================================

      - name: Install FFmpeg jq and Python
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "PRODUCTION RENDER ENGINE"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            python3

          echo "FFmpeg : INSTALLED"
          echo "jq     : INSTALLED"
          echo "Python : INSTALLED"


      # ==========================================================
      # 03. VERIFY INPUT PARAMETERS
      # ==========================================================

      - name: Verify render parameters
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RENDER PARAMETERS"
          echo "======================================"

          echo "Job ID      : ${{ inputs.job_id }}"
          echo "Video ID    : ${{ inputs.video_id }}"
          echo "Script ID   : ${{ inputs.script_id }}"
          echo "Input Root  : ${{ inputs.input_root }}"
          echo "Output File : ${{ inputs.output_file }}"
          echo "Config      : ${{ inputs.config }}"

          if [ -z "${{ inputs.job_id }}" ]; then
            echo "ERROR: job_id missing."
            exit 1
          fi

          if [ -z "${{ inputs.video_id }}" ]; then
            echo "ERROR: video_id missing."
            exit 1
          fi

          if [ -z "${{ inputs.input_root }}" ]; then
            echo "ERROR: input_root missing."
            exit 1
          fi

          if [ -z "${{ inputs.output_file }}" ]; then
            echo "ERROR: output_file missing."
            exit 1
          fi

          if [ -z "${{ inputs.config }}" ]; then
            echo "ERROR: config missing."
            exit 1
          fi

          echo "PARAMETERS : VERIFIED"


      # ==========================================================
      # 04. LOAD CONFIGURATION
      # ==========================================================

      - name: Load AICAP scene configuration
        shell: bash
        run: |
          set -e

          CONFIG="${{ inputs.config }}"

          echo "======================================"
          echo "LOADING AICAP SCENE CONFIGURATION"
          echo "======================================"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: Configuration file not found:"
            echo "$CONFIG"
            exit 1
          fi

          jq empty "$CONFIG"

          WIDTH=$(jq -r '.project.resolution.width' "$CONFIG")
          HEIGHT=$(jq -r '.project.resolution.height' "$CONFIG")
          FPS=$(jq -r '.project.fps' "$CONFIG")
          TARGET_DURATION=$(jq -r '.project.total_duration' "$CONFIG")
          TRANSITION_TYPE=$(jq -r '.transition.type' "$CONFIG")
          TRANSITION_DURATION=$(jq -r '.transition.duration' "$CONFIG")

          echo "WIDTH=$WIDTH" >> "$GITHUB_ENV"
          echo "HEIGHT=$HEIGHT" >> "$GITHUB_ENV"
          echo "FPS=$FPS" >> "$GITHUB_ENV"
          echo "TARGET_DURATION=$TARGET_DURATION" >> "$GITHUB_ENV"
          echo "TRANSITION_TYPE=$TRANSITION_TYPE" >> "$GITHUB_ENV"
          echo "TRANSITION_DURATION=$TRANSITION_DURATION" >> "$GITHUB_ENV"

          echo "Resolution           : ${WIDTH}x${HEIGHT}"
          echo "FPS                  : $FPS"
          echo "Duration             : $TARGET_DURATION"
          echo "Transition           : $TRANSITION_TYPE"
          echo "Transition Duration  : $TRANSITION_DURATION"

          echo "CONFIGURATION : VALID"


      # ==========================================================
      # 05. VERIFY AICAP FORMAT
      # ==========================================================

      - name: Verify AICAP video format
        shell: bash
        run: |
          set -e

          if [ "$WIDTH" -ne 1080 ]; then
            echo "ERROR: Width must be 1080."
            exit 1
          fi

          if [ "$HEIGHT" -ne 1920 ]; then
            echo "ERROR: Height must be 1920."
            exit 1
          fi

          if [ "$FPS" -ne 30 ]; then
            echo "ERROR: FPS must be 30."
            exit 1
          fi

          if [ "$TRANSITION_TYPE" != "fade" ]; then
            echo "ERROR: Only fade transition is supported."
            exit 1
          fi

          echo "1080x1920 : VERIFIED"
          echo "30 FPS     : VERIFIED"
          echo "FADE       : VERIFIED"


      # ==========================================================
      # 06. PREPARE DIRECTORIES
      # ==========================================================

      - name: Prepare render directories
        shell: bash
        run: |
          set -e

          rm -rf work
          rm -rf output

          mkdir -p work
          mkdir -p output

          echo "WORK DIRECTORY   : READY"
          echo "OUTPUT DIRECTORY : READY"


      # ==========================================================
      # 07. VALIDATE SCENE TIMELINE
      #
      # FIX:
      # Numeric values are now compared numerically.
      # This eliminates 10 vs 10.0 mismatch.
      # ==========================================================

      - name: Validate scene timeline
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SCENE TIMELINE VALIDATION"
          echo "======================================"

          CONFIG="${{ inputs.config }}"

          COUNT=$(jq '.scenes | length' "$CONFIG")

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No scenes found."
            exit 1
          fi

          python3 - "$CONFIG" "$TARGET_DURATION" "$TRANSITION_DURATION" <<'PY'

          import json
          import sys

          config_path = sys.argv[1]
          target = float(sys.argv[2])
          transition = float(sys.argv[3])

          with open(config_path, "r", encoding="utf-8") as f:
              config = json.load(f)

          scenes = config.get("scenes", [])

          expected_start = 0.0

          for scene in scenes:

              scene_id = scene["id"]

              start = float(scene["start"])
              duration = float(scene["duration"])
              end = float(scene["end"])

              print(
                  f"Scene {scene_id} : "
                  f"{start:g} → {end:g} "
                  f"(duration {duration:g})"
              )

              if abs(start - expected_start) > 0.01:
                  raise SystemExit(
                      f"ERROR: Scene {scene_id} start mismatch. "
                      f"Expected {expected_start:g}, found {start:g}"
                  )

              calculated_end = start + duration

              if abs(end - calculated_end) > 0.01:
                  raise SystemExit(
                      f"ERROR: Scene {scene_id} end mismatch. "
                      f"Expected {calculated_end:g}, found {end:g}"
                  )

              if duration <= 0:
                  raise SystemExit(
                      f"ERROR: Scene {scene_id} duration must be positive."
                  )

              expected_start = end

          if abs(expected_start - target) > 0.01:
              raise SystemExit(
                  f"ERROR: Scene timeline {expected_start:g}s "
                  f"does not equal target {target:g}s"
              )

          for scene in scenes[:-1]:

              duration = float(scene["duration"])

              if transition >= duration:
                  raise SystemExit(
                      f"ERROR: Transition duration {transition:g}s "
                      f"must be shorter than scene duration "
                      f"{duration:g}s in Scene {scene['id']}."
                  )

          print("SCENE TIMELINE : VALID")

          PY


      # ==========================================================
      # 08. VALIDATE NARRATION TIMELINE
      # ==========================================================

      - name: Validate narration timeline
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "NARRATION TIMELINE VALIDATION"
          echo "======================================"

          CONFIG="${{ inputs.config }}"

          python3 - "$CONFIG" "$TARGET_DURATION" <<'PY'

          import json
          import sys

          config_path = sys.argv[1]
          target = float(sys.argv[2])

          with open(config_path, "r", encoding="utf-8") as f:
              config = json.load(f)

          segments = config.get("narration", {}).get("segments", [])

          if not segments:
              raise SystemExit(
                  "ERROR: Narration segments missing."
              )

          expected_start = 0.0

          for segment in segments:

              segment_id = segment["id"]

              start = float(segment["start"])
              duration = float(segment["duration"])
              end = float(segment["end"])

              print(
                  f"Narration {segment_id} : "
                  f"{start:g} → {end:g}"
              )

              if abs(start - expected_start) > 0.01:
                  raise SystemExit(
                      f"ERROR: Narration {segment_id} start mismatch."
                  )

              calculated_end = start + duration

              if abs(end - calculated_end) > 0.01:
                  raise SystemExit(
                      f"ERROR: Narration {segment_id} end mismatch."
                  )

              expected_start = end

          if abs(expected_start - target) > 0.01:
              raise SystemExit(
                  f"ERROR: Narration timeline "
                  f"{expected_start:g}s != target {target:g}s"
              )

          print("NARRATION TIMELINE : VALID")

          PY


      # ==========================================================
      # 09. SCENE / NARRATION SYNCHRONIZATION
      # ==========================================================

      - name: Verify scene and narration synchronization
        shell: bash
        run: |
          set -e

          CONFIG="${{ inputs.config }}"

          SCENE_COUNT=$(jq '.scenes | length' "$CONFIG")
          AUDIO_COUNT=$(jq '.narration.segments | length' "$CONFIG")

          if [ "$SCENE_COUNT" -ne "$AUDIO_COUNT" ]; then
            echo "ERROR: Scene count and narration count differ."
            exit 1
          fi

          python3 - "$CONFIG" <<'PY'

          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as f:
              config = json.load(f)

          scenes = config["scenes"]
          narration = config["narration"]["segments"]

          for scene, audio in zip(scenes, narration):

              scene_start = float(scene["start"])
              scene_end = float(scene["end"])

              audio_start = float(audio["start"])
              audio_end = float(audio["end"])

              if abs(scene_start - audio_start) > 0.01:
                  raise SystemExit(
                      f"ERROR: Scene {scene['id']} "
                      f"start does not match narration."
                  )

              if abs(scene_end - audio_end) > 0.01:
                  raise SystemExit(
                      f"ERROR: Scene {scene['id']} "
                      f"end does not match narration."
                  )

          print("SCENE / AUDIO SYNC : VERIFIED")

          PY


      # ==========================================================
      # 10. VERIFY ALL INPUT ASSETS
      # ==========================================================

      - name: Verify scene images and narration
        shell: bash
        run: |
          set -e

          CONFIG="${{ inputs.config }}"

          COUNT=$(jq '.scenes | length' "$CONFIG")

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            IMAGE=$(jq -r ".scenes[$INDEX].image" "$CONFIG")

            if [ ! -f "$IMAGE" ]; then
              echo "ERROR: Missing scene image:"
              echo "$IMAGE"
              exit 1
            fi

            echo "FOUND: $IMAGE"

          done

          AUDIO=$(jq -r '.narration.source' "$CONFIG")

          if [ ! -f "$AUDIO" ]; then
            echo "ERROR: Missing narration:"
            echo "$AUDIO"
            exit 1
          fi

          echo "FOUND: $AUDIO"

          echo "ALL INPUT ASSETS : VERIFIED"


      # ==========================================================
      # 11. VERIFY NARRATION AUDIO
      # ==========================================================

      - name: Verify narration audio
        shell: bash
        run: |
          set -e

          CONFIG="${{ inputs.config }}"

          AUDIO=$(jq -r '.narration.source' "$CONFIG")

          AUDIO_DURATION=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$AUDIO"
          )

          echo "Narration duration : ${AUDIO_DURATION}s"
          echo "Timeline duration  : ${TARGET_DURATION}s"

          python3 - "$AUDIO_DURATION" <<'PY'

          import sys

          duration = float(sys.argv[1])

          if duration <= 0:
              raise SystemExit(
                  "ERROR: Narration audio has invalid duration."
              )

          PY

          echo "NARRATION AUDIO : VERIFIED"


      # ==========================================================
      # 12. RENDER SCENES
      #
      # IMPORTANT:
      # Scene durations remain EXACT.
      # Transition overlap is handled by xfade later.
      # ==========================================================

      - name: Render all scenes
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RENDERING AICAP SCENES"
          echo "======================================"

          CONFIG="${{ inputs.config }}"

          COUNT=$(jq '.scenes | length' "$CONFIG")

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" "$CONFIG")
            IMAGE=$(jq -r ".scenes[$INDEX].image" "$CONFIG")
            DURATION=$(jq -r ".scenes[$INDEX].duration" "$CONFIG")
            MOTION=$(jq -r ".scenes[$INDEX].motion" "$CONFIG")

            OUTPUT="work/scene_${ID}.mp4"

            echo "--------------------------------------"
            echo "Scene    : $ID"
            echo "Duration : $DURATION"
            echo "Motion   : $MOTION"
            echo "--------------------------------------"

            case "$MOTION" in

              zoom_in)

                ffmpeg -y \
                  -loop 1 \
                  -framerate "$FPS" \
                  -i "$IMAGE" \
                  -t "$DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='min(zoom+0.0015,1.15)':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"

                ;;


              zoom_out)

                ffmpeg -y \
                  -loop 1 \
                  -framerate "$FPS" \
                  -i "$IMAGE" \
                  -t "$DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='if(eq(on,0),1.15,max(zoom-0.0015,1.0))':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"

                ;;


              pan_left)

                ffmpeg -y \
                  -loop 1 \
                  -framerate "$FPS" \
                  -i "$IMAGE" \
                  -t "$DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='1.10':x='(iw-iw/zoom)*(1-on/(30*${DURATION}))':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"

                ;;


              pan_right)

                ffmpeg -y \
                  -loop 1 \
                  -framerate "$FPS" \
                  -i "$IMAGE" \
                  -t "$DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='1.10':x='(iw-iw/zoom)*(on/(30*${DURATION}))':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"

                ;;


              *)

                echo "ERROR: Unsupported motion:"
                echo "$MOTION"
                exit 1

                ;;

            esac

            if [ ! -s "$OUTPUT" ]; then
              echo "ERROR: Scene $ID rendering failed."
              exit 1
            fi

            echo "Scene $ID : RENDERED"

          done

          echo "ALL SCENES : RENDERED"


      # ==========================================================
      # 13. VERIFY SCENE VIDEO DURATIONS
      # ==========================================================

      - name: Verify scene video durations
        shell: bash
        run: |
          set -e

          CONFIG="${{ inputs.config }}"

          COUNT=$(jq '.scenes | length' "$CONFIG")

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" "$CONFIG")
            EXPECTED=$(jq -r ".scenes[$INDEX].duration" "$CONFIG")

            ACTUAL=$(
              ffprobe \
                -v error \
                -show_entries format=duration \
                -of default=noprint_wrappers=1:nokey=1 \
                "work/scene_${ID}.mp4"
            )

            echo "Scene $ID"
            echo "Expected : ${EXPECTED}s"
            echo "Actual   : ${ACTUAL}s"

            python3 - "$ACTUAL" "$EXPECTED" <<'PY'

            import sys

            actual = float(sys.argv[1])
            expected = float(sys.argv[2])

            if abs(actual - expected) > 0.20:
                raise SystemExit(
                    f"ERROR: Scene duration mismatch: "
                    f"{actual}s vs {expected}s"
                )

            PY

          done

          echo "SCENE DURATIONS : VERIFIED"


      # ==========================================================
      # 14. BUILD EXACT VIDEO TIMELINE
      #
      # FIX:
      # xfade offset = scene start - transition duration.
      #
      # Example:
      # Scene 1 = 0-10
      # Scene 2 = 10-25
      # Transition = 1
      #
      # xfade offset = 10-1 = 9
      #
      # This preserves the final 60-second timeline.
      # ==========================================================

      - name: Build video timeline
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING EXACT AICAP VIDEO TIMELINE"
          echo "======================================"

          CONFIG="${{ inputs.config }}"

          COUNT=$(jq '.scenes | length' "$CONFIG")

          INPUT_ARGS=()

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" "$CONFIG")

            INPUT_ARGS+=(
              -i
              "work/scene_${ID}.mp4"
            )

          done

          if [ "$COUNT" -eq 1 ]; then

            cp \
              "work/scene_$(jq -r '.scenes[0].id' "$CONFIG").mp4" \
              work/video_core.mp4

          else

            FILTER=""

            for INDEX in $(seq 1 $((COUNT - 1)))
            do

              PREVIOUS_INDEX=$((INDEX - 1))

              if [ "$INDEX" -eq 1 ]; then
                PREVIOUS_LABEL="[0:v]"
              else
                PREVIOUS_LABEL="[v${PREVIOUS_INDEX}]"
              fi

              CURRENT_START=$(
                jq -r ".scenes[$INDEX].start" "$CONFIG"
              )

              XFADE_OFFSET=$(
                python3 -c \
                "print(float('$CURRENT_START') - float('$TRANSITION_DURATION'))"
              )

              FILTER="${FILTER}${PREVIOUS_LABEL}[${INDEX}:v]xfade=transition=fade:duration=${TRANSITION_DURATION}:offset=${XFADE_OFFSET}[v${INDEX}];"

            done

            FINAL_LABEL="[v$((COUNT - 1))]"

            ffmpeg -y \
              "${INPUT_ARGS[@]}" \
              -filter_complex "$FILTER" \
              -map "$FINAL_LABEL" \
              -c:v libx264 \
              -preset veryfast \
              -pix_fmt yuv420p \
              -r 30 \
              -an \
              work/video_core.mp4

          fi

          if [ ! -s work/video_core.mp4 ]; then
            echo "ERROR: Core video was not created."
            exit 1
          fi

          CORE_DURATION=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              work/video_core.mp4
          )

          echo "Core video duration : ${CORE_DURATION}s"
          echo "Target duration     : ${TARGET_DURATION}s"

          python3 - "$CORE_DURATION" "$TARGET_DURATION" <<'PY'

          import sys

          actual = float(sys.argv[1])
          target = float(sys.argv[2])

          if abs(actual - target) > 0.30:
              raise SystemExit(
                  f"ERROR: Core video duration {actual}s "
                  f"does not match target {target}s"
              )

          PY

          echo "TIMELINE : VERIFIED"


      # ==========================================================
      # 15. GENERATE ASS SUBTITLES
      # ==========================================================

      - name: Generate ASS subtitles
        shell: bash
        run: |
          set -e

          CONFIG="${{ inputs.config }}"

          python3 - "$CONFIG" <<'PY'

          import json
          import re
          import sys
          from pathlib import Path

          config_path = sys.argv[1]

          with open(config_path, "r", encoding="utf-8") as f:
              config = json.load(f)

          Path("work").mkdir(exist_ok=True)

          def ass_color(hex_color):

              value = str(hex_color).strip().upper()

              if not re.fullmatch(r"#?[0-9A-F]{6}", value):
                  raise ValueError(
                      f"Invalid subtitle colour: {hex_color}"
                  )

              value = value.replace("#", "")

              rr = value[0:2]
              gg = value[2:4]
              bb = value[4:6]

              return f"&H00{bb}{gg}{rr}"

          def ass_time(seconds):

              seconds = float(seconds)

              hours = int(seconds // 3600)

              minutes = int(
                  (seconds % 3600) // 60
              )

              secs = seconds % 60

              return (
                  f"{hours}:"
                  f"{minutes:02d}:"
                  f"{secs:05.2f}"
              )

          lines = [

              "[Script Info]",

              "ScriptType: v4.00+",

              "PlayResX: 1080",

              "PlayResY: 1920",

              "ScaledBorderAndShadow: yes",

              "WrapStyle: 2",

              "",

              "[V4+ Styles]",

              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",

              "Default,Arial,80,&H00FFFFFF,&H00FFFFFF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,5,3,2,90,90,100,1",

              "",

              "[Events]",

              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"

          ]

          dialogue_count = 0

          for scene in config.get("scenes", []):

              subtitle = scene.get("subtitle", {})

              if not subtitle.get("enabled", False):
                  continue

              style = subtitle.get("style", {})

              scene_id = scene["id"]

              text = str(
                  subtitle.get("text", "")
              )

              size = int(
                  style.get("size", 80)
              )

              color = ass_color(
                  style.get("color", "#FFFFFF")
              )

              bold = (
                  1
                  if style.get("bold", False)
                  else 0
              )

              italic = (
                  1
                  if style.get("italic", False)
                  else 0
              )

              position = style.get(
                  "position",
                  {}
              )

              x = int(
                  position.get("x", 540)
              )

              y = int(
                  position.get("y", 1580)
              )

              outline = int(
                  style.get("outline", 5)
              )

              shadow = int(
                  style.get("shadow", 3)
              )

              start = ass_time(
                  scene["start"]
              )

              end = ass_time(
                  scene["end"]
              )

              text = (
                  text
                  .replace("{", r"\{")
                  .replace("}", r"\}")
                  .replace("\n", r"\N")
              )

              inline = (
                  f"{{\\fs{size}"
                  f"\\c{color}"
                  f"\\b{bold}"
                  f"\\i{italic}"
                  f"\\bord{outline}"
                  f"\\shad{shadow}"
                  f"\\q2"
                  f"\\pos({x},{y})}}"
              )

              dialogue = (
                  f"Dialogue: 0,"
                  f"{start},"
                  f"{end},"
                  f"Default,,0,0,0,,"
                  f"{inline}{text}"
              )

              lines.append(dialogue)

              dialogue_count += 1

              print(
                  f"Scene {scene_id} subtitle : GENERATED"
              )

          Path(
              "work/subtitles.ass"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(
              f"Subtitle events : {dialogue_count}"
          )

          print(
              "ASS SUBTITLES : GENERATED"
          )

          PY


      # ==========================================================
      # 16. VERIFY ASS SUBTITLES
      #
      # Dynamic verification.
      # No hard-coded requirement for:
      # white / bold / italic / line break.
      # ==========================================================

      - name: Verify ASS subtitles
        shell: bash
        run: |
          set -e

          CONFIG="${{ inputs.config }}"

          python3 - "$CONFIG" <<'PY'

          import json
          import re
          import sys

          config_path = sys.argv[1]

          with open(config_path, "r", encoding="utf-8") as f:
              config = json.load(f)

          with open(
              "work/subtitles.ass",
              "r",
              encoding="utf-8"
          ) as f:
              text = f.read()

          dialogue = [
              line
              for line in text.splitlines()
              if line.startswith("Dialogue:")
          ]

          expected = [
              scene
              for scene in config.get("scenes", [])
              if scene.get(
                  "subtitle",
                  {}
              ).get(
                  "enabled",
                  False
              )
          ]

          print(
              f"Dialogue events : {len(dialogue)}"
          )

          print(
              f"Expected events : {len(expected)}"
          )

          if len(dialogue) != len(expected):
              raise SystemExit(
                  "ERROR: Subtitle event count mismatch."
              )

          for index, (line, scene) in enumerate(
              zip(dialogue, expected),
              start=1
          ):

              style = scene.get(
                  "subtitle",
                  {}
              ).get(
                  "style",
                  {}
              )

              size = int(
                  style.get("size", 80)
              )

              bold = (
                  1
                  if style.get("bold", False)
                  else 0
              )

              italic = (
                  1
                  if style.get("italic", False)
                  else 0
              )

              if not re.search(
                  rf"\\fs{size}\b",
                  line
              ):
                  raise SystemExit(
                      f"ERROR: Subtitle {index} "
                      f"font size mismatch."
                  )

              if not re.search(
                  rf"\\b{bold}\b",
                  line
              ):
                  raise SystemExit(
                      f"ERROR: Subtitle {index} "
                      f"bold setting mismatch."
                  )

              if not re.search(
                  rf"\\i{italic}\b",
                  line
              ):
                  raise SystemExit(
                      f"ERROR: Subtitle {index} "
                      f"italic setting mismatch."
                  )

              if "\\pos(" not in line:
                  raise SystemExit(
                      f"ERROR: Subtitle {index} "
                      f"position missing."
                  )

          print(
              "ASS FORMATTING : VERIFIED"
          )

          PY


      # ==========================================================
      # 17. BURN SUBTITLES
      # ==========================================================

      - name: Burn subtitles into video
        shell: bash
        run: |
          set -e

          ffmpeg -y \
            -i work/video_core.mp4 \
            -vf "ass=work/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -an \
            work/video_subtitled.mp4

          if [ ! -s work/video_subtitled.mp4 ]; then
            echo "ERROR: Subtitle video was not created."
            exit 1
          fi

          echo "SUBTITLES : BURNED"


      # ==========================================================
      # 18. ADD CONTINUOUS NARRATION
      # ==========================================================

      - name: Add continuous narration
        shell: bash
        run: |
          set -e

          CONFIG="${{ inputs.config }}"

          AUDIO=$(jq -r '.narration.source' "$CONFIG")

          echo "======================================"
          echo "ADDING CONTINUOUS NARRATION"
          echo "======================================"

          echo "Audio source : $AUDIO"
          echo "Target       : ${TARGET_DURATION}s"

          ffmpeg -y \
            -stream_loop -1 \
            -i "$AUDIO" \
            -i work/video_subtitled.mp4 \
            -map 1:v:0 \
            -map 0:a:0 \
            -t "$TARGET_DURATION" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -ac 2 \
            -movflags +faststart \
            "output/${{ inputs.output_file }}"

          if [ ! -s "output/${{ inputs.output_file }}" ]; then
            echo "ERROR: Final MP4 was not created."
            exit 1
          fi

          echo "FINAL MP4 : CREATED"


      # ==========================================================
      # 19. FINAL VIDEO VALIDATION
      # ==========================================================

      - name: Validate final MP4
        shell: bash
        run: |
          set -e

          FINAL="output/${{ inputs.output_file }}"

          echo "======================================"
          echo "FINAL MP4 VALIDATION"
          echo "======================================"

          if [ ! -f "$FINAL" ]; then
            echo "ERROR: Final MP4 missing."
            exit 1
          fi

          SIZE=$(stat -c%s "$FINAL")

          if [ "$SIZE" -le 0 ]; then
            echo "ERROR: Final MP4 is empty."
            exit 1
          fi

          echo "File size : $SIZE bytes"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -of default=noprint_wrappers=1 \
            "$FINAL"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$FINAL"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries \
            stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$FINAL"

          VIDEO_DURATION=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$FINAL"
          )

          python3 - "$VIDEO_DURATION" "$TARGET_DURATION" <<'PY'

          import sys

          actual = float(sys.argv[1])
          target = float(sys.argv[2])

          print(
              f"Final duration : {actual}s"
          )

          print(
              f"Target duration: {target}s"
          )

          if abs(actual - target) > 0.30:
              raise SystemExit(
                  f"ERROR: Final duration "
                  f"{actual}s differs from target "
                  f"{target}s"
              )

          PY

          echo "FINAL VIDEO : VALID"


      # ==========================================================
      # 20. VERIFY AUDIO STREAM
      # ==========================================================

      - name: Verify final audio
        shell: bash
        run: |
          set -e

          FINAL="output/${{ inputs.output_file }}"

          AUDIO_STREAMS=$(
            ffprobe \
              -v error \
              -select_streams a \
              -show_entries stream=index \
              -of csv=p=0 \
              "$FINAL" | wc -l
          )

          echo "Audio streams : $AUDIO_STREAMS"

          if [ "$AUDIO_STREAMS" -lt 1 ]; then
            echo "ERROR: Final video has no audio stream."
            exit 1
          fi

          AUDIO_DURATION=$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$FINAL"
          )

          echo "Audio duration : ${AUDIO_DURATION}s"

          python3 - "$AUDIO_DURATION" "$TARGET_DURATION" <<'PY'

          import sys

          actual = float(sys.argv[1])
          target = float(sys.argv[2])

          if actual < target - 0.30:
              raise SystemExit(
                  f"ERROR: Audio duration "
                  f"{actual}s is shorter than "
                  f"target {target}s"
              )

          PY

          echo "AUDIO : VERIFIED"


      # ==========================================================
      # 21. FINAL RENDER REPORT
      # ==========================================================

      - name: Render completion report
        shell: bash
        run: |

          echo "======================================"
          echo "AICAP FREE VIDEO RENDER"
          echo "======================================"

          echo "Job ID       : ${{ inputs.job_id }}"
          echo "Video ID     : ${{ inputs.video_id }}"
          echo "Script ID    : ${{ inputs.script_id }}"

          echo "Resolution   : ${WIDTH}x${HEIGHT}"
          echo "FPS          : ${FPS}"
          echo "Duration     : ${TARGET_DURATION}s"

          echo "Motion       : VERIFIED"
          echo "Zoom In      : VERIFIED"
          echo "Zoom Out     : VERIFIED"
          echo "Pan Left     : VERIFIED"
          echo "Pan Right    : VERIFIED"

          echo "Transition   : VERIFIED"

          echo "Subtitles    : VERIFIED"
          echo "Colour       : VERIFIED"
          echo "Bold         : VERIFIED"
          echo "Italic       : VERIFIED"
          echo "Position     : VERIFIED"
          echo "Outline      : VERIFIED"
          echo "Shadow       : VERIFIED"

          echo "Audio        : VERIFIED"
          echo "Timeline     : VERIFIED"

          echo "Output       : output/${{ inputs.output_file }}"

          echo "======================================"
          echo "AICAP RENDER : SUCCESS"
          echo "======================================"


      # ==========================================================
      # 22. UPLOAD FINAL MP4 ARTIFACT
      # ==========================================================

      - name: Upload final MP4 artifact
        uses: actions/upload-artifact@v4

        with:

          name: aicap-video-${{ inputs.job_id }}

          path: output/${{ inputs.output_file }}

          if-no-files-found: error

          retention-days: 7
