name: AICAP FREE VIDEO RENDER

on:
  workflow_dispatch:
    inputs:

      job_id:
        description: "AICAP Render Job ID"
        required: true
        type: string

      video_id:
        description: "AICAP Video ID"
        required: true
        type: string

      script_id:
        description: "AICAP Script ID"
        required: false
        type: string
        default: ""

      input_root:
        description: "AICAP GitHub input directory"
        required: true
        type: string

      output_file:
        description: "Final MP4 file name"
        required: true
        type: string

      config:
        description: "Scene configuration JSON path"
        required: true
        type: string


jobs:

  render:

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 01. CHECKOUT
      # ==========================================================

      - name: Checkout repository

        uses: actions/checkout@v6


      # ==========================================================
      # 02. INSTALL TOOLS
      # ==========================================================

      - name: Install FFmpeg jq and Python

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "AICAP FREE VIDEO RENDERER"
          echo "PRODUCTION RENDER"
          echo "======================================"

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            python3

          echo "FFmpeg : INSTALLED"
          echo "jq     : INSTALLED"
          echo "Python : INSTALLED"


      # ==========================================================
      # 03. VERIFY INPUT PARAMETERS
      # ==========================================================

      - name: Verify render parameters

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "RENDER PARAMETERS"
          echo "======================================"

          echo "Job ID      : ${{ inputs.job_id }}"
          echo "Video ID    : ${{ inputs.video_id }}"
          echo "Script ID   : ${{ inputs.script_id }}"
          echo "Input Root  : ${{ inputs.input_root }}"
          echo "Output File : ${{ inputs.output_file }}"
          echo "Config      : ${{ inputs.config }}"

          if [ -z "${{ inputs.job_id }}" ]; then
            echo "ERROR: job_id missing."
            exit 1
          fi

          if [ -z "${{ inputs.input_root }}" ]; then
            echo "ERROR: input_root missing."
            exit 1
          fi

          if [ -z "${{ inputs.config }}" ]; then
            echo "ERROR: config missing."
            exit 1
          fi


      # ==========================================================
      # 04. LOAD CONFIGURATION
      # ==========================================================

      - name: Load AICAP scene configuration

        shell: bash

        run: |

          set -e

          CONFIG="${{ inputs.config }}"

          echo "======================================"
          echo "LOADING AICAP SCENE CONFIGURATION"
          echo "======================================"

          if [ ! -f "$CONFIG" ]; then

            echo "ERROR: Configuration file not found:"
            echo "$CONFIG"

            exit 1

          fi

          jq empty "$CONFIG"

          WIDTH=$(jq -r '.project.resolution.width' "$CONFIG")
          HEIGHT=$(jq -r '.project.resolution.height' "$CONFIG")
          FPS=$(jq -r '.project.fps' "$CONFIG")
          TARGET_DURATION=$(jq -r '.project.total_duration' "$CONFIG")
          TRANSITION_TYPE=$(jq -r '.transition.type' "$CONFIG")
          TRANSITION_DURATION=$(jq -r '.transition.duration' "$CONFIG")

          echo "WIDTH=$WIDTH" >> "$GITHUB_ENV"
          echo "HEIGHT=$HEIGHT" >> "$GITHUB_ENV"
          echo "FPS=$FPS" >> "$GITHUB_ENV"
          echo "TARGET_DURATION=$TARGET_DURATION" >> "$GITHUB_ENV"
          echo "TRANSITION_TYPE=$TRANSITION_TYPE" >> "$GITHUB_ENV"
          echo "TRANSITION_DURATION=$TRANSITION_DURATION" >> "$GITHUB_ENV"

          echo "Resolution : ${WIDTH}x${HEIGHT}"
          echo "FPS        : $FPS"
          echo "Duration   : $TARGET_DURATION"
          echo "Transition : $TRANSITION_TYPE"
          echo "Transition Duration : $TRANSITION_DURATION"

          echo "CONFIGURATION : VALID"


      # ==========================================================
      # 05. VERIFY AICAP RESOLUTION
      # ==========================================================

      - name: Verify AICAP video format

        shell: bash

        run: |

          set -e

          if [ "$WIDTH" -ne 1080 ]; then
            echo "ERROR: Width must be 1080."
            exit 1
          fi

          if [ "$HEIGHT" -ne 1920 ]; then
            echo "ERROR: Height must be 1920."
            exit 1
          fi

          if [ "$FPS" -ne 30 ]; then
            echo "ERROR: FPS must be 30."
            exit 1
          fi

          echo "1080x1920 : VERIFIED"
          echo "30 FPS     : VERIFIED"


      # ==========================================================
      # 06. CREATE WORK DIRECTORIES
      # ==========================================================

      - name: Prepare render directories

        shell: bash

        run: |

          set -e

          rm -rf work

          mkdir -p work

          mkdir -p output

          echo "Render directories ready."


      # ==========================================================
      # 07. VERIFY SCENE TIMELINE
      # ==========================================================

      - name: Validate scene timeline

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "SCENE TIMELINE VALIDATION"
          echo "======================================"

          CONFIG="${{ inputs.config }}"

          COUNT=$(jq '.scenes | length' "$CONFIG")

          if [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No scenes found."
            exit 1
          fi

          EXPECTED_START="0"

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" "$CONFIG")

            START=$(jq -r ".scenes[$INDEX].start" "$CONFIG")

            DURATION=$(jq -r ".scenes[$INDEX].duration" "$CONFIG")

            END=$(jq -r ".scenes[$INDEX].end" "$CONFIG")

            echo "Scene $ID : $START → $END"

            if [ "$START" != "$EXPECTED_START" ]; then

              echo "ERROR: Scene $ID start mismatch."

              exit 1

            fi

            CALCULATED_END=$(
              python3 -c \
              "print(round(float('$START') + float('$DURATION'), 3))"
            )

            if [ "$END" != "$CALCULATED_END" ]; then

              echo "ERROR: Scene $ID end mismatch."

              exit 1

            fi

            EXPECTED_START="$END"

          done

          python3 - <<PY

          actual = float("$EXPECTED_START")
          target = float("$TARGET_DURATION")

          if abs(actual - target) > 0.01:
              raise SystemExit(
                  f"ERROR: Scene timeline {actual}s != target {target}s"
              )

          PY

          echo "SCENE TIMELINE : VALID"


      # ==========================================================
      # 08. VERIFY NARRATION TIMELINE
      # ==========================================================

      - name: Validate narration timeline

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "NARRATION TIMELINE VALIDATION"
          echo "======================================"

          CONFIG="${{ inputs.config }}"

          COUNT=$(jq '.narration.segments | length' "$CONFIG")

          if [ "$COUNT" -lt 1 ]; then

            echo "ERROR: Narration segments missing."

            exit 1

          fi

          EXPECTED_START="0"

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".narration.segments[$INDEX].id" "$CONFIG")

            START=$(jq -r ".narration.segments[$INDEX].start" "$CONFIG")

            DURATION=$(jq -r ".narration.segments[$INDEX].duration" "$CONFIG")

            END=$(jq -r ".narration.segments[$INDEX].end" "$CONFIG")

            echo "Narration $ID : $START → $END"

            if [ "$START" != "$EXPECTED_START" ]; then

              echo "ERROR: Narration start mismatch."

              exit 1

            fi

            CALCULATED_END=$(
              python3 -c \
              "print(round(float('$START') + float('$DURATION'), 3))"
            )

            if [ "$END" != "$CALCULATED_END" ]; then

              echo "ERROR: Narration end mismatch."

              exit 1

            fi

            EXPECTED_START="$END"

          done

          python3 - <<PY

          actual = float("$EXPECTED_START")
          target = float("$TARGET_DURATION")

          if abs(actual - target) > 0.01:
              raise SystemExit(
                  f"ERROR: Narration timeline {actual}s != target {target}s"
              )

          PY

          echo "NARRATION TIMELINE : VALID"


      # ==========================================================
      # 09. VERIFY SCENE / AUDIO SYNCHRONIZATION
      # ==========================================================

      - name: Verify scene and narration synchronization

        shell: bash

        run: |

          set -e

          CONFIG="${{ inputs.config }}"

          SCENE_COUNT=$(jq '.scenes | length' "$CONFIG")

          AUDIO_COUNT=$(jq '.narration.segments | length' "$CONFIG")

          if [ "$SCENE_COUNT" -ne "$AUDIO_COUNT" ]; then

            echo "ERROR: Scene count and narration count differ."

            exit 1

          fi

          for INDEX in $(seq 0 $((SCENE_COUNT - 1)))
          do

            SCENE_START=$(jq -r ".scenes[$INDEX].start" "$CONFIG")
            SCENE_END=$(jq -r ".scenes[$INDEX].end" "$CONFIG")

            AUDIO_START=$(jq -r ".narration.segments[$INDEX].start" "$CONFIG")
            AUDIO_END=$(jq -r ".narration.segments[$INDEX].end" "$CONFIG")

            if [ "$SCENE_START" != "$AUDIO_START" ]; then

              echo "ERROR: Scene/audio start mismatch."

              exit 1

            fi

            if [ "$SCENE_END" != "$AUDIO_END" ]; then

              echo "ERROR: Scene/audio end mismatch."

              exit 1

            fi

          done

          echo "SCENE / AUDIO SYNC : VERIFIED"


      # ==========================================================
      # 10. VERIFY ALL SCENE ASSETS
      # ==========================================================

      - name: Verify scene images and narration

        shell: bash

        run: |

          set -e

          CONFIG="${{ inputs.config }}"

          COUNT=$(jq '.scenes | length' "$CONFIG")

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            IMAGE=$(jq -r ".scenes[$INDEX].image" "$CONFIG")

            if [ ! -f "$IMAGE" ]; then

              echo "ERROR: Missing scene image:"
              echo "$IMAGE"

              exit 1

            fi

            echo "FOUND: $IMAGE"

          done

          AUDIO=$(jq -r '.narration.source' "$CONFIG")

          if [ ! -f "$AUDIO" ]; then

            echo "ERROR: Missing narration:"
            echo "$AUDIO"

            exit 1

          fi

          echo "FOUND: $AUDIO"

          echo "ALL INPUT ASSETS : VERIFIED"


      # ==========================================================
      # 11. VERIFY NARRATION DURATION
      # ==========================================================

      - name: Verify narration audio

        shell: bash

        run: |

          set -e

          CONFIG="${{ inputs.config }}"

          AUDIO=$(jq -r '.narration.source' "$CONFIG")

          AUDIO_DURATION=$(

            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$AUDIO"

          )

          echo "Narration duration : ${AUDIO_DURATION}s"
          echo "Timeline duration  : ${TARGET_DURATION}s"

          if ! awk \
            -v duration="$AUDIO_DURATION" \
            'BEGIN { exit !(duration > 0) }'
          then

            echo "ERROR: Narration audio has invalid duration."

            exit 1

          fi

          echo "NARRATION AUDIO : VERIFIED"


      # ==========================================================
      # 12. RENDER SCENES
      #
      # SAME MOTION ENGINE PROVEN IN TEST 16
      # ==========================================================

      - name: Render all scenes

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "RENDERING AICAP SCENES"
          echo "======================================"

          CONFIG="${{ inputs.config }}"

          COUNT=$(jq '.scenes | length' "$CONFIG")

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" "$CONFIG")

            IMAGE=$(jq -r ".scenes[$INDEX].image" "$CONFIG")

            DURATION=$(jq -r ".scenes[$INDEX].duration" "$CONFIG")

            MOTION=$(jq -r ".scenes[$INDEX].motion" "$CONFIG")

            if [ "$INDEX" -lt $((COUNT - 1)) ]; then

              RENDER_DURATION=$(
                python3 -c \
                "print(float('$DURATION') + float('$TRANSITION_DURATION'))"
              )

            else

              RENDER_DURATION="$DURATION"

            fi

            OUTPUT="work/scene_${ID}.mp4"

            echo "--------------------------------------"
            echo "Scene    : $ID"
            echo "Duration : $DURATION"
            echo "Render   : $RENDER_DURATION"
            echo "Motion   : $MOTION"
            echo "--------------------------------------"

            case "$MOTION" in

              zoom_in)

                ffmpeg -y \
                  -loop 1 \
                  -framerate "$FPS" \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='min(zoom+0.0015,1.15)':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"

                ;;


              zoom_out)

                ffmpeg -y \
                  -loop 1 \
                  -framerate "$FPS" \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='if(eq(on,0),1.15,max(zoom-0.0015,1.0))':x='(iw-iw/zoom)/2':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"

                ;;


              pan_left)

                ffmpeg -y \
                  -loop 1 \
                  -framerate "$FPS" \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='1.10':x='(iw-iw/zoom)*(1-on/(30*${RENDER_DURATION}))':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"

                ;;


              pan_right)

                ffmpeg -y \
                  -loop 1 \
                  -framerate "$FPS" \
                  -i "$IMAGE" \
                  -t "$RENDER_DURATION" \
                  -vf "scale=2160:3840:force_original_aspect_ratio=increase,crop=2160:3840,zoompan=z='1.10':x='(iw-iw/zoom)*(on/(30*${RENDER_DURATION}))':y='(ih-ih/zoom)/2':d=1:s=1080x1920:fps=30,format=yuv420p" \
                  -c:v libx264 \
                  -preset veryfast \
                  -pix_fmt yuv420p \
                  -r 30 \
                  -an \
                  "$OUTPUT"

                ;;


              *)

                echo "ERROR: Unsupported motion:"
                echo "$MOTION"

                exit 1

                ;;

            esac

            if [ ! -s "$OUTPUT" ]; then

              echo "ERROR: Scene $ID rendering failed."

              exit 1

            fi

            echo "Scene $ID : RENDERED"

          done

          echo "ALL SCENES : RENDERED"


      # ==========================================================
      # 13. BUILD SCENE TRANSITIONS
      # ==========================================================

      - name: Build video timeline

        shell: bash

        run: |

          set -e

          CONFIG="${{ inputs.config }}"

          COUNT=$(jq '.scenes | length' "$CONFIG")

          INPUT_ARGS=()

          for INDEX in $(seq 0 $((COUNT - 1)))
          do

            ID=$(jq -r ".scenes[$INDEX].id" "$CONFIG")

            INPUT_ARGS+=(
              -i
              "work/scene_${ID}.mp4"
            )

          done

          FILTER=""

          for INDEX in $(seq 1 $((COUNT - 1)))
          do

            PREVIOUS_INDEX=$((INDEX - 1))

            if [ "$INDEX" -eq 1 ]; then

              PREVIOUS_LABEL="[0:v]"

            else

              PREVIOUS_LABEL="[v${PREVIOUS_INDEX}]"

            fi

            CURRENT_START=$(
              jq -r \
              ".scenes[$INDEX].start" \
              "$CONFIG"
            )

            FILTER="${FILTER}${PREVIOUS_LABEL}[${INDEX}:v]xfade=transition=fade:duration=${TRANSITION_DURATION}:offset=${CURRENT_START}[v${INDEX}];"

          done

          FINAL_LABEL="[v$((COUNT - 1))]"

          ffmpeg -y \
            "${INPUT_ARGS[@]}" \
            -filter_complex "$FILTER" \
            -map "$FINAL_LABEL" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -an \
            work/video_core.mp4

          if [ ! -s work/video_core.mp4 ]; then

            echo "ERROR: Core video was not created."

            exit 1

          fi

          echo "TIMELINE : BUILT"


      # ==========================================================
      # 14. GENERATE ASS SUBTITLES
      #
      # SAME STYLING SYSTEM PROVEN IN TEST 16
      # ==========================================================

      - name: Generate ASS subtitles

        shell: bash

        run: |

          set -e

          CONFIG="${{ inputs.config }}"

          python3 <<'PY'

          import json
          from pathlib import Path

          CONFIG = "${{ inputs.config }}"

          with open(CONFIG, "r", encoding="utf-8") as f:
              config = json.load(f)

          Path("work").mkdir(exist_ok=True)

          ASS_COLORS = {
              "#FFFFFF": "&H00FFFFFF",
              "#FFFF00": "&H0000FFFF",
              "#00FFFF": "&H00FFFF00",
              "#00FF00": "&H0000FF00"
          }

          def ass_time(seconds):

              seconds = float(seconds)

              hours = int(seconds // 3600)

              minutes = int(
                  (seconds % 3600) // 60
              )

              secs = seconds % 60

              return (
                  f"{hours}:"
                  f"{minutes:02d}:"
                  f"{secs:05.2f}"
              )

          lines = [

              "[Script Info]",

              "ScriptType: v4.00+",

              "PlayResX: 1080",

              "PlayResY: 1920",

              "ScaledBorderAndShadow: yes",

              "WrapStyle: 0",

              "",

              "[V4+ Styles]",

              "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding",

              "Default,Arial,80,&H00FFFFFF,&H00FFFFFF,&H00000000,&H00000000,0,0,0,0,100,100,0,0,1,5,3,2,90,90,100,1",

              "",

              "[Events]",

              "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text"

          ]

          for scene in config["scenes"]:

              subtitle = scene.get(
                  "subtitle",
                  {}
              )

              if not subtitle.get(
                  "enabled",
                  False
              ):
                  continue

              style = subtitle.get(
                  "style",
                  {}
              )

              scene_id = scene["id"]

              text = str(
                  subtitle.get(
                      "text",
                      ""
                  )
              )

              size = int(
                  style.get(
                      "size",
                      80
                  )
              )

              color_hex = str(
                  style.get(
                      "color",
                      "#FFFFFF"
                  )
              ).upper()

              if color_hex not in ASS_COLORS:

                  raise ValueError(
                      "Unsupported subtitle colour "
                      f"in Scene {scene_id}: "
                      f"{color_hex}"
                  )

              ass_color = ASS_COLORS[
                  color_hex
              ]

              bold = (
                  1
                  if style.get(
                      "bold",
                      False
                  )
                  else 0
              )

              italic = (
                  1
                  if style.get(
                      "italic",
                      False
                  )
                  else 0
              )

              position = style.get(
                  "position",
                  {}
              )

              x = int(
                  position.get(
                      "x",
                      540
                  )
              )

              y = int(
                  position.get(
                      "y",
                      1580
                  )
              )

              outline = int(
                  style.get(
                      "outline",
                      5
                  )
              )

              shadow = int(
                  style.get(
                      "shadow",
                      3
                  )
              )

              start = ass_time(
                  scene["start"]
              )

              end = ass_time(
                  scene["end"]
              )

              text = (
                  text
                  .replace(
                      "{",
                      r"\{"
                  )
                  .replace(
                      "}",
                      r"\}"
                  )
                  .replace(
                      "\n",
                      r"\N"
                  )
              )

              inline = (
                  f"{{\\fs{size}"
                  f"\\c{ass_color}"
                  f"\\b{bold}"
                  f"\\i{italic}"
                  f"\\bord{outline}"
                  f"\\shad{shadow}"
                  f"\\q2"
                  f"\\pos({x},{y})}}"
              )

              dialogue = (
                  f"Dialogue: 0,"
                  f"{start},"
                  f"{end},"
                  f"Default,,0,0,0,,"
                  f"{inline}{text}"
              )

              lines.append(
                  dialogue
              )

          Path(
              "work/subtitles.ass"
          ).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(
              "ASS SUBTITLES : GENERATED"
          )

          PY


      # ==========================================================
      # 15. VERIFY ASS
      # ==========================================================

      - name: Verify ASS subtitles

        shell: bash

        run: |

          set -e

          echo "======================================"
          echo "ASS SUBTITLE VERIFICATION"
          echo "======================================"

          if [ ! -s work/subtitles.ass ]; then

            echo "ERROR: subtitles.ass missing."

            exit 1

          fi

          DIALOGUE_COUNT=$(
            grep -c "^Dialogue:" \
            work/subtitles.ass || true
          )

          SCENE_COUNT=$(
            jq '.scenes | length' \
            "${{ inputs.config }}"
          )

          echo "Dialogue events : $DIALOGUE_COUNT"
          echo "Scenes          : $SCENE_COUNT"

          if [ "$DIALOGUE_COUNT" -ne "$SCENE_COUNT" ]; then

            echo "ERROR: Subtitle event count mismatch."

            exit 1

          fi

          if ! grep -q '\\fs' work/subtitles.ass; then
            echo "ERROR: Font size formatting missing."
            exit 1
          fi

          if ! grep -q '\\c&H00FFFFFF&' work/subtitles.ass; then
            echo "ERROR: White subtitle colour missing."
            exit 1
          fi

          if ! grep -q '\\b1' work/subtitles.ass; then
            echo "ERROR: Bold formatting missing."
            exit 1
          fi

          if ! grep -q '\\i1' work/subtitles.ass; then
            echo "ERROR: Italic formatting missing."
            exit 1
          fi

          if ! grep -q '\\N' work/subtitles.ass; then
            echo "ERROR: Subtitle line break missing."
            exit 1
          fi

          echo "ASS FORMATTING : VERIFIED"


      # ==========================================================
      # 16. BURN SUBTITLES
      # ==========================================================

      - name: Burn subtitles into video

        shell: bash

        run: |

          set -e

          ffmpeg -y \
            -i work/video_core.mp4 \
            -vf "ass=work/subtitles.ass" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -r 30 \
            -an \
            work/video_subtitled.mp4

          if [ ! -s work/video_subtitled.mp4 ]; then

            echo "ERROR: Subtitle video was not created."

            exit 1

          fi

          echo "SUBTITLES : BURNED"


      # ==========================================================
      # 17. ADD CONTINUOUS NARRATION
      #
      # If narration is shorter than the complete timeline,
      # loop it so the final timeline is fully covered.
      # ==========================================================

      - name: Add continuous narration

        shell: bash

        run: |

          set -e

          CONFIG="${{ inputs.config }}"

          AUDIO=$(jq -r '.narration.source' "$CONFIG")

          echo "======================================"
          echo "ADDING CONTINUOUS NARRATION"
          echo "======================================"

          echo "Audio source : $AUDIO"
          echo "Target       : ${TARGET_DURATION}s"

          ffmpeg -y \
            -stream_loop -1 \
            -i "$AUDIO" \
            -i work/video_subtitled.mp4 \
            -map 1:v:0 \
            -map 0:a:0 \
            -t "$TARGET_DURATION" \
            -c:v copy \
            -c:a aac \
            -b:a 192k \
            -ar 48000 \
            -ac 2 \
            -shortest \
            -movflags +faststart \
            "output/${{ inputs.output_file }}"

          if [ ! -s "output/${{ inputs.output_file }}" ]; then

            echo "ERROR: Final MP4 was not created."

            exit 1

          fi

          echo "FINAL MP4 : CREATED"


      # ==========================================================
      # 18. FINAL VIDEO VALIDATION
      # ==========================================================

      - name: Validate final MP4

        shell: bash

        run: |

          set -e

          FINAL="output/${{ inputs.output_file }}"

          echo "======================================"
          echo "FINAL MP4 VALIDATION"
          echo "======================================"

          if [ ! -f "$FINAL" ]; then

            echo "ERROR: Final MP4 missing."

            exit 1

          fi

          SIZE=$(stat -c%s "$FINAL")

          if [ "$SIZE" -le 0 ]; then

            echo "ERROR: Final MP4 is empty."

            exit 1

          fi

          echo "File size : $SIZE bytes"

          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -of default=noprint_wrappers=1 \
            "$FINAL"

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries \
            stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -of default=noprint_wrappers=1 \
            "$FINAL"

          ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries \
            stream=codec_name,sample_rate,channels \
            -of default=noprint_wrappers=1 \
            "$FINAL"

          VIDEO_DURATION=$(
            ffprobe \
              -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$FINAL"
          )

          python3 - <<PY

          actual = float("$VIDEO_DURATION")
          target = float("$TARGET_DURATION")

          if abs(actual - target) > 0.25:
              raise SystemExit(
                  f"ERROR: Final duration {actual}s differs from target {target}s"
              )

          PY

          echo "FINAL VIDEO : VALID"


      # ==========================================================
      # 19. VERIFY AUDIO STREAM
      # ==========================================================

      - name: Verify final audio

        shell: bash

        run: |

          set -e

          FINAL="output/${{ inputs.output_file }}"

          AUDIO_STREAMS=$(
            ffprobe \
              -v error \
              -select_streams a \
              -show_entries stream=index \
              -of csv=p=0 \
              "$FINAL" | wc -l
          )

          echo "Audio streams : $AUDIO_STREAMS"

          if [ "$AUDIO_STREAMS" -lt 1 ]; then

            echo "ERROR: Final video has no audio stream."

            exit 1

          fi

          AUDIO_DURATION=$(
            ffprobe \
              -v error \
              -select_streams a:0 \
              -show_entries stream=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$FINAL"
          )

          echo "Audio duration : ${AUDIO_DURATION}s"

          python3 - <<PY

          actual = float("$AUDIO_DURATION")
          target = float("$TARGET_DURATION")

          if actual < target - 0.25:
              raise SystemExit(
                  f"ERROR: Audio duration {actual}s is shorter than target {target}s"
              )

          PY

          echo "AUDIO : VERIFIED"


      # ==========================================================
      # 20. FINAL RENDER REPORT
      # ==========================================================

      - name: Render completion report

        shell: bash

        run: |

          echo "======================================"
          echo "AICAP FREE VIDEO RENDER"
          echo "======================================"

          echo "Job ID       : ${{ inputs.job_id }}"
          echo "Video ID     : ${{ inputs.video_id }}"
          echo "Script ID    : ${{ inputs.script_id }}"

          echo "Resolution   : ${WIDTH}x${HEIGHT}"
          echo "FPS          : ${FPS}"
          echo "Duration     : ${TARGET_DURATION}s"

          echo "Motion       : VERIFIED"
          echo "Subtitles    : VERIFIED"
          echo "Colour       : VERIFIED"
          echo "Bold         : VERIFIED"
          echo "Italic       : VERIFIED"
          echo "Line Breaks  : VERIFIED"
          echo "Audio        : VERIFIED"
          echo "Timeline     : VERIFIED"

          echo "Output       : output/${{ inputs.output_file }}"

          echo "======================================"
          echo "AICAP RENDER : SUCCESS"
          echo "======================================"


      # ==========================================================
      # 21. UPLOAD FINAL MP4
      #
      # IMPORTANT:
      # This name MUST match Module 20:
      #
      # aicap-video-{jobId}
      # ==========================================================

      - name: Upload final MP4 artifact

        uses: actions/upload-artifact@v4

        with:

          name: aicap-video-${{ inputs.job_id }}

          path: output/${{ inputs.output_file }}

          if-no-files-found: error

          retention-days: 7
